services:
  trading-app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - trading-data:/app/data
      - trading-models:/app/models
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  trading-data:
  trading-models:
