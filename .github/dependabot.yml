# Keeps the SHA-pinned GitHub Actions current. Pip updates are intentionally not
# automated here: dependency locks are regenerated by dependency-lock-resolution.yml.
# Docker base-image bumps are manual because CI requires Dockerfile and
# Dockerfile.verify to carry the same pinned python digest.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
