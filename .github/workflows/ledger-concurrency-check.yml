name: Ledger Concurrency Hardening (PostgreSQL Required)

on:
  pull_request:
    paths:
      - 'app/customer_funds.py'
      - 'app/db.py'
      - 'tests/test_postgres_ledger_concurrency_3_10_46.py'
      - 'tests/test_ledger_invariants_3_10_46.py'
      - 'tests/test_ledger_all_paths_concurrent_3_10_46.py'
      - 'requirements-dev.txt'
      - '.github/workflows/ledger-concurrency-check.yml'
  push:
    branches:
      - main
      - hardening/*

jobs:
  postgres-ledger-concurrency:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U atlas; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
          ATLAS_POSTGRES_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
        run: |
          alembic upgrade head

      - name: Verify SQLAlchemy ledger money types
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from app.db import CustomerLedgerAccount

          mapper = inspect(CustomerLedgerAccount)
          expected = {"available", "trading_reserved", "withdrawal_reserved"}
          seen = set()
          for col in mapper.columns:
              if col.name in expected:
                  seen.add(col.name)
                  print(f"{col.name}: type={col.type}, python_type={col.type.python_type}")
                  assert col.type.python_type.__name__ == "Decimal"
          assert seen == expected
          PY

      - name: Verify PostgreSQL ledger constraints
        env:
          PGPASSWORD: test_password
        run: |
          psql "postgresql://atlas@localhost:5432/atlas_test" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT constraint_name, constraint_type
          FROM information_schema.table_constraints
          WHERE table_name='customer_ledger_accounts'
          ORDER BY constraint_name;

          SELECT constraint_name
          FROM information_schema.check_constraints
          WHERE constraint_name IN (
            'ck_customer_ledger_available_nonnegative',
            'ck_customer_ledger_trading_reserved_nonnegative',
            'ck_customer_ledger_withdrawal_reserved_nonnegative'
          )
          ORDER BY constraint_name;

          DO $
          DECLARE
            required_count integer;
          BEGIN
            SELECT count(*) INTO required_count
            FROM information_schema.check_constraints
            WHERE constraint_name IN (
              'ck_customer_ledger_available_nonnegative',
              'ck_customer_ledger_trading_reserved_nonnegative',
              'ck_customer_ledger_withdrawal_reserved_nonnegative'
            );
            IF required_count <> 3 THEN
              RAISE EXCEPTION 'Expected 3 customer ledger nonnegative checks, found %', required_count;
            END IF;
          END $;
          SQL

      - name: Run ledger invariants test (SQLite baseline)
        run: |
          pytest -q tests/test_ledger_invariants_3_10_46.py -v

      - name: Run Postgres concurrency tests (MANDATORY)
        env:
          ATLAS_POSTGRES_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
          DATABASE_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
        run: |
          pytest -q tests/test_postgres_ledger_concurrency_3_10_46.py::test_concurrent_withdrawal_reserves_never_overdraw -vv --tb=short
          pytest -q tests/test_postgres_ledger_concurrency_3_10_46.py::test_withdrawal_reserve_acquires_row_lock_before_mutation -vv --tb=short -s
          pytest -q tests/test_postgres_ledger_concurrency_3_10_46.py -v
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "ERROR: Postgres concurrency tests failed. This is a BLOCKER for ledger safety."
            exit $EXIT_CODE
          fi

      - name: Run duplicate idempotency verification
        env:
          ATLAS_POSTGRES_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
          DATABASE_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
        run: |
          pytest -q tests/test_ledger_all_paths_concurrent_3_10_46.py::test_duplicate_idempotency_across_all_functions -vv --tb=short

      - name: Run comprehensive ledger path tests (MANDATORY)
        env:
          ATLAS_POSTGRES_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
          DATABASE_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
        run: |
          pytest -q tests/test_ledger_all_paths_concurrent_3_10_46.py -v --tb=short
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "ERROR: Ledger path concurrency tests failed. Some mutation paths may not be properly locked."
            exit $EXIT_CODE
          fi

      - name: Report success
        if: success()
        run: |
          echo "✓ Ledger concurrency tests PASSED"
          echo "✓ Invariants PASSED"
          echo "✓ All mutation paths tested PASSED"
          echo "✓ PostgreSQL ledger concurrency gate PASSED"
