name: Ledger Concurrency Hardening (PostgreSQL Required)

on:
  pull_request:
    paths:
      - 'app/customer_funds.py'
      - 'app/audit_chain.py'
      - 'app/db.py'
      - 'app/withdrawal_security.py'
      - 'app/main.py'
      - 'app/execution.py'
      - 'tests/test_opening_balance_journaled.py'
      - 'tests/test_audit_chain_lock_order.py'
      - 'tests/test_postgres_ledger_concurrency_3_10_46.py'
      - 'tests/test_ledger_invariants_3_10_46.py'
      - 'tests/test_ledger_all_paths_concurrent_3_10_46.py'
      - 'tests/test_unified_custody.py'
      # Changes to the customer paper execution/ledger/provisioning path must
      # receive the dedicated PostgreSQL gate, not only the general pytest job.
      - 'scripts/bootstrap_atlas_paper_staging_gcp.sh'
      - 'scripts/provision_customer_paper_schema.py'
      - 'scripts/setup_customer_paper_role_interactive.py'
      - 'tests/test_interactive_paper_role_setup.py'
      - 'app/customer_paper_*.py'
      - 'tests/test_customer_paper_*.py'
      - 'scripts/customer_paper_ledger_schema.sql'
      - 'app/paper_staging.py'
      - 'tests/test_paper_staging_runtime.py'
      - 'requirements-dev.txt'
      - 'alembic/**'
      - 'scripts/prune_safe_merged_branch_refs.py'
      - 'tests/test_branch_ref_pruning.py'
      - '.github/workflows/safe-merged-branch-pruning.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ledger-concurrency-check.yml'
      - 'scripts/migrate_legacy_native_ai.py'
      - 'tests/test_legacy_native_ai_migration.py'
  push:
    branches:
      - main
      - hardening/*

permissions:
  contents: read

jobs:
  postgres-ledger-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: development
      PAPER_TRADING: "true"
      LIVE_TRADING_ENABLED: "false"
      CUSTOMER_LIVE_TRADING_ENABLED: "false"
      BROKER_SANDBOX: "true"
      BACKGROUND_RECONCILIATION_ENABLED: "false"
      ADMIN_TOKEN: test-admin-token-for-ci

    services:
      postgres:
        image: docker.io/library/postgres:15-alpine
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install hash-locked Python dependencies
        run: |
          python -m pip install --upgrade "pip==25.3"
          MULTIDICT_NO_EXTENSIONS=1 python -m pip install --no-binary=multidict --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U atlas; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Run database migrations
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
          ATLAS_POSTGRES_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
        run: |
          alembic upgrade head
          alembic current
          alembic heads

      - name: Verify PostgreSQL custody decimal schema and exact round-trip
        env:
          PGPASSWORD: test_password
        run: |
          psql "postgresql://atlas@localhost:5432/atlas_test" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            col record;
            exact_value numeric(38,18) := 123456789.12345678;
            round_trip numeric(38,18);
          BEGIN
            FOR col IN
              SELECT table_name, column_name, data_type, numeric_precision, numeric_scale
              FROM information_schema.columns
              WHERE (table_name='custody_asset_observations' AND column_name='balance')
                 OR (table_name='custody_transfers' AND column_name='amount')
            LOOP
              IF col.data_type <> 'numeric' OR col.numeric_precision <> 38 OR col.numeric_scale <> 18 THEN
                RAISE EXCEPTION 'Unexpected custody schema for %.%: %(% , %)',
                  col.table_name, col.column_name, col.data_type, col.numeric_precision, col.numeric_scale;
              END IF;
            END LOOP;
            IF (SELECT count(*) FROM information_schema.columns
                WHERE (table_name='custody_asset_observations' AND column_name='balance')
                   OR (table_name='custody_transfers' AND column_name='amount')) <> 2 THEN
              RAISE EXCEPTION 'Expected both custody NUMERIC(38,18) columns to exist';
            END IF;
            CREATE TEMP TABLE custody_decimal_roundtrip(value numeric(38,18));
            INSERT INTO custody_decimal_roundtrip VALUES (exact_value);
            SELECT value INTO round_trip FROM custody_decimal_roundtrip;
            IF round_trip <> exact_value THEN
              RAISE EXCEPTION 'PostgreSQL custody decimal round-trip lost precision: % <> %', round_trip, exact_value;
            END IF;
          END $$;
          SQL

      - name: Verify SQLAlchemy ledger money types
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from app.db import CustomerLedgerAccount

          mapper = inspect(CustomerLedgerAccount)
          expected = {"available", "trading_reserved", "withdrawal_reserved"}
          seen = set()
          for col in mapper.columns:
              if col.name in expected:
                  seen.add(col.name)
                  print(f"{col.name}: type={col.type}, python_type={col.type.python_type}")
                  assert col.type.python_type.__name__ == "Decimal"
          assert seen == expected
          PY

      - name: Verify PostgreSQL ledger constraints
        env:
          PGPASSWORD: test_password
        run: |
          psql "postgresql://atlas@localhost:5432/atlas_test" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT constraint_name, constraint_type
          FROM information_schema.table_constraints
          WHERE table_name='customer_ledger_accounts'
          ORDER BY constraint_name;

          SELECT constraint_name
          FROM information_schema.check_constraints
          WHERE constraint_name IN (
            'ck_customer_ledger_available_nonnegative',
            'ck_customer_ledger_trading_reserved_nonnegative',
            'ck_customer_ledger_withdrawal_reserved_nonnegative'
          )
          ORDER BY constraint_name;

          DO $$
          DECLARE
            required_count integer;
          BEGIN
            SELECT count(*) INTO required_count
            FROM information_schema.check_constraints
            WHERE constraint_name IN (
              'ck_customer_ledger_available_nonnegative',
              'ck_customer_ledger_trading_reserved_nonnegative',
              'ck_customer_ledger_withdrawal_reserved_nonnegative'
            );
            IF required_count <> 3 THEN
              RAISE EXCEPTION 'Expected 3 customer ledger nonnegative checks, found %', required_count;
            END IF;
          END $$;
          SQL

      - name: Run ledger invariants test (SQLite baseline)
        run: |
          pytest -q tests/test_ledger_invariants_3_10_46.py -v

      - name: Run Postgres concurrency tests (MANDATORY)
        env:
          ATLAS_POSTGRES_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
          DATABASE_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
        run: |
          pytest -q tests/test_postgres_ledger_concurrency_3_10_46.py::test_concurrent_withdrawal_reserves_never_overdraw -vv --tb=short
          pytest -q tests/test_postgres_ledger_concurrency_3_10_46.py::test_withdrawal_reserve_acquires_row_lock_before_mutation -vv --tb=short -s
          pytest -q -rs --junitxml=pg-ledger.xml tests/test_postgres_ledger_concurrency_3_10_46.py -v
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "ERROR: Postgres concurrency tests failed. This is a BLOCKER for ledger safety."
            exit $EXIT_CODE
          fi

      - name: Run duplicate idempotency verification
        env:
          ATLAS_POSTGRES_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
          DATABASE_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
        run: |
          pytest -q tests/test_ledger_all_paths_concurrent_3_10_46.py::test_duplicate_idempotency_across_all_functions -vv --tb=short

      - name: Run comprehensive ledger path tests (MANDATORY)
        env:
          ATLAS_POSTGRES_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
          DATABASE_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
        run: |
          pytest -q -rs --junitxml=pg-paths.xml tests/test_ledger_all_paths_concurrent_3_10_46.py -v --tb=short
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "ERROR: Ledger path concurrency tests failed. Some mutation paths may not be properly locked."
            exit $EXIT_CODE
          fi

      - name: Provision isolated customer-paper PostgreSQL test database
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atlas -d atlas_test \
            -c "CREATE ROLE atlas_paper_app LOGIN NOINHERIT NOBYPASSRLS PASSWORD 'paper_test_password'"
          PGPASSWORD=test_password createdb -h 127.0.0.1 -U atlas atlas_paper_test
          PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atlas -d atlas_paper_test \
            -c "REVOKE CONNECT ON DATABASE atlas_paper_test FROM PUBLIC; GRANT CONNECT ON DATABASE atlas_paper_test TO atlas_paper_app"
          PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atlas -d atlas_paper_test \
            -v paper_runtime_role=atlas_paper_app -f scripts/customer_paper_ledger_schema.sql
          echo "ATLAS_PAPER_TEST_DATABASE_URL=postgresql+asyncpg://atlas_paper_app:paper_test_password@127.0.0.1:5432/atlas_paper_test" >> "$GITHUB_ENV"
          echo "ATLAS_PAPER_PRIMARY_TEST_DATABASE_URL=postgresql+asyncpg://atlas:test_password@127.0.0.1:5432/atlas_test" >> "$GITHUB_ENV"
          echo "ATLAS_PAPER_SHARED_PRIMARY_TEST_DATABASE_URL=postgresql+asyncpg://atlas:test_password@127.0.0.1:5432/atlas_paper_test" >> "$GITHUB_ENV"

      - name: Run customer-paper PostgreSQL and runtime tests (MANDATORY)
        env:
          ATLAS_POSTGRES_URL: postgresql+asyncpg://atlas:test_password@127.0.0.1:5432/atlas_test
          DATABASE_URL: postgresql+asyncpg://atlas:test_password@127.0.0.1:5432/atlas_test
        run: |
          pytest -q -rs --junitxml=pg-paper.xml \
            tests/test_customer_paper_*.py \
            tests/test_interactive_paper_role_setup.py \
            tests/test_paper_staging_runtime.py -v --tb=short
      - name: Reject skipped mandatory PostgreSQL tests
        run: python scripts/assert_no_skips.py pg-ledger.xml pg-paths.xml pg-paper.xml

      - name: Report success
        if: success()
        run: |
          echo "✓ Ledger concurrency tests PASSED"
          echo "✓ Invariants PASSED"
          echo "✓ All mutation paths tested PASSED"
          echo "✓ Customer-paper provisioning/runtime tests PASSED"
          echo "✓ PostgreSQL ledger concurrency gate PASSED"
