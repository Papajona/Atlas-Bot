name: Supabase Staging Identity Preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-supabase-staging-identity-preflight
  cancel-in-progress: false

jobs:
  verify-staging-identity:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[atlas-branch-prune-reviewed-once-20261020]'))
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Require exact main ref (branch protection is a separate repository setting)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "${GITHUB_SHA}"

      - name: Validate Google Cloud staging identity configuration before authentication
        shell: bash
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          PREFLIGHT_SERVICE_ACCOUNT: ${{ secrets.GCP_STAGING_PREFLIGHT_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$WIF_PROVIDER" ]] || missing+=("staging environment secret GCP_WORKLOAD_IDENTITY_PROVIDER")
          [[ -n "$PREFLIGHT_SERVICE_ACCOUNT" ]] || missing+=("staging environment secret GCP_STAGING_PREFLIGHT_SERVICE_ACCOUNT")
          [[ -n "$GCP_PROJECT_ID" ]] || missing+=("GCP_PROJECT_ID secret")
          [[ -n "$GCP_REGION" ]] || missing+=("GCP_REGION secret")
          if (("${#missing[@]}" > 0)); then
            printf 'BLOCKED: Google Cloud staging authentication cannot start; missing configuration:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi
          [[ "$WIF_PROVIDER" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]] || {
            echo "BLOCKED: GCP_WORKLOAD_IDENTITY_PROVIDER must be a full workload identity provider resource name."
            exit 1
          }
          [[ "$PREFLIGHT_SERVICE_ACCOUNT" == *@*.iam.gserviceaccount.com ]] || {
            echo "BLOCKED: GCP_STAGING_PREFLIGHT_SERVICE_ACCOUNT must be a Google service-account email."
            exit 1
          }
          echo "PASS: required staging identity inputs are present and structurally valid."

      - name: Authenticate to Google Cloud using protected staging environment
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGING_PREFLIGHT_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Require explicit staging target configuration (same-project supported)
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_PRODUCTION_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_DATABASE_SECRET }}
          STAGING_CLOUD_RUN_SERVICE: ${{ vars.ATLAS_STAGING_CLOUD_RUN_SERVICE }}
          EXPECTED_RUNTIME_SERVICE_ACCOUNT: ${{ vars.ATLAS_STAGING_RUNTIME_SERVICE_ACCOUNT }}
          EXPECTED_RUNTIME_DB_ROLE: ${{ vars.ATLAS_STAGING_RUNTIME_DB_ROLE }}
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Missing protected GCP_PROJECT_ID secret}"
          : "${GCP_REGION:?Missing protected GCP_REGION secret}"
          : "${PRODUCTION_SUPABASE_PROJECT_REF:?Set ATLAS_PRODUCTION_SUPABASE_PROJECT_REF to the current project ref (same as staging for the free single-project setup)}"
          : "${STAGING_SUPABASE_PROJECT_REF:?Set staging environment variable ATLAS_STAGING_SUPABASE_PROJECT_REF}"
          : "${STAGING_DATABASE_SECRET:?Set staging environment variable ATLAS_STAGING_DATABASE_SECRET}"
          : "${STAGING_CLOUD_RUN_SERVICE:?Set staging environment variable ATLAS_STAGING_CLOUD_RUN_SERVICE}"
          : "${EXPECTED_RUNTIME_SERVICE_ACCOUNT:?Set staging environment variable ATLAS_STAGING_RUNTIME_SERVICE_ACCOUNT}"
          : "${EXPECTED_RUNTIME_DB_ROLE:?Set staging environment variable ATLAS_STAGING_RUNTIME_DB_ROLE}"
          [[ "$PRODUCTION_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "BLOCKED: production project ref must be an explicit 20-character Supabase project ref"; exit 1; }
          [[ "$STAGING_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "BLOCKED: staging project ref must be an explicit 20-character Supabase project ref"; exit 1; }
          if [[ "$STAGING_SUPABASE_PROJECT_REF" == "$PRODUCTION_SUPABASE_PROJECT_REF" ]]; then
            echo "Same-project staging selected; paper/live/payout safety flags and the dedicated paper schema remain mandatory."
          fi
          [[ "$STAGING_DATABASE_SECRET" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "BLOCKED: invalid staging Secret Manager secret name"; exit 1; }
          [[ "$STAGING_CLOUD_RUN_SERVICE" =~ ^[a-z][a-z0-9-]{0,48}$ ]] || { echo "BLOCKED: invalid staging Cloud Run service name"; exit 1; }
          [[ "$EXPECTED_RUNTIME_SERVICE_ACCOUNT" =~ ^[a-zA-Z0-9._@-]+$ ]] || { echo "BLOCKED: invalid expected staging runtime service account"; exit 1; }
          [[ "$EXPECTED_RUNTIME_DB_ROLE" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]] || { echo "BLOCKED: invalid expected runtime database role"; exit 1; }
          [[ ! "$EXPECTED_RUNTIME_DB_ROLE" =~ ^(postgres|service_role|supabase_admin|supabase_auth_admin|authenticator|anon|authenticated)$ ]] || { echo "BLOCKED: reserved or privileged role is not an approved runtime database role"; exit 1; }
          echo "Explicit staging identity configuration is present; same-project staging is allowed."

      - name: Verify deployed staging Cloud Run identity and database secret wiring
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          STAGING_CLOUD_RUN_SERVICE: ${{ vars.ATLAS_STAGING_CLOUD_RUN_SERVICE }}
          EXPECTED_RUNTIME_SERVICE_ACCOUNT: ${{ vars.ATLAS_STAGING_RUNTIME_SERVICE_ACCOUNT }}
          STAGING_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_DATABASE_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys
          args = [
              "gcloud", "run", "services", "describe",
              os.environ["STAGING_CLOUD_RUN_SERVICE"],
              f"--project={os.environ['GCP_PROJECT_ID']}",
              f"--region={os.environ['GCP_REGION']}",
              "--format=json",
          ]
          result = subprocess.run(args, check=False, capture_output=True, text=True)
          if result.returncode:
              print("BLOCKED: unable to inspect the configured staging Cloud Run service; service output withheld")
              sys.exit(1)
          try:
              service = json.loads(result.stdout)
          except json.JSONDecodeError:
              print("BLOCKED: staging Cloud Run service description was not valid JSON")
              sys.exit(1)
          template = service.get("spec", {}).get("template") or service.get("template") or {}
          spec = template.get("spec", template)
          observed_sa = spec.get("serviceAccountName") or spec.get("serviceAccount") or ""
          if not observed_sa or observed_sa != os.environ["EXPECTED_RUNTIME_SERVICE_ACCOUNT"]:
              print("BLOCKED: deployed staging service account differs from ATLAS_STAGING_RUNTIME_SERVICE_ACCOUNT")
              sys.exit(1)
          refs = []
          for container in spec.get("containers", []) or []:
              for item in container.get("env", []) or []:
                  if item.get("name") != "DATABASE_URL":
                      continue
                  value_from = item.get("valueFrom") or {}
                  value_source = item.get("valueSource") or {}
                  ref = value_from.get("secretKeyRef") or value_source.get("secretKeyRef") or {}
                  refs.append(ref.get("name") or "")
          expected_secret = os.environ["STAGING_DATABASE_SECRET"]
          if len(refs) != 1 or refs[0] != expected_secret:
              print("BLOCKED: the deployed service DATABASE_URL must reference exactly the configured staging database secret")
              sys.exit(1)
          print("PASS: deployed staging runtime service account and DATABASE_URL secret reference match the protected staging configuration.")
          PY

      - name: Read staging database secret without printing credentials
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          STAGING_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_DATABASE_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          gcloud secrets versions access latest \
            --secret="$STAGING_DATABASE_SECRET" \
            --project="$GCP_PROJECT_ID" > "$RUNNER_TEMP/atlas-staging-db-url"
          test -s "$RUNNER_TEMP/atlas-staging-db-url"
          chmod 600 "$RUNNER_TEMP/atlas-staging-db-url"

      - name: Verify Supabase project, runtime role, and migration revision (read-only)
        shell: bash
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_STAGING_SUPABASE_PROJECT_REF }}
          EXPECTED_RUNTIME_DB_ROLE: ${{ vars.ATLAS_STAGING_RUNTIME_DB_ROLE }}
          EXPECTED_ALEMBIC_HEAD: "0053_supabase_public_default_acl_lockdown"
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          path = Path(os.environ["RUNNER_TEMP"]) / "atlas-staging-db-url"
          uri = path.read_text().strip()
          parsed = urlparse(uri)
          if parsed.scheme not in ("postgres", "postgresql") or not parsed.hostname:
              raise SystemExit("BLOCKED: staging database secret is not a valid PostgreSQL URI")
          expected = os.environ["STAGING_SUPABASE_PROJECT_REF"]
          host = parsed.hostname.lower()
          allowed_hosts = {f"db.{expected}.supabase.co", f"{expected}.supabase.co"}
          if host not in allowed_hosts:
              raise SystemExit("BLOCKED: database hostname does not match the explicitly configured staging Supabase project")
          if parsed.path.lstrip("/") != "postgres":
              raise SystemExit("BLOCKED: staging database name is not the expected postgres database")
          print("PASS: database URI hostname matches configured staging Supabase project; credentials were not printed")
          PY

          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          uri = Path(os.environ["RUNNER_TEMP"], "atlas-staging-db-url").read_text().strip()
          parsed = urlparse(uri)
          expected_role = os.environ["EXPECTED_RUNTIME_DB_ROLE"]
          # Put parsed credentials only in the child environment, never argv or logs.
          env = {k:v for k,v in os.environ.items() if k not in {"DATABASE_URL","PGPASSWORD","PGHOST","PGPORT","PGUSER","PGDATABASE"}}
          env.update({
              "PGHOST": parsed.hostname or "",
              "PGPORT": str(parsed.port or 5432),
              "PGUSER": unquote(parsed.username or ""),
              "PGPASSWORD": unquote(parsed.password or ""),
              "PGDATABASE": parsed.path.lstrip("/") or "",
              "PGSSLMODE": "require",
              "PGOPTIONS": "-c default_transaction_read_only=on -c statement_timeout=10000",
          })
          query = """
          SELECT current_database(), current_user, session_user,
                 (SELECT string_agg(version_num, ',' ORDER BY version_num) FROM public.alembic_version),
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname='public' AND c.relkind IN ('r','p')),
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname='public' AND c.relkind IN ('r','p') AND NOT c.relrowsecurity),
                 COALESCE((SELECT rolsuper FROM pg_roles WHERE rolname=current_user), false),
                 COALESCE((SELECT rolcreaterole FROM pg_roles WHERE rolname=current_user), false),
                 COALESCE((SELECT rolcreatedb FROM pg_roles WHERE rolname=current_user), false),
                 COALESCE((SELECT rolreplication FROM pg_roles WHERE rolname=current_user), false),
                 COALESCE((SELECT rolbypassrls FROM pg_roles WHERE rolname=current_user), false),
                 COALESCE((SELECT rolcanlogin FROM pg_roles WHERE rolname=current_user), false),
                 COALESCE((SELECT rolinherit FROM pg_roles WHERE rolname=current_user), true),
                 has_schema_privilege(current_user, 'public', 'USAGE'),
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname='public' AND c.relkind IN ('r','p') AND NOT has_table_privilege(current_user,c.oid,'SELECT')),
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname='public' AND c.relkind IN ('r','p') AND pg_get_userbyid(c.relowner)=current_user),
                 (SELECT count(*) FROM pg_auth_members membership
                   WHERE membership.member=(SELECT oid FROM pg_roles WHERE rolname=current_user)),
                 has_schema_privilege(current_user, 'public', 'CREATE'),
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname='public' AND c.relkind IN ('r','p')
                     AND NOT (has_table_privilege(current_user,c.oid,'INSERT')
                          AND has_table_privilege(current_user,c.oid,'UPDATE')
                          AND has_table_privilege(current_user,c.oid,'DELETE'))),
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname='public' AND c.relkind='S'
                     AND NOT has_sequence_privilege(current_user,c.oid,'USAGE'));
          """
          p = subprocess.run(
              ["psql", "-X", "-A", "-t", "-v", "ON_ERROR_STOP=1", "-c", query],
              check=False, capture_output=True, text=True, env=env,
          )
          if p.returncode:
              print("BLOCKED: read-only database identity query failed; database output withheld")
              sys.exit(1)
          fields = p.stdout.strip().split("|")
          if len(fields) != 20:
              raise SystemExit("BLOCKED: unexpected identity query output")
          (db, role, login_role, revision, table_count, unprotected_count, is_superuser,
           can_create_roles, can_create_databases, can_replicate, bypass_rls, can_login,
           can_inherit, public_schema_usage, tables_missing_select, owned_count,
           role_membership_count, public_schema_create, tables_missing_dml,
           sequences_missing_usage) = fields
          def is_true(value):
              # psql's default unaligned boolean representation is "t"/"f", not "true"/"false".
              return str(value).strip().lower() in {"t", "true", "1", "yes"}
          print(f"Observed database={db}, current_role={role}, login_role={login_role}, revision={revision or 'missing'}, public_tables={table_count}, tables_without_rls={unprotected_count}, superuser={is_superuser}, create_role={can_create_roles}, create_database={can_create_databases}, replication={can_replicate}, bypass_rls={bypass_rls}, can_login={can_login}, inherit={can_inherit}, public_schema_usage={public_schema_usage}, tables_missing_select={tables_missing_select}, tables_missing_dml={tables_missing_dml}, sequences_missing_usage={sequences_missing_usage}, public_schema_create={public_schema_create}, owned_public_tables={owned_count}, role_memberships={role_membership_count}")
          if db != "postgres":
              raise SystemExit("BLOCKED: unexpected staging database name")
          if login_role != role:
              raise SystemExit("BLOCKED: PostgreSQL session_user differs from current_user; SET ROLE or privileged login indirection is not permitted")
          if role != expected_role:
              raise SystemExit("BLOCKED: connected database role does not match configured staging runtime role")
          if role in {"postgres", "service_role", "supabase_admin", "supabase_auth_admin", "authenticator", "anon", "authenticated"}:
              raise SystemExit("BLOCKED: privileged, gateway, or public API role is not approved for Cloud Run runtime")
          if any(is_true(value) for value in (is_superuser, can_create_roles, can_create_databases, can_replicate)):
              raise SystemExit("BLOCKED: runtime database role has administrative privileges")
          if not is_true(can_login):
              raise SystemExit("BLOCKED: runtime database role is not a LOGIN role")
          if is_true(can_inherit):
              raise SystemExit("BLOCKED: runtime database role must be NOINHERIT; permissions must be directly granted")
          if not is_true(public_schema_usage):
              raise SystemExit("BLOCKED: runtime database role lacks USAGE on public schema")
          if not revision:
              raise SystemExit("BLOCKED: Alembic revision is missing or ambiguous")
          expected_head = os.environ["EXPECTED_ALEMBIC_HEAD"]
          if revision != expected_head:
              raise SystemExit(
                  f"BLOCKED: database revision must equal repository head {expected_head}; "
                  "apply the reviewed migration only to the approved staging target, then rerun this read-only preflight"
              )
          if int(table_count) == 0:
              raise SystemExit("BLOCKED: public schema table inventory is empty")
          if int(unprotected_count) > 0:
              raise SystemExit("BLOCKED: public tables without RLS remain; do not deploy until isolated staging migration tests pass")
          if not is_true(bypass_rls):
              raise SystemExit("BLOCKED: no table-specific RLS policies are installed; a reviewed trusted runtime role with BYPASSRLS is required for this backend-only access model")
          if int(tables_missing_select) > 0:
              raise SystemExit("BLOCKED: runtime role lacks direct SELECT privileges on one or more application tables")
          if is_true(public_schema_create):
              raise SystemExit("BLOCKED: runtime role must not have CREATE privilege on public schema")
          if int(tables_missing_dml) > 0:
              raise SystemExit("BLOCKED: runtime role lacks direct INSERT/UPDATE/DELETE on one or more application tables")
          if int(sequences_missing_usage) > 0:
              raise SystemExit("BLOCKED: runtime role lacks USAGE on one or more public identity/serial sequences")
          if int(owned_count) > 0:
              raise SystemExit("BLOCKED: runtime DB role owns public tables; use a non-owner runtime role with explicit grants")
          if int(role_membership_count) > 0:
              raise SystemExit("BLOCKED: runtime DB role inherits other PostgreSQL roles; grant only explicit privileges directly")
          print("IDENTITY PASS: direct non-owner/non-admin login with NOINHERIT, explicit table DML and sequence grants, no schema CREATE, BYPASSRLS, and RLS enabled on all inventoried tables.")
          print("PASS: read-only target identity and current migration revision were verified; no migration or write was executed")
          PY
          rm -f "$RUNNER_TEMP/atlas-staging-db-url"
