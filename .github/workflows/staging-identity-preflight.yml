name: Supabase Staging Identity Preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-supabase-staging-identity-preflight
  cancel-in-progress: false

jobs:
  verify-staging-identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Require exact main ref (branch protection is a separate repository setting)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "${GITHUB_SHA}"

      - name: Validate Google Cloud staging identity configuration before authentication
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          PREFLIGHT_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_PREFLIGHT_SERVICE_ACCOUNT || secrets.GCP_STAGING_PREFLIGHT_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$WIF_PROVIDER" ]] || missing+=("staging environment secret GCP_WORKLOAD_IDENTITY_PROVIDER")
          [[ -n "$PREFLIGHT_SERVICE_ACCOUNT" ]] || missing+=("staging environment secret GCP_STAGING_PREFLIGHT_SERVICE_ACCOUNT")
          [[ -n "$GCP_PROJECT_ID" ]] || missing+=("GCP_PROJECT_ID secret")
          [[ -n "$GCP_REGION" ]] || missing+=("GCP_REGION secret")
          if (("${#missing[@]}" > 0)); then
            printf 'BLOCKED: Google Cloud staging authentication cannot start; missing configuration:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi
          [[ "$WIF_PROVIDER" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]] || {
            echo "BLOCKED: GCP_WORKLOAD_IDENTITY_PROVIDER must be a full workload identity provider resource name."
            exit 1
          }
          [[ "$PREFLIGHT_SERVICE_ACCOUNT" == *@*.iam.gserviceaccount.com ]] || {
            echo "BLOCKED: GCP_STAGING_PREFLIGHT_SERVICE_ACCOUNT must be a Google service-account email."
            exit 1
          }
          echo "PASS: required staging identity inputs are present and structurally valid."

      - name: Authenticate to Google Cloud using protected staging environment
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_PREFLIGHT_SERVICE_ACCOUNT || secrets.GCP_STAGING_PREFLIGHT_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Require explicit staging target configuration (same-project supported)
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_PRODUCTION_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_DATABASE_SECRET }}
          STAGING_PAPER_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_PAPER_DATABASE_SECRET }}
          STAGING_ANON_KEY_SECRET: ${{ vars.ATLAS_STAGING_SUPABASE_ANON_KEY_SECRET }}
          STAGING_CLOUD_RUN_SERVICE: ${{ vars.ATLAS_STAGING_CLOUD_RUN_SERVICE }}
          EXPECTED_RUNTIME_SERVICE_ACCOUNT: ${{ vars.ATLAS_STAGING_RUNTIME_SERVICE_ACCOUNT }}
          EXPECTED_RUNTIME_DB_ROLE: ${{ vars.ATLAS_STAGING_RUNTIME_DB_ROLE }}
          EXPECTED_PAPER_DB_ROLE: ${{ vars.ATLAS_STAGING_PAPER_DB_ROLE }}
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Missing protected GCP_PROJECT_ID secret}"
          : "${GCP_REGION:?Missing protected GCP_REGION secret}"
          : "${PRODUCTION_SUPABASE_PROJECT_REF:?Set ATLAS_PRODUCTION_SUPABASE_PROJECT_REF to the current project ref (same as staging for the free single-project setup)}"
          : "${STAGING_SUPABASE_PROJECT_REF:?Set staging environment variable ATLAS_STAGING_SUPABASE_PROJECT_REF}"
          : "${STAGING_DATABASE_SECRET:?Set staging environment variable ATLAS_STAGING_DATABASE_SECRET}"
          : "${STAGING_PAPER_DATABASE_SECRET:?Set staging environment variable ATLAS_STAGING_PAPER_DATABASE_SECRET}"
          : "${STAGING_ANON_KEY_SECRET:?Set staging environment variable ATLAS_STAGING_SUPABASE_ANON_KEY_SECRET}"
          : "${STAGING_CLOUD_RUN_SERVICE:?Set staging environment variable ATLAS_STAGING_CLOUD_RUN_SERVICE}"
          : "${EXPECTED_RUNTIME_SERVICE_ACCOUNT:?Set staging environment variable ATLAS_STAGING_RUNTIME_SERVICE_ACCOUNT}"
          : "${EXPECTED_RUNTIME_DB_ROLE:?Set staging environment variable ATLAS_STAGING_RUNTIME_DB_ROLE}"
          : "${EXPECTED_PAPER_DB_ROLE:?Set staging environment variable ATLAS_STAGING_PAPER_DB_ROLE}"
          [[ "$PRODUCTION_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "BLOCKED: production project ref must be an explicit 20-character Supabase project ref"; exit 1; }
          [[ "$STAGING_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "BLOCKED: staging project ref must be an explicit 20-character Supabase project ref"; exit 1; }
          if [[ "$STAGING_SUPABASE_PROJECT_REF" == "$PRODUCTION_SUPABASE_PROJECT_REF" ]]; then
            echo "Same-project staging selected; paper/live/payout safety flags and the dedicated paper schema remain mandatory."
          fi
          [[ "$STAGING_DATABASE_SECRET" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "BLOCKED: invalid primary staging Secret Manager secret name"; exit 1; }
          [[ "$STAGING_PAPER_DATABASE_SECRET" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "BLOCKED: invalid paper staging Secret Manager secret name"; exit 1; }
          [[ "$STAGING_DATABASE_SECRET" != "$STAGING_PAPER_DATABASE_SECRET" ]] || { echo "BLOCKED: primary and paper databases must use two distinct Secret Manager secrets"; exit 1; }
          [[ "$STAGING_ANON_KEY_SECRET" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "BLOCKED: invalid Supabase anon-key Secret Manager secret name"; exit 1; }
          [[ "$STAGING_ANON_KEY_SECRET" != "$STAGING_DATABASE_SECRET" && "$STAGING_ANON_KEY_SECRET" != "$STAGING_PAPER_DATABASE_SECRET" ]] || { echo "BLOCKED: Supabase API key and DB URLs must use distinct secrets"; exit 1; }
          [[ "$STAGING_CLOUD_RUN_SERVICE" =~ ^[a-z][a-z0-9-]{0,48}$ ]] || { echo "BLOCKED: invalid staging Cloud Run service name"; exit 1; }
          [[ "$EXPECTED_RUNTIME_SERVICE_ACCOUNT" =~ ^[a-zA-Z0-9._@-]+$ ]] || { echo "BLOCKED: invalid expected staging runtime service account"; exit 1; }
          [[ "$EXPECTED_RUNTIME_DB_ROLE" == "atlas_paper_reader" ]] || { echo "BLOCKED: paper-only API must use the narrowly scoped atlas_paper_reader role"; exit 1; }
          [[ "$EXPECTED_PAPER_DB_ROLE" == "atlas_customer_paper" ]] || { echo "BLOCKED: paper ledger must use atlas_customer_paper"; exit 1; }
          echo "PASS: same-project staging identity is configured for a read-only public-schema identity and isolated paper ledger."

      - name: Verify deployed staging Cloud Run identity, paper-only entrypoint, and secret wiring
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
          STAGING_CLOUD_RUN_SERVICE: ${{ vars.ATLAS_STAGING_CLOUD_RUN_SERVICE }}
          EXPECTED_RUNTIME_SERVICE_ACCOUNT: ${{ vars.ATLAS_STAGING_RUNTIME_SERVICE_ACCOUNT }}
          STAGING_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_DATABASE_SECRET }}
          STAGING_PAPER_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_PAPER_DATABASE_SECRET }}
          STAGING_ANON_KEY_SECRET: ${{ vars.ATLAS_STAGING_SUPABASE_ANON_KEY_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys
          args = [
              "gcloud", "run", "services", "describe",
              os.environ["STAGING_CLOUD_RUN_SERVICE"],
              f"--project={os.environ['GCP_PROJECT_ID']}",
              f"--region={os.environ['GCP_REGION']}",
              "--format=json",
          ]
          result = subprocess.run(args, check=False, capture_output=True, text=True)
          if result.returncode:
              # Classify only the Google Cloud error type. Do not print service JSON,
              # secret values, or raw command output from a failed resource lookup.
              diagnostic = (result.stderr or result.stdout or "").lower()
              if "not_found" in diagnostic or "not found" in diagnostic:
                  reason = "service not found in the configured project/region; the paper-staging deploy must complete first"
              elif "permission_denied" in diagnostic or "permission denied" in diagnostic or "does not have permission" in diagnostic:
                  reason = "the preflight identity lacks Cloud Run service-inspection permission; verify roles/run.viewer for atlas-staging-preflight"
              elif "service_disabled" in diagnostic or "service disabled" in diagnostic or "has not been used in project" in diagnostic:
                  reason = "the Cloud Run API is disabled or unavailable in the configured staging project"
              elif "unauthenticated" in diagnostic or "authentication" in diagnostic:
                  reason = "Google Cloud authentication/impersonation failed for the preflight identity"
              else:
                  reason = "gcloud run services describe failed; review the job's redacted Google Cloud error class"
              print(f"BLOCKED: {reason} (gcloud exit code {result.returncode}; raw output withheld)")
              sys.exit(1)
          try:
              service = json.loads(result.stdout)
          except json.JSONDecodeError:
              print("BLOCKED: staging Cloud Run service description was not valid JSON")
              sys.exit(1)
          template = service.get("spec", {}).get("template") or service.get("template") or {}
          spec = template.get("spec", template)
          observed_sa = spec.get("serviceAccountName") or spec.get("serviceAccount") or ""
          if not observed_sa or observed_sa != os.environ["EXPECTED_RUNTIME_SERVICE_ACCOUNT"]:
              print("BLOCKED: deployed staging service account differs from ATLAS_STAGING_RUNTIME_SERVICE_ACCOUNT")
              sys.exit(1)
          for container in spec.get("containers", []) or []:
              env_items = container.get("env", []) or []
              env_by_name = {item.get("name"): item for item in env_items if item.get("name")}
              if not env_by_name:
                  continue
              expected_values = {
                  "ATLAS_ASGI_APP": "app.paper_staging:app",
                  "PAPER_TRADING": "true",
                  "LIVE_TRADING_ENABLED": "false",
                  "CUSTOMER_LIVE_TRADING_ENABLED": "false",
                  "PAYOUT_LIVE_ENABLED": "false",
                  "BROKER_SANDBOX": "true",
                  "USDT_TRON_ENABLED": "false",
                  "USDT_TRON_SWEEP_ENABLED": "false",
                  "DERIV_LIVE_ENABLED": "false",
                  "CUSTOMER_PAPER_LEDGER_ENABLED": "true",
                  "CUSTOMER_PAPER_SHARED_DATABASE_ENABLED": "true",
                  "CUSTOMER_TOTP_REQUIRED": "true",
                  "ADAPTIVE_AI_ENABLED": "false",
                  "PROCESS_ROLE": "paper",
              }
              for key, expected in expected_values.items():
                  item = env_by_name.get(key, {})
                  if item.get("value") != expected:
                      print(f"BLOCKED: staging runtime has missing/unsafe {key}; expected {expected!r}")
                      sys.exit(1)
              def secret_name(item):
                  value_from = item.get("valueFrom") or {}
                  value_source = item.get("valueSource") or {}
                  ref = value_from.get("secretKeyRef") or value_source.get("secretKeyRef") or {}
                  return ref.get("name") or ref.get("secret") or ""
              if secret_name(env_by_name.get("DATABASE_URL", {})) != os.environ["STAGING_DATABASE_SECRET"]:
                  print("BLOCKED: DATABASE_URL must reference the configured atlas_paper_reader secret")
                  sys.exit(1)
              if secret_name(env_by_name.get("CUSTOMER_PAPER_DATABASE_URL", {})) != os.environ["STAGING_PAPER_DATABASE_SECRET"]:
                  print("BLOCKED: CUSTOMER_PAPER_DATABASE_URL must reference the configured atlas_customer_paper secret")
                  sys.exit(1)
              if secret_name(env_by_name.get("SUPABASE_ANON_KEY", {})) != os.environ["STAGING_ANON_KEY_SECRET"]:
                  print("BLOCKED: SUPABASE_ANON_KEY must reference the configured Supabase publishable/anon key secret")
                  sys.exit(1)
              print("PASS: Cloud Run runtime identity, paper-only entrypoint, safety flags and separate DB/API-key secret references verified.")
              break
          else:
              print("BLOCKED: staging Cloud Run service has no configured application container")
              sys.exit(1)
          PY

      - name: Read both staging database secrets without printing credentials
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          STAGING_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_DATABASE_SECRET }}
          STAGING_PAPER_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_PAPER_DATABASE_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          gcloud secrets versions access latest --secret="$STAGING_DATABASE_SECRET" --project="$GCP_PROJECT_ID" > "$RUNNER_TEMP/atlas-staging-db-url"
          gcloud secrets versions access latest --secret="$STAGING_PAPER_DATABASE_SECRET" --project="$GCP_PROJECT_ID" > "$RUNNER_TEMP/atlas-staging-paper-db-url"
          test -s "$RUNNER_TEMP/atlas-staging-db-url"
          test -s "$RUNNER_TEMP/atlas-staging-paper-db-url"
          chmod 600 "$RUNNER_TEMP/atlas-staging-db-url" "$RUNNER_TEMP/atlas-staging-paper-db-url"

      - name: Verify Supabase target and distinct database identities (read-only)
        shell: bash
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_STAGING_SUPABASE_PROJECT_REF }}
          EXPECTED_RUNTIME_DB_ROLE: ${{ vars.ATLAS_STAGING_RUNTIME_DB_ROLE }}
          EXPECTED_PAPER_DB_ROLE: ${{ vars.ATLAS_STAGING_PAPER_DB_ROLE }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          root = Path(os.environ["RUNNER_TEMP"])
          primary = urlparse((root / "atlas-staging-db-url").read_text().strip())
          paper = urlparse((root / "atlas-staging-paper-db-url").read_text().strip())
          expected = os.environ["STAGING_SUPABASE_PROJECT_REF"]
          pooler_pattern = re.compile(r"^aws-\d+-[a-z0-9]+(?:-[a-z0-9]+)*\.pooler\.supabase\.com$")
          def validate(label, parsed, expected_role):
              if parsed.scheme not in ("postgres", "postgresql", "postgresql+asyncpg") or not parsed.hostname:
                  raise SystemExit(f"BLOCKED: {label} DB secret is not a valid PostgreSQL URI")
              host = parsed.hostname.lower()
              is_pooler = bool(pooler_pattern.fullmatch(host))
              if host not in {f"db.{expected}.supabase.co", f"{expected}.supabase.co"} and not is_pooler:
                  raise SystemExit(f"BLOCKED: {label} DB hostname does not match the configured Supabase project or a Supabase session-pooler hostname")
              if parsed.port not in (None, 5432):
                  raise SystemExit(f"BLOCKED: {label} DB URL must use port 5432; transaction pooler is not supported")
              if parsed.path.lstrip("/") != "postgres":
                  raise SystemExit(f"BLOCKED: {label} DB name is not postgres")
              if not parsed.password or not parsed.username:
                  raise SystemExit(f"BLOCKED: {label} DB secret lacks dedicated credentials")
              uri_user = unquote(parsed.username)
              expected_uri_user = f"{expected_role}.{expected}" if is_pooler else expected_role
              if uri_user != expected_uri_user:
                  raise SystemExit(f"BLOCKED: {label} DB URL user does not match the configured runtime role and target type")
              return expected_role, unquote(parsed.password)
          primary_user, primary_password = validate("primary", primary, os.environ["EXPECTED_RUNTIME_DB_ROLE"])
          paper_user, paper_password = validate("paper", paper, os.environ["EXPECTED_PAPER_DB_ROLE"])
          if primary_user != os.environ["EXPECTED_RUNTIME_DB_ROLE"]:
              raise SystemExit("BLOCKED: primary DB URL is not the configured read-only runtime role")
          if paper_user != os.environ["EXPECTED_PAPER_DB_ROLE"]:
              raise SystemExit("BLOCKED: paper DB URL is not the configured isolated ledger role")
          if primary_user == paper_user or primary_password == paper_password:
              raise SystemExit("BLOCKED: primary and paper database URLs must use distinct runtime roles and passwords")
          if (primary.hostname.lower(), primary.port or 5432, primary.path) != (paper.hostname.lower(), paper.port or 5432, paper.path):
              raise SystemExit("BLOCKED: free single-project mode must use the same database host, port and postgres database")
          print("PASS: both database URLs target the configured single Supabase project/database (direct endpoint or session pooler), with distinct runtime roles and credentials; values were not printed")
          PY

      - name: Verify primary runtime role is strictly read-only (read-only SQL)
        shell: bash
        env:
          STAGING_RUNTIME_DB_ROLE: ${{ vars.ATLAS_STAGING_RUNTIME_DB_ROLE }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          uri = (Path(os.environ["RUNNER_TEMP"]) / "atlas-staging-db-url").read_text().strip()
          parsed = urlparse(uri)
          env = {k:v for k,v in os.environ.items() if k not in {"DATABASE_URL","PGPASSWORD","PGHOST","PGPORT","PGUSER","PGDATABASE","PGOPTIONS"}}
          env.update({
              "PGHOST": parsed.hostname or "",
              "PGPORT": str(parsed.port or 5432),
              "PGUSER": unquote(parsed.username or ""),
              "PGPASSWORD": unquote(parsed.password or ""),
              "PGDATABASE": parsed.path.lstrip("/") or "",
              "PGSSLMODE": "require",
              "PGOPTIONS": "-c default_transaction_read_only=on -c statement_timeout=10000",
          })
          query = """
          SELECT current_database(), current_user, session_user, current_setting('transaction_read_only'),
                 r.rolcanlogin, r.rolsuper, r.rolcreaterole, r.rolcreatedb, r.rolreplication,
                 r.rolbypassrls, r.rolinherit,
                 (SELECT count(*) FROM pg_auth_members m WHERE m.member=r.oid),
                 (SELECT count(*) FROM pg_auth_members m
                   JOIN pg_roles member_role ON member_role.oid=m.member
                   JOIN pg_roles grantor_role ON grantor_role.oid=m.grantor
                   WHERE m.roleid=r.oid
                     AND NOT (
                       member_role.rolname='postgres'
                       AND grantor_role.rolname='supabase_admin'
                       AND m.admin_option
                       AND (to_jsonb(m) ? 'inherit_option')
                       AND COALESCE((to_jsonb(m)->>'inherit_option')::boolean, false)=false
                       AND (to_jsonb(m) ? 'set_option')
                       AND COALESCE((to_jsonb(m)->>'set_option')::boolean, false)=false
                     )),
                 has_schema_privilege(current_user,'public','USAGE'),
                 has_schema_privilege(current_user,'public','CREATE'),
                 has_table_privilege(current_user,'public.customer_profiles','SELECT'),
                 has_table_privilege(current_user,'public.app_state','SELECT'),
                 (SELECT count(*) FROM pg_namespace n WHERE n.nspname NOT LIKE 'pg_%'
                   AND n.nspname <> 'information_schema' AND n.nspname <> 'public'
                   AND (has_schema_privilege(current_user,n.oid,'USAGE') OR has_schema_privilege(current_user,n.oid,'CREATE'))),
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname='public' AND c.relkind IN ('r','p','v','m','f') AND (
                     (c.relname IN ('customer_profiles','app_state') AND (
                       has_table_privilege(current_user,c.oid,'INSERT') OR has_table_privilege(current_user,c.oid,'UPDATE')
                       OR has_table_privilege(current_user,c.oid,'DELETE') OR has_table_privilege(current_user,c.oid,'TRUNCATE')
                       OR has_table_privilege(current_user,c.oid,'REFERENCES') OR has_table_privilege(current_user,c.oid,'TRIGGER')))
                     OR (c.relname NOT IN ('customer_profiles','app_state') AND (
                       has_table_privilege(current_user,c.oid,'SELECT') OR has_table_privilege(current_user,c.oid,'INSERT')
                       OR has_table_privilege(current_user,c.oid,'UPDATE') OR has_table_privilege(current_user,c.oid,'DELETE')
                       OR has_table_privilege(current_user,c.oid,'TRUNCATE') OR has_table_privilege(current_user,c.oid,'REFERENCES')
                       OR has_table_privilege(current_user,c.oid,'TRIGGER'))))),
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public'
                   AND c.relkind='S' AND (has_sequence_privilege(current_user,c.oid,'USAGE')
                     OR has_sequence_privilege(current_user,c.oid,'SELECT') OR has_sequence_privilege(current_user,c.oid,'UPDATE'))),
                 (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
                   WHERE n.nspname='public' AND p.prosecdef AND has_function_privilege(current_user,p.oid,'EXECUTE')),
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname='public' AND c.relkind IN ('r','p') AND c.relowner=r.oid)
          FROM pg_roles r WHERE r.rolname=current_user;
          """
          result = subprocess.run(["psql","-X","-A","-t","-v","ON_ERROR_STOP=1","-c",query],
                                  capture_output=True,text=True,check=False,env=env)
          if result.returncode:
              print("BLOCKED: read-only primary identity query failed; DB output withheld")
              sys.exit(1)
          fields = result.stdout.strip().split("|")
          if len(fields) != 22:
              print("BLOCKED: primary identity query returned an unexpected shape")
              sys.exit(1)
          (db, role, session_role, read_only, can_login, superuser, create_role, create_db, replication,
           bypass_rls, inherit, memberships, member_count, public_usage, public_create, read_profiles,
           read_app_state, other_schema, unexpected_tables, public_sequences, callable_definers,
           owned_tables) = fields
          def truth(v): return str(v).strip().lower() in {"t","true","1","yes"}
          if db != "postgres" or role != os.environ["STAGING_RUNTIME_DB_ROLE"] or session_role != role:
              raise SystemExit("BLOCKED: connected primary identity does not match the configured runtime role")
          if read_only.lower() not in {"on","true","t"}:
              raise SystemExit("BLOCKED: database session is not read-only")
          if not truth(can_login) or truth(superuser) or truth(create_role) or truth(create_db) or truth(replication):
              raise SystemExit("BLOCKED: primary runtime role has administrative privileges or cannot login")
          if not truth(bypass_rls) or truth(inherit) or int(memberships) or int(member_count):
              raise SystemExit("BLOCKED: primary runtime role must be NOINHERIT/BYPASSRLS, with no inherited roles or unsafe Supabase-managed membership")
          if not truth(public_usage) or truth(public_create) or not truth(read_profiles) or not truth(read_app_state):
              raise SystemExit("BLOCKED: primary runtime role lacks exact public-schema read-only access")
          if any(int(v) for v in (other_schema, unexpected_tables, public_sequences, callable_definers, owned_tables)):
              raise SystemExit("BLOCKED: primary runtime role can access non-allowlisted objects or owns public tables")
          print(f"PASS: primary identity {role} is read-only, non-owner/non-admin, and can access only customer_profiles/app_state. no migration or write was executed by this preflight.")
          PY

      - name: Require deployed service readiness and full isolated-ledger preflight
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
          STAGING_CLOUD_RUN_SERVICE: ${{ vars.ATLAS_STAGING_CLOUD_RUN_SERVICE }}
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "$STAGING_CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json)"
          SERVICE_URL="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status",{}).get("url",""))' <<< "$SERVICE_JSON")"
          [[ "$SERVICE_URL" == https://* ]] || { echo "BLOCKED: staging service has no valid HTTPS URL"; exit 1; }
          BODY="$RUNNER_TEMP/atlas-paper-staging-ready.json"
          test -s "$RUNNER_TEMP/atlas-staging-paper-db-url" || { echo "BLOCKED: no protected paper database secret is available for readiness authentication"; exit 1; }
          # The readiness bearer is HMAC-derived from the protected paper DB URI. It is
          # purpose-bound, never printed, and not stored as a second copy of the credential.
          HTTP_CODE="$(python - "$SERVICE_URL/readyz" "$RUNNER_TEMP/atlas-staging-paper-db-url" "$BODY" <<'PY'
          import hashlib, hmac, sys, urllib.error, urllib.request
          url, database_url_path, body_path = sys.argv[1:]
          database_url = open(database_url_path, encoding="utf-8").read().strip()
          token = hmac.new(
              database_url.encode("utf-8"),
              b"atlas-paper-staging-readiness-v1",
              hashlib.sha256,
          ).hexdigest()
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  code, body = response.status, response.read()
          except urllib.error.HTTPError as exc:
              code, body = exc.code, exc.read()
          except Exception:
              code, body = 0, b""
          with open(body_path, "wb") as handle:
              handle.write(body)
          print(code)
          PY
          )"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "BLOCKED: authenticated paper-only staging /readyz did not pass (HTTP $HTTP_CODE); response body withheld"
            exit 1
          fi
          python - "$BODY" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1], encoding="utf-8"))
          if result.get("status") != "PASS" or result.get("mode") != "paper-only":
              raise SystemExit("BLOCKED: deployed paper-only staging readiness did not report PASS")
          print("PASS: deployed paper-only service and isolated customer-paper ledger preflight.")
          PY
          rm -f "$RUNNER_TEMP/atlas-staging-db-url" "$RUNNER_TEMP/atlas-staging-paper-db-url" "$BODY"
