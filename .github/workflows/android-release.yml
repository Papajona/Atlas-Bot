name: Android release

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-release.yml"
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

  android-release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ATLAS_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/atlas-release.jks"
          test -s "$RUNNER_TEMP/atlas-release.jks"
      - name: Build signed release APK
        env:
          ATLAS_RELEASE_STORE_FILE: ${{ runner.temp }}/atlas-release.jks
          ATLAS_RELEASE_STORE_PASSWORD: ${{ secrets.ATLAS_RELEASE_STORE_PASSWORD }}
          ATLAS_RELEASE_KEY_ALIAS: ${{ secrets.ATLAS_RELEASE_KEY_ALIAS }}
          ATLAS_RELEASE_KEY_PASSWORD: ${{ secrets.ATLAS_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ATLAS_RELEASE_STORE_PASSWORD"
          test -n "$ATLAS_RELEASE_KEY_ALIAS"
          test -n "$ATLAS_RELEASE_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease
      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
