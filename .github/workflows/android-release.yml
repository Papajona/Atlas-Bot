name: Android release

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

  android-release:
    if: startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ATLAS_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/atlas-release.jks"
          test -s "$RUNNER_TEMP/atlas-release.jks"
      - name: Build signed release APK
        env:
          ATLAS_RELEASE_STORE_FILE: ${{ runner.temp }}/atlas-release.jks
          ATLAS_RELEASE_STORE_PASSWORD: ${{ secrets.ATLAS_RELEASE_STORE_PASSWORD }}
          ATLAS_RELEASE_KEY_ALIAS: ${{ secrets.ATLAS_RELEASE_KEY_ALIAS }}
          ATLAS_RELEASE_KEY_PASSWORD: ${{ secrets.ATLAS_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ATLAS_RELEASE_STORE_PASSWORD"
          test -n "$ATLAS_RELEASE_KEY_ALIAS"
          test -n "$ATLAS_RELEASE_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease
      - name: Verify signed APK identity, signer certificate and checksum
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ATLAS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*androidTest*' | head -n 1)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt"
          test -n "$EXPECTED_CERT_SHA256"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/atlas-signing-report.txt"
          actual_cert="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/atlas-signing-report.txt" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$actual_cert"
          test "$actual_cert" = "$expected_cert"
          package_name="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$package_name" = "com.atlas.trading"
          bundle="$RUNNER_TEMP/atlas-release-bundle"
          mkdir -p "$bundle"
          cp "$apk" "$bundle/atlas-release.apk"
          printf 'package=%s\ncertificate_sha256=%s\n' "$package_name" "$actual_cert" > "$bundle/atlas-release-metadata.txt"
          cp "$RUNNER_TEMP/atlas-signing-report.txt" "$bundle/atlas-signing-report.txt"
          (cd "$bundle" && sha256sum atlas-release.apk > atlas-release.sha256)
      - name: Upload signed artifact and verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-release-apk
          path: ${{ runner.temp }}/atlas-release-bundle/*
          if-no-files-found: error
