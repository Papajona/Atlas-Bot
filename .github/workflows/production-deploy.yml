name: Production API Deployment

on:
  workflow_dispatch:
    inputs:
      android_release_run_id:
        description: "Explicit approved GitHub Actions run ID for the signed Android release artifact"
        required: true
        type: string
      base_url:
        description: "Approved public/load-balanced Atlas HTTPS base URL; must match the origin embedded in the selected APK"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: atlas-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact requested main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert deployment is from main
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Require all release CI gates on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_RUN_ID: ${{ inputs.android_release_run_id }}
        run: |
          set -euo pipefail

          require_success() {
            local workflow="$1"
            local label="$2"
            local ok
            ok="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --commit "$GITHUB_SHA" \
              --json status,conclusion \
              --jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length')"
            if [ "${ok:-0}" -lt 1 ]; then
              echo "BLOCKED: $label has not passed on exact commit $GITHUB_SHA"
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --commit "$GITHUB_SHA" \
                --limit 10
              exit 1
            fi
            echo "PASS: $label passed on exact commit $GITHUB_SHA"
          }

          require_success "ci.yml" "Atlas CI"
          require_success "ledger-concurrency-check.yml" "PostgreSQL ledger concurrency"
          require_success "production-verification.yml" "Production Verification Gate"
          require_staging_identity_success() {
            local run_id run_status run_conclusion job_conclusion

            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "staging-identity-preflight.yml" \
              --commit "$GITHUB_SHA" \
              --limit 100 \
              --json databaseId,headBranch \
              --jq '[.[] | select(.headBranch == "main")] | sort_by(.databaseId) | last | .databaseId // empty')"

            if [ -z "$run_id" ]; then
              echo "BLOCKED: no staging identity preflight run exists on main for exact commit $GITHUB_SHA"
              exit 1
            fi

            run_status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
            run_conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // empty')"
            job_conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name == "verify-staging-identity")][0].conclusion // "missing"')"

            if [ "$run_status" != "completed" ] \
              || [ "$run_conclusion" != "success" ] \
              || [ "$job_conclusion" != "success" ]; then
              echo "BLOCKED: staging identity requires verify-staging-identity to succeed on exact commit $GITHUB_SHA"
              echo "Observed run status=$run_status, workflow conclusion=$run_conclusion, job conclusion=$job_conclusion"
              exit 1
            fi
            echo "PASS: verify-staging-identity succeeded on exact main commit $GITHUB_SHA"
          }

          require_staging_identity_success
          require_success "android-release.yml" "Protected signed Android release"

          # Require an explicitly chosen signed run; never select the first run by commit.
          android_run="$ANDROID_RELEASE_RUN_ID"
          [[ "$android_run" =~ ^[0-9]+$ ]] || {
            echo "BLOCKED: provide a numeric, explicitly approved android_release_run_id"
            exit 1
          }
          run_endpoint="/repos/$GITHUB_REPOSITORY/actions/runs/$android_run"
          expected_workflow_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/android-release.yml" --jq '.id')"
          run_workflow_id="$(gh api "$run_endpoint" --jq '.workflow_id')"
          run_sha="$(gh api "$run_endpoint" --jq '.head_sha')"
          run_attempt="$(gh api "$run_endpoint" --jq '.run_attempt')"
          run_status="$(gh api "$run_endpoint" --jq '.status')"
          run_conclusion="$(gh api "$run_endpoint" --jq '.conclusion // empty')"
          run_event="$(gh api "$run_endpoint" --jq '.event')"
          run_repository="$(gh api "$run_endpoint" --jq '.head_repository.full_name // empty')"
          if [ "$run_workflow_id" != "$expected_workflow_id" ] \
            || [ "$run_sha" != "$GITHUB_SHA" ] \
            || [ "$run_status" != "completed" ] \
            || [ "$run_conclusion" != "success" ] \
            || [ "$run_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "BLOCKED: selected run must be a successful Android release workflow run for this exact commit and repository"
            exit 1
          fi
          case "$run_event" in
            workflow_dispatch|push)
              # A successful android-release job proves the workflow's own main/tag
              # condition passed; the job result is checked immediately below.
              ;;
            *)
              echo "BLOCKED: unsupported event for a signed Android release run: $run_event"
              exit 1
              ;;
          esac
          android_job_conclusion="$(gh run view "$android_run" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name=="android-release")][0].conclusion // empty')"
          [ "$android_job_conclusion" = "success" ] || {
            echo "BLOCKED: selected run's android-release signing job did not succeed"
            exit 1
          }
          artifact_count="$(gh api "$run_endpoint/artifacts" --jq '[.artifacts[] | select(.name=="atlas-release-apk" and .expired==false and .size_in_bytes>0)] | length')"
          if [ "$artifact_count" -ne 1 ]; then
            echo "BLOCKED: selected release run must contain exactly one non-expired, non-empty atlas-release-apk artifact"
            exit 1
          fi
          echo "PASS: explicitly selected Android run $android_run is successful, signed, exact-commit, and has one artifact"

      - name: Download and independently verify selected Android artifact and backend origin
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERT_SHA256: ${{ secrets.ATLAS_RELEASE_CERT_SHA256 }}
          ANDROID_RELEASE_RUN_ID: ${{ inputs.android_release_run_id }}
          ATLAS_BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          # Re-use the explicitly selected run validated above; do not reselect by commit.
          android_run="$ANDROID_RELEASE_RUN_ID"
          [[ "$android_run" =~ ^[0-9]+$ ]] || {
            echo "BLOCKED: android_release_run_id must be numeric"
            exit 1
          }
          run_endpoint="/repos/$GITHUB_REPOSITORY/actions/runs/$android_run"
          selected_sha="$(gh api "$run_endpoint" --jq '.head_sha')"
          selected_attempt="$(gh api "$run_endpoint" --jq '.run_attempt')"
          selected_workflow="$(gh api "$run_endpoint" --jq '.workflow_id')"
          expected_workflow="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/android-release.yml" --jq '.id')"
          test "$selected_sha" = "$GITHUB_SHA" || {
            echo "BLOCKED: selected Android run no longer matches the exact deployment commit"
            exit 1
          }
          test "$selected_workflow" = "$expected_workflow" || {
            echo "BLOCKED: selected run is not the Android release workflow"
            exit 1
          }

          artifact_count="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$android_run/artifacts" --jq '[.artifacts[] | select(.name=="atlas-release-apk" and .expired==false and .size_in_bytes>0)] | length')"
          if [ "${artifact_count:-0}" -ne 1 ]; then
            echo "BLOCKED: expected exactly one non-expired, non-empty atlas-release-apk artifact"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/atlas-android-release"
          gh run download "$android_run" --repo "$GITHUB_REPOSITORY" --name atlas-release-apk --dir "$RUNNER_TEMP/atlas-android-release"
          bundle="$RUNNER_TEMP/atlas-android-release"
          apk="$bundle/atlas-release.apk"
          test -s "$apk"
          test -s "$bundle/atlas-release.sha256"
          test -s "$bundle/atlas-release-metadata.txt"
          test -s "$bundle/atlas-signing-report.txt"
          (cd "$bundle" && sha256sum --check atlas-release.sha256)

          # Verify the downloaded APK bytes directly; metadata/report files are not
          # accepted as substitutes for inspecting the APK itself.
          test -n "$EXPECTED_CERT_SHA256"
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$expected_cert" =~ ^[0-9a-f]{64}$ ]] || { echo "BLOCKED: expected certificate fingerprint must be 64 hex characters"; exit 1; }
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt"

          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/atlas-downloaded-apk-signing-report.txt"
          actual_cert="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/atlas-downloaded-apk-signing-report.txt" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$actual_cert"
          test "$actual_cert" = "$expected_cert"

          package_name="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$package_name" = "com.atlas.trading"

          metadata_commit="$(sed -n 's/^commit=//p' "$bundle/atlas-release-metadata.txt")"
          metadata_run_id="$(sed -n 's/^run_id=//p' "$bundle/atlas-release-metadata.txt")"
          metadata_run_attempt="$(sed -n 's/^run_attempt=//p' "$bundle/atlas-release-metadata.txt")"
          metadata_backend_url="$(sed -n 's/^backend_url=//p' "$bundle/atlas-release-metadata.txt")"
          metadata_backend_origin="$(sed -n 's/^backend_origin=//p' "$bundle/atlas-release-metadata.txt")"
          metadata_package="$(sed -n 's/^package=//p' "$bundle/atlas-release-metadata.txt")"
          metadata_cert="$(sed -n 's/^certificate_sha256=//p' "$bundle/atlas-release-metadata.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$metadata_commit" = "$GITHUB_SHA" || { echo "BLOCKED: release metadata commit differs from deployment commit"; exit 1; }
          test "$metadata_run_id" = "$ANDROID_RELEASE_RUN_ID" || { echo "BLOCKED: release metadata run ID differs from explicitly selected run"; exit 1; }
          test "$metadata_run_attempt" = "$selected_attempt" || { echo "BLOCKED: release evidence belongs to a different run attempt"; exit 1; }
          test "$metadata_package" = "$package_name"
          test "$metadata_cert" = "$actual_cert"
          test -n "$metadata_backend_url" && test -n "$metadata_backend_origin" || { echo "BLOCKED: signed release evidence is missing backend URL/origin"; exit 1; }

          report_cert="$(sed -n 's/.*certificate SHA-256 digest: //p' "$bundle/atlas-signing-report.txt" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$report_cert" = "$actual_cert"
          backend_evidence="$(python scripts/verify_android_apk_backend_origin.py --apk "$apk" --aapt "$aapt" --expected-url "$metadata_backend_url" --compare-origin "$ATLAS_BASE_URL")"
          verified_backend_url=$(jq -er .backend_url <<< "$backend_evidence")
          verified_backend_origin=$(jq -er .backend_origin <<< "$backend_evidence")
          test "$verified_backend_url" = "$metadata_backend_url" || { echo "BLOCKED: backend URL evidence differs from the embedded APK URL"; exit 1; }
          test "$verified_backend_origin" = "$metadata_backend_origin" || { echo "BLOCKED: metadata backend origin differs from the origin independently extracted from the APK"; exit 1; }
          echo "PASS: explicit release run, commit, checksum, signature, package, metadata, embedded backend URL, and intended production origin agree"
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Verify production database runtime role before deployment
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SECRET_DATABASE_VERSION: ${{ secrets.SECRET_DATABASE_VERSION }}
        run: |
          set -euo pipefail
          umask 077
          db_url_file="$RUNNER_TEMP/atlas-production-db-url"
          trap 'rm -f "$db_url_file"' EXIT
          gcloud secrets versions access "$SECRET_DATABASE_VERSION" \
            --secret=atlas-database-url --project="$GCP_PROJECT_ID" > "$db_url_file"
          test -s "$db_url_file"
          python - "$db_url_file" <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          secret_path = Path(sys.argv[1])
          uri = secret_path.read_text(encoding="utf-8").strip()
          parsed = urlparse(uri)
          if parsed.scheme not in {"postgres", "postgresql", "postgresql+asyncpg", "postgresql+psycopg"} or not parsed.hostname:
              raise SystemExit("BLOCKED: production DATABASE_URL is not a valid PostgreSQL URI")
          env = {
              k: v for k, v in os.environ.items()
              if k not in {"DATABASE_URL", "PGPASSWORD", "PGHOST", "PGPORT", "PGUSER", "PGDATABASE", "PGOPTIONS"}
          }
          env.update({
              "PGHOST": parsed.hostname,
              "PGPORT": str(parsed.port or 5432),
              "PGUSER": unquote(parsed.username or ""),
              "PGPASSWORD": unquote(parsed.password or ""),
              "PGDATABASE": parsed.path.lstrip("/"),
              "PGSSLMODE": "require",
              "PGOPTIONS": "-c default_transaction_read_only=on -c statement_timeout=10000",
          })
          query = """
          SELECT current_database(), current_user, session_user,
                 COALESCE((SELECT string_agg(version_num, ',' ORDER BY version_num)
                           FROM public.alembic_version), ''),
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname='public' AND c.relkind IN ('r','p')),
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname='public' AND c.relkind IN ('r','p') AND NOT c.relrowsecurity),
                 r.rolsuper, r.rolcreaterole, r.rolcreatedb, r.rolreplication, r.rolbypassrls,
                 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname='public' AND c.relkind IN ('r','p') AND c.relowner=r.oid),
                 (SELECT count(*) FROM pg_auth_members m WHERE m.member=r.oid),
                 (NOT has_schema_privilege('anon','public','USAGE')
                  AND NOT has_schema_privilege('authenticated','public','USAGE'))
          FROM pg_roles r WHERE r.rolname=current_user
          """
          result = subprocess.run(
              ["psql", "-X", "-A", "-t", "-F", "|", "-v", "ON_ERROR_STOP=1", "-c", query],
              check=False, capture_output=True, text=True, env=env,
          )
          if result.returncode:
              print("BLOCKED: read-only production database role check failed; database output withheld")
              sys.exit(1)
          fields = result.stdout.strip().split("|")
          if len(fields) != 14:
              raise SystemExit("BLOCKED: unexpected production database role query result")
          (database, role, login_role, revision, table_count, unprotected_count,
           is_superuser, can_create_roles, can_create_databases, can_replicate, bypass_rls,
           owned_count, membership_count, api_schema_blocked) = fields
          reserved = {"postgres", "service_role", "supabase_admin", "supabase_auth_admin",
                      "authenticator", "anon", "authenticated"}
          print(
              f"Production DB role audit: database={database}, role={role}, login_role={login_role}, "
              f"revision={revision or 'missing'}, public_tables={table_count}, "
              f"tables_without_rls={unprotected_count}, owned_tables={owned_count}, "
              f"role_memberships={membership_count}, bypass_rls={bypass_rls}"
          )
          if database != "postgres" or not role or login_role != role:
              raise SystemExit("BLOCKED: unexpected database or login/current-role identity mismatch")
          if role in reserved:
              raise SystemExit("BLOCKED: production runtime cannot use a reserved PostgreSQL/Supabase role")
          if is_superuser.lower() == "true" or can_create_roles.lower() == "true" or can_create_databases.lower() == "true" or can_replicate.lower() == "true":
              raise SystemExit("BLOCKED: production database runtime role has administrative privileges")
          if bypass_rls.lower() != "true":
              raise SystemExit("BLOCKED: production runtime role must have reviewed BYPASSRLS for the backend-only/no-policy RLS design")
          if int(owned_count) > 0 or int(membership_count) > 0:
              raise SystemExit("BLOCKED: production runtime role must own no public tables and inherit no other roles")
          if int(table_count) < 1 or int(unprotected_count) > 0:
              raise SystemExit("BLOCKED: production public-schema RLS is incomplete")
          if api_schema_blocked.lower() != "true":
              raise SystemExit("BLOCKED: anon/authenticated still have public schema USAGE")
          if not revision:
              raise SystemExit("BLOCKED: production database Alembic revision is missing")
          print("PASS: production DB URL resolves to a dedicated non-owner/non-admin runtime role with RLS lockdown intact.")
          PY

      - name: Deploy immutable API release
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          AR_REPOSITORY: ${{ secrets.AR_REPOSITORY }}
          CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          MODEL_BUCKET: ${{ secrets.MODEL_BUCKET }}
          MODEL_STAGING_BUCKET: ${{ secrets.MODEL_STAGING_BUCKET }}
          SERVICE_ACCOUNT: ${{ secrets.ATLAS_API_SERVICE_ACCOUNT }}
          SECRET_DATABASE_VERSION: ${{ secrets.SECRET_DATABASE_VERSION }}
          SECRET_KEY_VERSION: ${{ secrets.SECRET_KEY_VERSION }}
          SECRET_TRON_XPUB_VERSION: ${{ secrets.SECRET_TRON_XPUB_VERSION }}
          SECRET_APP_ENCRYPTION_VERSION: ${{ secrets.SECRET_APP_ENCRYPTION_VERSION }}
          SECRET_REDIS_URL_VERSION: ${{ secrets.SECRET_REDIS_URL_VERSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ADMIN_SUPABASE_USER_IDS: ${{ secrets.ADMIN_SUPABASE_USER_IDS }}
          ADMIN_ROLE_ASSIGNMENTS: ${{ secrets.ADMIN_ROLE_ASSIGNMENTS }}
          BACKUP_RECOVERY_URL: ${{ secrets.BACKUP_RECOVERY_URL }}
          SECRET_TRONGRID_VERSION: ${{ secrets.SECRET_TRONGRID_VERSION }}
          SECRET_MODEL_SIGNING_PUBLIC_VERSION: ${{ secrets.SECRET_MODEL_SIGNING_PUBLIC_VERSION }}
          SECRET_SUPABASE_ANON_KEY_VERSION: ${{ secrets.SECRET_SUPABASE_ANON_KEY_VERSION }}
          SECRET_FUNDING_WEBHOOK_VERSION: ${{ secrets.SECRET_FUNDING_WEBHOOK_VERSION }}
          FORWARDED_ALLOW_IPS: ${{ secrets.FORWARDED_ALLOW_IPS }}
          SECRET_GEMINI_API_KEY_VERSION: ${{ secrets.SECRET_GEMINI_API_KEY_VERSION }}
          SECRET_GROQ_API_KEY_VERSION: ${{ secrets.SECRET_GROQ_API_KEY_VERSION }}
          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_STRATEGY_MODEL: gemini-3.5-flash
          RESEARCH_FEE_SOURCE: ${{ vars.RESEARCH_FEE_SOURCE }}
          RESEARCH_FEE_EVIDENCE_ID: ${{ vars.RESEARCH_FEE_EVIDENCE_ID }}
          RESEARCH_MIN_DEFLATED_SHARPE: ${{ vars.RESEARCH_MIN_DEFLATED_SHARPE }}
        run: bash deploy/cloud-run-deploy.sh

      - name: Verify deployed immutable identity
        env:
          ATLAS_BASE_URL: ${{ inputs.base_url }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          AR_REPOSITORY: ${{ secrets.AR_REPOSITORY }}
          CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
        run: |
          IMAGE_TAG="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${CLOUD_RUN_SERVICE}:${EXPECTED_RELEASE_SHA}"
          EXPECTED_IMAGE_DIGEST="$(gcloud artifacts docker images describe "${IMAGE_TAG}" --format='value(image_summary.digest)')"
          test -n "${EXPECTED_IMAGE_DIGEST}"
          echo "Verifying SHA ${EXPECTED_RELEASE_SHA} digest ${EXPECTED_IMAGE_DIGEST}"
          bash deploy/verify-deployed-release.sh
