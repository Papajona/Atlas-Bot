name: Cloud SQL restore-target preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-cloud-sql-restore-target-preflight
  cancel-in-progress: false

jobs:
  inspect-recovery-resources:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT || secrets.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT }}
      CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.ATLAS_STAGING_CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      CLOUD_SQL_DATABASE: ${{ vars.ATLAS_STAGING_CLOUD_SQL_DATABASE }}
      SOURCE_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_PRODUCTION_SUPABASE_PROJECT_REF }}
      SOURCE_SUPABASE_DATABASE: postgres
      BACKUP_BUCKET: atlas-staging-510915-db-backups
      SOURCE_BACKUP_REFERENCE: gs://atlas-staging-510915-db-backups/atlas-supabase-pre-customer-paper-20261022T153023Z.dump#1792683068959304
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT || secrets.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      - name: Verify isolated Cloud SQL target and Supabase pg_dump source provenance
        shell: bash
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Missing GCP_PROJECT_ID}"
          : "${GCP_REGION:?Missing GCP_REGION}"
          : "${SOURCE_SUPABASE_PROJECT_REF:?Missing ATLAS_PRODUCTION_SUPABASE_PROJECT_REF}"
          : "${CLOUD_SQL_INSTANCE_CONNECTION_NAME:?Missing ATLAS_STAGING_CLOUD_SQL_INSTANCE_CONNECTION_NAME}"
          : "${CLOUD_SQL_DATABASE:?Missing ATLAS_STAGING_CLOUD_SQL_DATABASE}"
          [[ "$GCP_PROJECT_ID" == "atlas-staging-510915" ]]
          [[ "$GCP_REGION" == "europe-west1" ]]
          [[ "$SOURCE_SUPABASE_PROJECT_REF" == "wauaelzyugjuepmrewaw" ]]
          [[ "$SOURCE_SUPABASE_DATABASE" == "postgres" ]]
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]]
          [[ "$GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT" == atlas-staging-restore-audit@atlas-staging-510915.iam.gserviceaccount.com ]]
          [[ "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" =~ ^atlas-staging-510915:europe-west1:[a-z0-9-]+$ ]]
          [[ "$CLOUD_SQL_DATABASE" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,62}$ ]]

          instance_name="${CLOUD_SQL_INSTANCE_CONNECTION_NAME##*:}"
          gcloud sql instances describe "$instance_name" --project="$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/recovery-instance.json"
          gcloud sql databases describe "$CLOUD_SQL_DATABASE" --instance="$instance_name" --project="$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/recovery-database.json"
          gcloud storage buckets describe "gs://$BACKUP_BUCKET" --format=json > "$RUNNER_TEMP/backup-bucket.json"
          gcloud storage objects describe "$SOURCE_BACKUP_REFERENCE" --project="$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/source-backup-object.json"

          python - "$RUNNER_TEMP" "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" "$CLOUD_SQL_DATABASE" "$BACKUP_BUCKET" "$SOURCE_BACKUP_REFERENCE" "$SOURCE_SUPABASE_PROJECT_REF" "$SOURCE_SUPABASE_DATABASE" <<'PY'
          import json
          import sys
          from pathlib import Path

          from scripts.cloud_sql_recovery_inventory import require_supported_postgresql_major
          from scripts.verify_cloud_sql_supabase_source_provenance import verify_supabase_pg_dump_source

          root = Path(sys.argv[1])
          expected_instance, expected_database, bucket, source_reference, source_project_ref, source_database = sys.argv[2:]
          instance = json.loads((root / "recovery-instance.json").read_text(encoding="utf-8"))
          database = json.loads((root / "recovery-database.json").read_text(encoding="utf-8"))
          bucket_meta = json.loads((root / "backup-bucket.json").read_text(encoding="utf-8"))
          object_meta = json.loads((root / "source-backup-object.json").read_text(encoding="utf-8"))

          observed_instance = f'{instance.get("project", "")}:{instance.get("region", "")}:{instance.get("name", "")}'
          if observed_instance != expected_instance:
              raise SystemExit("BLOCKED: Cloud SQL recovery instance identity does not match protected configuration")
          if instance.get("state") != "RUNNABLE":
              raise SystemExit("BLOCKED: Cloud SQL recovery instance is not RUNNABLE")
          if database.get("name") != expected_database:
              raise SystemExit("BLOCKED: Cloud SQL recovery database identity does not match protected configuration")
          try:
              postgres_major = require_supported_postgresql_major(instance.get("databaseVersion"))
          except ValueError as exc:
              raise SystemExit(f"BLOCKED: {exc}") from exc

          try:
              source_evidence = verify_supabase_pg_dump_source(
                  source_backup_reference=source_reference,
                  source_project_ref=source_project_ref,
                  source_database=source_database,
                  object_metadata=object_meta,
                  bucket_metadata=bucket_meta,
              )
          except ValueError as exc:
              raise SystemExit(f"BLOCKED: Supabase source provenance/retention verification failed: {exc}") from exc

          summary = {
              "status": "PASS",
              "target_instance": observed_instance,
              "target_state": instance.get("state"),
              "target_database": database.get("name"),
              "database_version": instance.get("databaseVersion"),
              "supported_postgresql_major": postgres_major,
              "region": instance.get("region"),
              "backup_bucket": bucket,
              "source_evidence": source_evidence,
          }
          (root / "recovery-preflight-summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Preserve sanitized recovery resource inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-cloud-sql-restore-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-preflight-summary.json
          if-no-files-found: warn
          retention-days: 30
