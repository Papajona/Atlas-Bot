name: One-time cleanup of branches already integrated into main

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  prune-contained-branches:
    # This unique marker is used only on the explicit cleanup merge.
    if: startsWith(github.event.head_commit.message, '[atlas-branch-prune-once-20261020]') || startsWith(github.event.head_commit.message, '[atlas-branch-prune-content-once-20261020]') || startsWith(github.event.head_commit.message, '[atlas-branch-prune-reviewed-once-20261020]') || startsWith(github.event.head_commit.message, '[atlas-branch-prune-verified-duplicates-once-20261020]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only branches proven integrated into main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSHED_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$PUSHED_MAIN_SHA"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git cat-file -e "${main_sha}^{commit}"

          # Capture and check every API call before using its output. A lookup
          # failure aborts the job instead of silently producing an empty list.
          open_pr_output=$(gh api --paginate "repos/${GH_REPO}/pulls?state=open&per_page=100" --jq '.[].head.ref') || {
            echo "ERROR: open-PR enumeration failed; refusing all deletion." >&2
            exit 1
          }
          merged_pr_output=$(gh api --paginate "repos/${GH_REPO}/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha != null) | [.head.ref, .head.sha, .merge_commit_sha] | @tsv') || {
            echo "ERROR: merged-PR enumeration failed; refusing all deletion." >&2
            exit 1
          }
          branch_output=$(gh api --paginate "repos/${GH_REPO}/branches?per_page=100" \
            --jq '.[] | [.name, (.protected | tostring), .commit.sha] | @tsv') || {
            echo "ERROR: complete branch enumeration failed; refusing all deletion." >&2
            exit 1
          }
          if [[ -z "$branch_output" ]]; then
            echo "ERROR: branch enumeration returned no branches; refusing false-success cleanup." >&2
            exit 1
          fi

          open_pr_heads=()
          merged_pr_tuples=()
          branch_rows=()
          if [[ -n "$open_pr_output" ]]; then mapfile -t open_pr_heads <<< "$open_pr_output"; fi
          if [[ -n "$merged_pr_output" ]]; then mapfile -t merged_pr_tuples <<< "$merged_pr_output"; fi
          mapfile -t branch_rows <<< "$branch_output"

          deleted=0
          kept=0
          failed=0
          for row in "${branch_rows[@]}"; do
            IFS=$'\t' read -r branch protected sha <<< "$row"
            [[ -z "$branch" || "$branch" == "main" ]] && continue
            if [[ "$protected" == "true" ]]; then
              echo "KEEP protected branch: $branch"
              kept=$((kept + 1))
              continue
            fi

            open_pr=false
            for pr_head in "${open_pr_heads[@]}"; do
              if [[ "$pr_head" == "$branch" ]]; then open_pr=true; break; fi
            done
            if [[ "$open_pr" == "true" ]]; then
              echo "KEEP branch used by an open PR: $branch"
              kept=$((kept + 1))
              continue
            fi

            reason=""
            if git merge-base --is-ancestor "$sha" "$main_sha"; then
              reason="tip is an ancestor of main"
            else
              for tuple in "${merged_pr_tuples[@]}"; do
                IFS=$'\t' read -r pr_branch pr_head_sha pr_merge_sha <<< "$tuple"
                if [[ "$pr_branch" == "$branch" && "$pr_head_sha" == "$sha" ]] \
                  && git merge-base --is-ancestor "$pr_merge_sha" "$main_sha"; then
                  reason="exact branch tip was merged into main"
                  break
                fi
              done
            fi

            # If ancestry / exact merged-PR proof did not apply, check whether
            # every path changed by this branch has exactly the same final blob
            # (or deletion state) on main. This is stricter than filename overlap:
            # any byte/content/mode difference preserves the branch.
            if [[ -z "$reason" ]]; then
              merge_base=""
              if merge_base=$(git merge-base "$sha" "$main_sha" 2>/dev/null); then
                changed_paths_file=$(mktemp)
                if ! git diff --name-only -z "$merge_base" "$sha" > "$changed_paths_file"; then
                  rm -f "$changed_paths_file"
                  echo "KEEP/ERROR: changed-path enumeration failed: $branch" >&2
                  failed=$((failed + 1))
                  continue
                fi
                changed_paths=()
                mapfile -d '' -t changed_paths < "$changed_paths_file"
                rm -f "$changed_paths_file"
                if [[ ${#changed_paths[@]} -eq 0 ]]; then
                  reason="branch has no net file changes relative to merge base"
                elif git diff --quiet "$sha" "$main_sha" -- "${changed_paths[@]}"; then
                  reason="all branch-changed paths exactly match main"
                else
                  diff_status=$?
                  if [[ "$diff_status" -gt 1 ]]; then
                    echo "KEEP/ERROR: changed-path comparison failed: $branch" >&2
                    failed=$((failed + 1))
                    continue
                  fi
                fi
              fi
            fi

            # Exact-SHA allowlist for a few branches individually reviewed as superseded.
            # Each entry also checks current-main content before allowing deletion.
            if [[ -z "$reason" ]]; then
              reviewed_reason=""
              case "$branch:$sha" in
                "fix/tron-sweep-require-explicit-contract-success-20261014:b45fb0f5bfac71dbc4e3e63a0d5c70747f39f4f2")
                  if git show "$main_sha:app/tron_sweep.py" | grep -F 'if str(settings.usdt_tron_treasury_address_role or "").strip().lower() != "atlas_controlled":' >/dev/null \
                    && ! git show "$sha:app/tron_sweep.py" | grep -F 'if str(settings.usdt_tron_treasury_address_role or "").strip().lower() != "atlas_controlled":' >/dev/null \
                    && [[ "$(git rev-parse "$main_sha:tests/test_tron_sweep_real_chain_shapes.py")" == "$(git rev-parse "$sha:tests/test_tron_sweep_real_chain_shapes.py")" ]]; then
                    reviewed_reason="reviewed superseded TRON sweep branch; main has the stronger treasury-ownership guard and identical protocol tests"
                  fi
                  ;;
                "fix/settlement-race-test-syntax:3a23e895de5b225a37e747d425df92e70cf3d372")
                  if git show "$main_sha:tests/test_ledger_invariants_3_10_46.py" | grep -F 'from pathlib import Path' >/dev/null \
                    && git show "$sha:tests/test_ledger_invariants_3_10_46.py" | grep -F 'from app.db import Base, CustomerLedgerAccount, LedgerJournal, LedgerJournalLine' >/dev/null \
                    && ! git show "$main_sha:tests/test_ledger_invariants_3_10_46.py" | grep -F 'from app.db import Base, CustomerLedgerAccount, LedgerJournal, LedgerJournalLine' >/dev/null; then
                    reviewed_reason="reviewed import-only test branch; current-main invariant test passed without the unused ledger model imports"
                  fi
                  ;;
                "fix/withdrawal-settlement-race:ecb4e5f4ce24f46af772301cc9f1c74a5b3243eb")
                  if git show "$main_sha:tests/test_ledger_invariants_3_10_46.py" | grep -F 'from pathlib import Path' >/dev/null \
                    && ! git show "$sha:tests/test_ledger_invariants_3_10_46.py" | grep -F 'from pathlib import Path' >/dev/null; then
                    reviewed_reason="reviewed stale withdrawal test branch; it removes the Path import required by the test in current main"
                  fi
                  ;;
                "fix/audit-followup-buildconfig-20261010:1fe9e8edbbea200b1bb35993ad7646a476850d80")
                  if git show "$main_sha:app/src/main/java/com/atlas/trading/MainActivity.kt" | grep -F 'getString(R.string.backend_url)' >/dev/null \
                    && git show "$main_sha:app/src/main/res/values/strings.xml" | grep -F 'name="backend_url"' >/dev/null \
                    && git show "$main_sha:app/src/main/java/com/atlas/trading/MainActivity.kt" | grep -F 'userName = "Account"' >/dev/null \
                    && git show "$sha:app/src/main/java/com/atlas/trading/MainActivity.kt" | grep -F 'BuildConfig.BACKEND_URL' >/dev/null \
                    && git show "$sha:app/src/main/java/com/atlas/trading/MainActivity.kt" | grep -F 'userName = "Alice"' >/dev/null; then
                    reviewed_reason="reviewed obsolete Android portal change; current main uses the declared backend_url resource and non-demo Account label"
                  fi
                  ;;
                "fix/alembic-model-schema-drift-gate:9e8a0bf54ab38670a5a3ca065432c606565f90b0")
                  if git show "$main_sha:.github/workflows/ci.yml" | grep -F 'python -m alembic check' >/dev/null \
                    && git show "$main_sha:.github/workflows/ci.yml" | grep -F 'test "$restored_head" = "$expected_head"' >/dev/null \
                    && git show "$sha:.github/workflows/ci.yml" | grep -F 'test "$restored_head" = "0049_public_schema_rls_lockdown"' >/dev/null; then
                    reviewed_reason="reviewed stale migration-gate branch; current main has Alembic drift checks plus dynamic restored-head verification"
                  fi
                  ;;
                "fix/production-verification-ai-model-import-20261009:e249dae44d7c61add582ccc22feac305cc3b715b")
                  if git show "$main_sha:scripts/check_ai_models.py" | grep -F 'Chat Completions inference succeeded' >/dev/null \
                    && git show "$main_sha:scripts/check_ai_models.py" | grep -F 'def _check_groq' >/dev/null \
                    && ! git show "$sha:scripts/check_ai_models.py" | grep -F 'def _check_groq' >/dev/null \
                    && git show "$main_sha:tests/test_check_ai_models_import.py" | grep -F 'root_bootstrap' >/dev/null; then
                    reviewed_reason="reviewed superseded AI check branch; current main performs provider inference and stronger import-bootstrap regression checks"
                  fi
                  ;;
                "fix/tron-custody-address-role-current-main-20261020:a41fbf9145a321a28dee29f593dbed7d7413ee95")
                  if git show "$main_sha:app/config.py" | grep -F 'usdt_tron_treasury_address_role: str = "unknown"' >/dev/null \
                    && git show "$main_sha:app/config.py" | grep -F 'def _validate_usdt_tron_treasury_address_role' >/dev/null \
                    && git show "$main_sha:app/config.py" | grep -F 'unknown, atlas_controlled, or binance_deposit' >/dev/null; then
                    reviewed_reason="reviewed TRON role-configuration branch; current main includes the fail-closed role setting and validator"
                  fi
                  ;;
                "fix/tron-provider-header-capture-20261020:79d8c9c9261849eefee4e3ca9b276c64243be9fc")
                  if git show "$main_sha:tests/test_tron_header_capture.py" | grep -F 'assert len(requests) == 3' >/dev/null \
                    && git show "$main_sha:tests/test_tron_header_capture.py" | grep -F 'values[0].id == "_headers"' >/dev/null \
                    && git show "$main_sha:app/main.py" | grep -F 'async def _bounded(wallet, _slots=scan_slots, _scan=_scan_one):' >/dev/null \
                    && git show "$main_sha:app/main.py" | grep -F 'headers=_headers' >/dev/null; then
                    reviewed_reason="reviewed TRON header-capture branch; current main has the stricter captured-header regression and bounded scanner binding"
                  fi
                  ;;
                "test/current-worker-supervisor-restart-20261020:604887ddadba212de79e0d5d86fbca6dcdea3d6e")
                  if git show "$main_sha:tests/test_worker_supervisor_and_paper_gate.py" | grep -F 'def test_supervisor_restarts_worker_after_audit_failure' >/dev/null \
                    && git show "$main_sha:tests/test_worker_supervisor_and_paper_gate.py" | grep -F 'assert main._worker_loop_health[worker_name]["restart_count"] == 1' >/dev/null \
                    && git show "$main_sha:tests/test_worker_supervisor_and_paper_gate.py" | grep -F 'assert calls == [1, 2]' >/dev/null; then
                    reviewed_reason="reviewed duplicate worker-supervisor regression branch; the complete audit-failure restart test is already in main"
                  fi
                  ;;
                "test/current-worker-supervisor-restart-on-current-main-20261020:c7057c217a1277d21de1df3e2a6b909d39198cc7")
                  if git show "$main_sha:tests/test_worker_supervisor_and_paper_gate.py" | grep -F 'def test_supervisor_restarts_worker_after_audit_failure' >/dev/null \
                    && git show "$main_sha:tests/test_worker_supervisor_and_paper_gate.py" | grep -F 'assert main._worker_loop_health[worker_name]["restart_count"] == 1' >/dev/null \
                    && git show "$main_sha:tests/test_worker_supervisor_and_paper_gate.py" | grep -F 'assert calls == [1, 2]' >/dev/null; then
                    reviewed_reason="reviewed duplicate current-main worker-supervisor test branch; the behavior is covered by the existing combined regression test"
                  fi
                  ;;
                "hardening/binance-deposit-address-boundary:4e618b23de760d8d3965c05ab71d73123a381e6d")
                  if git show "$main_sha:tests/test_binance_deposit_address_boundary.py" | grep -F 'test_unknown_treasury_role_cannot_be_used_for_sweeps' >/dev/null \
                    && git show "$main_sha:tests/test_binance_deposit_address_boundary.py" | grep -F 'test_binance_deposit_role_cannot_be_used_as_atlas_sweep_destination' >/dev/null \
                    && git show "$main_sha:app/config.py" | grep -F 'def _validate_usdt_tron_treasury_address_role' >/dev/null \
                    && git show "$main_sha:app/custody_reconciliation.py" | grep -F 'role not in {"atlas_controlled", "binance_deposit"}' >/dev/null \
                    && git show "$main_sha:app/tron_sweep.py" | grep -F 'requires verified Atlas-controlled treasury address ownership' >/dev/null; then
                    reviewed_reason="reviewed Binance deposit-address boundary branch; current main contains the ownership, exclusion, and sweep guards with regression coverage"
                  fi
                  ;;
              esac
              if [[ -n "$reviewed_reason" ]]; then
                reason="$reviewed_reason"
              fi
            fi

            if [[ -z "$reason" ]]; then
              echo "KEEP branch with unique/unproven commits: $branch"
              kept=$((kept + 1))
              continue
            fi

            # The explicit lease rejects deletion if the remote branch changed
            # since enumeration; do not retry without the expected SHA.
            if push_output=$(git push origin "--force-with-lease=refs/heads/${branch}:${sha}" ":refs/heads/${branch}" 2>&1); then
              echo "DELETED ($reason): $branch"
              deleted=$((deleted + 1))
            else
              echo "KEEP/ERROR: branch changed or GitHub rejected safe deletion: $branch" >&2
              echo "$push_output" >&2
              failed=$((failed + 1))
            fi
          done

          echo "Cleanup result: deleted=$deleted kept=$kept failed=$failed"
          if [[ "$failed" -gt 0 ]]; then
            echo "ERROR: at least one eligible deletion failed. Cleanup is not reported as successful." >&2
            exit 1
          fi

          # Final API read-back makes a failed enumeration/deletion visible.
          post_branch_output=$(gh api --paginate "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name') || {
            echo "ERROR: post-cleanup branch verification failed." >&2
            exit 1
          }
          if [[ -z "$post_branch_output" ]]; then
            echo "ERROR: post-cleanup branch verification returned no branch names." >&2
            exit 1
          fi
          post_branch_count=$(printf '%s\n' "$post_branch_output" | wc -l | tr -d ' ')
          echo "Verified branch refs after cleanup: $post_branch_count (main is retained)."
