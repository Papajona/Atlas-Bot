name: One-time cleanup of branches already integrated into main

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  prune-contained-branches:
    # Runs only on the one explicitly marked cleanup merge. Ordinary pushes do nothing.
    if: startsWith(github.event.head_commit.message, '[atlas-branch-prune-once-20261020]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only proven-integrated unprotected branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSHED_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          main_sha="$PUSHED_MAIN_SHA"
          git cat-file -e "${main_sha}^{commit}"

          mapfile -t open_pr_heads < <(
            gh api --paginate "repos/${GH_REPO}/pulls?state=open&per_page=100" --jq '.[].head.ref'
          )
          # Squash merges do not make the source tip an ancestor of main. This
          # tuple proves exact name + exact head SHA + merged commit ancestry.
          mapfile -t merged_pr_tuples < <(
            gh api --paginate "repos/${GH_REPO}/pulls?state=closed&per_page=100" \
              --jq '.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha != null) | [.head.ref, .head.sha, .merge_commit_sha] | @tsv'
          )

          deleted=0
          kept=0
          failed=0
          while IFS=$'\t' read -r branch protected sha; do
            [[ -z "$branch" || "$branch" == "main" ]] && continue
            if [[ "$protected" == "true" ]]; then
              echo "KEEP protected branch: $branch"
              kept=$((kept + 1))
              continue
            fi

            open_pr=false
            for pr_head in "${open_pr_heads[@]}"; do
              if [[ "$pr_head" == "$branch" ]]; then open_pr=true; break; fi
            done
            if [[ "$open_pr" == "true" ]]; then
              echo "KEEP branch used by an open PR: $branch"
              kept=$((kept + 1))
              continue
            fi

            reason=""
            if git merge-base --is-ancestor "$sha" "$main_sha"; then
              reason="tip is an ancestor of main"
            else
              for tuple in "${merged_pr_tuples[@]}"; do
                IFS=$'\t' read -r pr_branch pr_head_sha pr_merge_sha <<< "$tuple"
                if [[ "$pr_branch" == "$branch" && "$pr_head_sha" == "$sha" ]] \
                  && git merge-base --is-ancestor "$pr_merge_sha" "$main_sha"; then
                  reason="exact branch tip was merged into main"
                  break
                fi
              done
            fi

            if [[ -z "$reason" ]]; then
              echo "KEEP branch with unique/unproven commits: $branch"
              kept=$((kept + 1))
              continue
            fi

            if gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}" >/dev/null; then
              echo "DELETED ($reason): $branch"
              deleted=$((deleted + 1))
            else
              echo "ERROR deleting integrated branch: $branch" >&2
              failed=$((failed + 1))
            fi
          done < <(
            gh api --paginate "repos/${GH_REPO}/branches?per_page=100" \
              --jq '.[] | [.name, (.protected | tostring), .commit.sha] | @tsv'
          )

          echo "Cleanup summary: deleted=$deleted kept=$kept failed=$failed"
          if [[ "$failed" -gt 0 ]]; then exit 1; fi
