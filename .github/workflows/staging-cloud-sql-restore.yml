name: Execute isolated Cloud SQL recovery restore
run-name: Cloud SQL recovery restore (${{ inputs.backup_reference }})

on:
  workflow_dispatch:
    inputs:
      backup_reference:
        description: Immutable GCS backup URI pinned with #<generation>
        required: true
        type: string
      confirm_restore_target:
        description: Type RESTORE to confirm import into the isolated recovery database
        required: true
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: atlas-cloud-sql-recovery-restore
  cancel-in-progress: false

jobs:
  restore-and-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_STAGING_RESTORE_EXECUTOR_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_RESTORE_EXECUTOR_SERVICE_ACCOUNT || secrets.GCP_STAGING_RESTORE_EXECUTOR_SERVICE_ACCOUNT }}
      CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.ATLAS_STAGING_CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      CLOUD_SQL_DATABASE: ${{ vars.ATLAS_STAGING_CLOUD_SQL_DATABASE }}
      PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.ATLAS_PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      RESTORE_TARGET_KIND: ${{ vars.ATLAS_STAGING_RESTORE_TARGET_KIND }}
      AUDIT_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT }}
      AUDIT_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_AUDIT_DATABASE_SECRET }}
      AUDIT_DATABASE_ROLE: ${{ vars.ATLAS_STAGING_AUDIT_DB_ROLE }}
      EVIDENCE_BUCKET: ${{ vars.ATLAS_STAGING_EVIDENCE_BUCKET }}
      BACKUP_REFERENCE: ${{ inputs.backup_reference }}
      CONFIRM_RESTORE_TARGET: ${{ inputs.confirm_restore_target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate protected recovery target and execution identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$CONFIRM_RESTORE_TARGET" == "RESTORE" ]] || {
            echo "BLOCKED: confirm_restore_target must be exactly RESTORE" >&2
            exit 1
          }
          : "${GCP_PROJECT_ID:?Missing GCP_PROJECT_ID}"
          : "${GCP_REGION:?Missing GCP_REGION}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Missing GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${GCP_STAGING_RESTORE_EXECUTOR_SERVICE_ACCOUNT:?Missing GCP_STAGING_RESTORE_EXECUTOR_SERVICE_ACCOUNT}"
          [[ "$GCP_PROJECT_ID" == "atlas-staging-510915" && "$GCP_REGION" == "europe-west1" ]] || {
            echo "BLOCKED: restore execution is restricted to atlas-staging-510915/europe-west1" >&2
            exit 1
          }
          [[ "$GCP_STAGING_RESTORE_EXECUTOR_SERVICE_ACCOUNT" == "atlas-staging-restore-executor@atlas-staging-510915.iam.gserviceaccount.com" ]] || {
            echo "BLOCKED: restore executor must use the dedicated staging restore identity" >&2
            exit 1
          }
          : "${RESTORE_TARGET_KIND:?Missing ATLAS_STAGING_RESTORE_TARGET_KIND}"
          [[ "$RESTORE_TARGET_KIND" == "cloud_sql" ]] || {
            echo "BLOCKED: staging restore audit must be configured for cloud_sql before any import" >&2
            exit 1
          }
          : "${AUDIT_SERVICE_ACCOUNT:?Missing GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT}"
          [[ "$AUDIT_SERVICE_ACCOUNT" == "atlas-staging-restore-audit@atlas-staging-510915.iam.gserviceaccount.com" ]] || {
            echo "BLOCKED: audit must use the dedicated staging restore-auditor identity" >&2
            exit 1
          }
          : "${AUDIT_DATABASE_SECRET:?Missing ATLAS_STAGING_AUDIT_DATABASE_SECRET}"
          [[ "$AUDIT_DATABASE_ROLE" == "atlas_audit_reader" ]] || {
            echo "BLOCKED: Cloud SQL restore audit must use atlas_audit_reader" >&2
            exit 1
          }
          : "${EVIDENCE_BUCKET:?Missing ATLAS_STAGING_EVIDENCE_BUCKET}"
          : "${CLOUD_SQL_INSTANCE_CONNECTION_NAME:?Missing ATLAS_STAGING_CLOUD_SQL_INSTANCE_CONNECTION_NAME}"
          : "${CLOUD_SQL_DATABASE:?Missing ATLAS_STAGING_CLOUD_SQL_DATABASE}"
          : "${PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME:?Missing ATLAS_PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME}"
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]]
          [[ "$GCP_STAGING_RESTORE_EXECUTOR_SERVICE_ACCOUNT" == *@*.iam.gserviceaccount.com ]]
          [[ "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" != "$PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME" ]] || {
            echo "BLOCKED: recovery and production Cloud SQL instances must be different" >&2
            exit 1
          }
          [[ "$BACKUP_REFERENCE" == gs://atlas-staging-510915-db-backups/*#[1-9]* ]] || {
            echo "BLOCKED: backup reference must pin a GCS generation in the approved backup bucket" >&2
            exit 1
          }

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_RESTORE_EXECUTOR_SERVICE_ACCOUNT || secrets.GCP_STAGING_RESTORE_EXECUTOR_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install PostgreSQL client for custom archive conversion
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
          command -v pg_restore
          pg_restore --version

      - name: Import the pinned backup into the separate recovery database
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/execute_cloud_sql_restore.py \
            --project-id "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --target-instance "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" \
            --production-instance "$PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME" \
            --target-database "$CLOUD_SQL_DATABASE" \
            --backup-reference "$BACKUP_REFERENCE" \
            --timeout-seconds 14400 \
            --poll-interval-seconds 15 \
            --output "$RUNNER_TEMP/cloud-sql-restore-execution.json"
          operation_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["operation_id"])' "$RUNNER_TEMP/cloud-sql-restore-execution.json")"
          import_reference="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["import_object_reference"])' "$RUNNER_TEMP/cloud-sql-restore-execution.json")"
          [[ "$operation_id" =~ ^[A-Za-z0-9._-]{1,256}$ ]]
          [[ "$import_reference" =~ ^gs://atlas-staging-510915-db-backups/restore-imports/[a-f0-9]{64}-[a-f0-9]{32}[.]sql([.]gz)?#[1-9][0-9]*$ ]] || {
            echo "BLOCKED: executor did not return a unique generation-pinned immutable import object" >&2
            exit 1
          }
          echo "IMPORT_OBJECT_REFERENCE=$import_reference" >> "$GITHUB_ENV"
          echo "RESTORE_OPERATION_ID=$operation_id" >> "$GITHUB_ENV"
          echo "RESTORE_OPERATION_ID=$operation_id" >> "$GITHUB_OUTPUT"

      - name: Dispatch the existing read-only restore audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/staging-restore-audit.yml/dispatches" \
            -f ref=main \
            -f "inputs[restore_operation_id]=$RESTORE_OPERATION_ID" \
            -f "inputs[backup_reference]=$IMPORT_OBJECT_REFERENCE" \
            -f "inputs[source_backup_reference]=$BACKUP_REFERENCE"

          audit_display_title="Cloud SQL restore audit ($RESTORE_OPERATION_ID)"
          audit_run_id=""
          for attempt in $(seq 1 90); do
            audit_run_id="$(gh api \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/staging-restore-audit.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              --jq ".workflow_runs[] | select(.display_title == \"$audit_display_title\") | .id" | head -n 1)"
            if [[ -n "$audit_run_id" ]]; then break; fi
            sleep 2
          done
          [[ "$audit_run_id" =~ ^[0-9]+$ ]] || {
            echo "BLOCKED: restore audit was dispatched but its workflow run could not be correlated" >&2
            exit 1
          }
          echo "RESTORE_AUDIT_RUN_ID=$audit_run_id" >> "$GITHUB_ENV"
          gh run watch "$audit_run_id" --exit-status
          audit_url="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$audit_run_id" --jq .html_url)"
          {
            echo "### Cloud SQL recovery restore"
            echo
            echo "- Restore operation: `$RESTORE_OPERATION_ID`"
            echo "- Recovery target: `$CLOUD_SQL_INSTANCE_CONNECTION_NAME / $CLOUD_SQL_DATABASE`"
            echo "- Source backup reference: `$BACKUP_REFERENCE`"
            echo "- Immutable Cloud SQL import object: `$IMPORT_OBJECT_REFERENCE`"
            echo "- Read-only audit: $audit_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive restore execution receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-cloud-sql-restore-${{ github.run_id }}
          path: ${{ runner.temp }}/cloud-sql-restore-execution.json
          if-no-files-found: warn
          retention-days: 90
