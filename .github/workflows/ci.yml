name: Atlas CI
on:
  pull_request:
  push:
    branches: [main, "hardening/**"]
permissions:
  contents: read
jobs:
  python-quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres:15-alpine
        env: {POSTGRES_DB: atlas_test, POSTGRES_USER: atlas, POSTGRES_PASSWORD: test_password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
      ATLAS_POSTGRES_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
      PAPER_TRADING: "true"
      LIVE_TRADING_ENABLED: "false"
      CUSTOMER_LIVE_TRADING_ENABLED: "false"
      BROKER_SANDBOX: "true"
      BACKGROUND_RECONCILIATION_ENABLED: "false"
      ADMIN_TOKEN: test-admin-token-for-ci
      MULTIDICT_NO_EXTENSIONS: "1"
      PYTEST_TEST_TIMEOUT_SECONDS: "120"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate admin dashboard JavaScript syntax
        run: node --check app/static/admin-dashboard.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.13"}
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --upgrade "pip==25.3"
          MULTIDICT_NO_EXTENSIONS=1 python -m pip install --no-binary=multidict --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Wait for PostgreSQL
        run: until pg_isready -h 127.0.0.1 -p 5432 -U atlas -d atlas_test; do sleep 1; done
      - name: Provision isolated customer paper-ledger test database
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atlas -d atlas_test \
            -c "CREATE ROLE atlas_paper_app LOGIN NOINHERIT NOBYPASSRLS PASSWORD 'paper_test_password'"
          PGPASSWORD=test_password createdb -h 127.0.0.1 -U atlas atlas_paper_test
          PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atlas -d atlas_paper_test \
            -c "REVOKE CONNECT ON DATABASE atlas_paper_test FROM PUBLIC; GRANT CONNECT ON DATABASE atlas_paper_test TO atlas_paper_app"
          PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atlas -d atlas_paper_test \
            -v paper_runtime_role=atlas_paper_app -f scripts/customer_paper_ledger_schema.sql
          echo "ATLAS_PAPER_TEST_DATABASE_URL=postgresql+asyncpg://atlas_paper_app:paper_test_password@localhost:5432/atlas_paper_test" >> "$GITHUB_ENV"
          echo "ATLAS_PAPER_PRIMARY_TEST_DATABASE_URL=postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test" >> "$GITHUB_ENV"
          echo "ATLAS_PAPER_SHARED_PRIMARY_TEST_DATABASE_URL=postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_paper_test" >> "$GITHUB_ENV"
      - name: Verify pinned Python base-image digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sed -nE '1s#^FROM python:3\.13-slim@(sha256:[0-9a-f]{64})$#\1#p' Dockerfile)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Dockerfile Python base image is not pinned to a SHA-256 digest" >&2
            exit 1
          }
          docker pull "docker.io/library/python@${digest}"
          echo "Verified pinned Python base-image digest: $digest"
      - name: Build application container image
        run: docker build --tag atlas-bot-ci:repair .
      - name: Smoke-test paper-only container startup and liveness
        shell: bash
        run: |
          set -euo pipefail
          container="atlas-paper-startup-smoke-$GITHUB_RUN_ID"
          body="$RUNNER_TEMP/atlas-paper-smoke-health.json"
          cleanup() {
            status=$?
            if (( status != 0 )); then
              echo "Paper-only container startup/liveness failed; container logs follow:"
              docker logs "$container" 2>&1 || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            return "$status"
          }
          trap cleanup EXIT

          docker run --detach --name "$container" \
            --publish 127.0.0.1:18080:8000 \
            --env ENVIRONMENT=staging \
            --env PROCESS_ROLE=paper \
            --env ATLAS_ASGI_APP=app.paper_staging:app \
            --env PORT=8000 \
            --env DATABASE_URL=sqlite+aiosqlite:////tmp/atlas-paper-smoke.db \
            --env CUSTOMER_PAPER_DATABASE_URL=postgresql+asyncpg://smoke:smoke@127.0.0.1:5432/smoke \
            --env SUPABASE_URL=https://wauaelzyugjuepmrewaw.supabase.co \
            --env SUPABASE_ANON_KEY=ci-paper-smoke-key \
            --env PAPER_TRADING=true \
            --env LIVE_TRADING_ENABLED=false \
            --env CUSTOMER_LIVE_TRADING_ENABLED=false \
            --env PAYOUT_LIVE_ENABLED=false \
            --env BROKER_SANDBOX=true \
            --env USDT_TRON_ENABLED=false \
            --env USDT_TRON_SWEEP_ENABLED=false \
            --env DERIV_LIVE_ENABLED=false \
            --env CUSTOMER_PAPER_LEDGER_ENABLED=true \
            --env CUSTOMER_PAPER_SHARED_DATABASE_ENABLED=true \
            --env CUSTOMER_TOTP_REQUIRED=true \
            --env ADAPTIVE_AI_ENABLED=false \
            --env FORWARDED_ALLOW_IPS=127.0.0.1 \
            --env SECRET_KEY=ci-paper-smoke-placeholder \
            atlas-bot-ci:repair

          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 2 \
              --output "$body" http://127.0.0.1:18080/livez; then
              python - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("status") != "ok" or data.get("mode") != "paper-only":
              raise SystemExit(f"unexpected paper-only liveness payload: {data!r}")
          print("PASS: exact paper-only ASGI entrypoint started and returned the expected liveness payload")
          PY
              exit 0
            fi
            if [[ "$(docker inspect --format='{{.State.Running}}' "$container" 2>/dev/null || echo false)" != "true" ]]; then
              echo "Container exited before liveness succeeded."
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for the paper-only container to bind port 8000 and serve /livez."
          exit 1
      - name: Compile source
        run: python -m compileall -q app alembic
      - name: Create Supabase API roles for migration verification
        run: |
          PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atlas -d atlas_test <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          -- Seed unsafe defaults and existing-object grants. Migration 0049 removes public API-role
          -- defaults; migration 0053 additionally opts future objects out of service_role defaults.
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO anon, authenticated;
          -- Model the existing Supabase service_role defaults so migration 0053 proves it opts future public objects out.
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO service_role;
          SQL
      - name: Reproduce the connected database revision
        run: python -m alembic upgrade 0047_strategy_outcome_lifecycle
      - name: Verify production-revision schema contract
        run: |
          PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atlas -d atlas_test <<'SQL'
          DO $production_0047_schema$
          DECLARE
              current_revision text;
              missing_columns text;
          BEGIN
              SELECT version_num INTO current_revision FROM public.alembic_version;
              IF current_revision IS DISTINCT FROM '0047_strategy_outcome_lifecycle' THEN
                  RAISE EXCEPTION 'expected revision 0047_strategy_outcome_lifecycle, got %', current_revision;
              END IF;

              SELECT string_agg(format('%s.%s', required.table_name, required.column_name), ', ')
                INTO missing_columns
              FROM (VALUES
                  ('app_state', 'live_enable_requested_by'),
                  ('app_state', 'live_enable_approved_by'),
                  ('trading_accounts', 'pilot_status'),
                  ('tron_sweeps', 'custody_transfer_id'),
                  ('subscriptions', 'ai_credits_used'),
                  ('strategy_outcomes', 'lifecycle_status')
              ) AS required(table_name, column_name)
              LEFT JOIN information_schema.columns actual
                ON actual.table_schema = 'public'
               AND actual.table_name = required.table_name
               AND actual.column_name = required.column_name
              WHERE actual.column_name IS NULL;

              IF missing_columns IS NOT NULL THEN
                  RAISE EXCEPTION 'revision 0047 schema contract is missing columns: %', missing_columns;
              END IF;
          END
          $production_0047_schema$;
          SQL
      - name: Seed and verify pre-lockdown API grants
        run: |
          PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atlas -d atlas_test <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO anon, authenticated;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;
          DO $seed_public_api_grants$
          DECLARE
              api_role text;
              function_signature text;
          BEGIN
              FOREACH api_role IN ARRAY ARRAY['anon', 'authenticated'] LOOP
                  IF NOT has_schema_privilege(api_role, 'public', 'CREATE') THEN
                      RAISE EXCEPTION 'pre-lockdown fixture failed: % lacks CREATE on public schema', api_role;
                  END IF;
                  IF NOT EXISTS (
                      SELECT 1
                      FROM pg_class c
                      JOIN pg_namespace n ON n.oid = c.relnamespace
                      WHERE n.nspname = 'public'
                        AND c.relkind IN ('r', 'p')
                        AND has_table_privilege(api_role, c.oid, 'SELECT')
                  ) THEN
                      RAISE EXCEPTION 'pre-lockdown fixture failed: % has no table SELECT grant', api_role;
                  END IF;
              END LOOP;

              FOREACH function_signature IN ARRAY ARRAY[
                  'public.atlas_block_ledger_mutation()',
                  'public.atlas_ledger_journal_deferred_check()',
                  'public.atlas_validate_ledger_journal(integer)'
              ] LOOP
                  IF to_regprocedure(function_signature) IS NOT NULL THEN
                      EXECUTE format(
                          'GRANT EXECUTE ON FUNCTION %s TO anon, authenticated',
                          function_signature
                      );
                      IF NOT has_function_privilege('anon', function_signature, 'EXECUTE')
                         OR NOT has_function_privilege('authenticated', function_signature, 'EXECUTE') THEN
                          RAISE EXCEPTION 'pre-lockdown fixture failed to grant EXECUTE on %', function_signature;
                      END IF;
                  END IF;
              END LOOP;
          END
          $seed_public_api_grants$;
          SQL
      - name: Upgrade from production revision through public-schema and future-default lockdown
        run: python -m alembic upgrade 0053_supabase_public_default_acl_lockdown
      - name: Verify public-schema lockdown at runtime
        run: |
          PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U atlas -d atlas_test <<'SQL'
          DO $verify_public_schema_lockdown$
          DECLARE
              api_role text;
          BEGIN
              IF EXISTS (
                  SELECT 1 FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p')
                    AND NOT c.relrowsecurity
              ) THEN
                  RAISE EXCEPTION 'RLS is disabled on one or more public tables';
              END IF;

              FOREACH api_role IN ARRAY ARRAY['anon', 'authenticated'] LOOP
                  IF has_schema_privilege(api_role, 'public', 'CREATE') THEN
                      RAISE EXCEPTION 'role % retains CREATE on public schema', api_role;
                  END IF;

                  IF has_schema_privilege(api_role, 'public', 'USAGE') THEN
                      RAISE EXCEPTION 'role % retains USAGE on public schema', api_role;
                  END IF;

                  IF EXISTS (
                      SELECT 1 FROM pg_class c
                      JOIN pg_namespace n ON n.oid = c.relnamespace
                      WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p', 'v', 'm', 'f')
                        AND (
                          has_table_privilege(api_role, c.oid, 'SELECT')
                          OR has_table_privilege(api_role, c.oid, 'INSERT')
                          OR has_table_privilege(api_role, c.oid, 'UPDATE')
                          OR has_table_privilege(api_role, c.oid, 'DELETE')
                          OR has_table_privilege(api_role, c.oid, 'TRUNCATE')
                          OR has_table_privilege(api_role, c.oid, 'REFERENCES')
                          OR has_table_privilege(api_role, c.oid, 'TRIGGER')
                        )
                  ) THEN
                      RAISE EXCEPTION 'role % retains privileges on a public relation', api_role;
                  END IF;

                  IF EXISTS (
                      SELECT 1 FROM pg_class c
                      JOIN pg_namespace n ON n.oid = c.relnamespace
                      WHERE n.nspname = 'public' AND c.relkind = 'S'
                        AND (
                          has_sequence_privilege(api_role, c.oid, 'USAGE')
                          OR has_sequence_privilege(api_role, c.oid, 'SELECT')
                          OR has_sequence_privilege(api_role, c.oid, 'UPDATE')
                        )
                  ) THEN
                      RAISE EXCEPTION 'role % retains a public sequence privilege', api_role;
                  END IF;

                  IF has_function_privilege(api_role, 'public.atlas_block_ledger_mutation()', 'EXECUTE')
                     OR has_function_privilege(api_role, 'public.atlas_ledger_journal_deferred_check()', 'EXECUTE')
                     OR has_function_privilege(api_role, 'public.atlas_validate_ledger_journal(integer)', 'EXECUTE') THEN
                      RAISE EXCEPTION 'role % retains EXECUTE on an internal ledger function', api_role;
                  END IF;
              END LOOP;

              IF EXISTS (
                  SELECT 1
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'public'
                    AND p.oid IN (
                      to_regprocedure('public.atlas_block_ledger_mutation()'),
                      to_regprocedure('public.atlas_ledger_journal_deferred_check()'),
                      to_regprocedure('public.atlas_validate_ledger_journal(integer)')
                    )
                    AND NOT coalesce(p.proconfig @> ARRAY['search_path=pg_catalog, public'], false)
              ) THEN
                  RAISE EXCEPTION 'an internal ledger function does not have a fixed search_path';
              END IF;
          END
          $verify_public_schema_lockdown$;

          -- Prove future objects created by the migration role do not inherit public API-role or service_role grants by default.
          CREATE TABLE public.atlas_default_acl_probe (
              id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
          );
          CREATE FUNCTION public.atlas_default_acl_probe_fn() RETURNS integer
          LANGUAGE sql AS $$ SELECT 1 $$;
          DO $verify_default_acl$
          DECLARE
              probe_sequence text := pg_get_serial_sequence('public.atlas_default_acl_probe', 'id');
          BEGIN
              IF NOT has_table_privilege('service_role', 'public.app_state', 'SELECT') THEN
                  RAISE EXCEPTION 'migration unexpectedly removed service_role access from an existing table';
              END IF;
              IF has_table_privilege('anon', 'public.atlas_default_acl_probe', 'SELECT')
                 OR has_table_privilege('authenticated', 'public.atlas_default_acl_probe', 'SELECT')
                 OR has_sequence_privilege('anon', probe_sequence, 'USAGE')
                 OR has_sequence_privilege('authenticated', probe_sequence, 'USAGE')
                 OR has_function_privilege('anon', 'public.atlas_default_acl_probe_fn()', 'EXECUTE')
                 OR has_function_privilege('authenticated', 'public.atlas_default_acl_probe_fn()', 'EXECUTE')
                 OR has_table_privilege('service_role', 'public.atlas_default_acl_probe', 'SELECT')
                 OR has_table_privilege('service_role', 'public.atlas_default_acl_probe', 'INSERT')
                 OR has_table_privilege('service_role', 'public.atlas_default_acl_probe', 'UPDATE')
                 OR has_table_privilege('service_role', 'public.atlas_default_acl_probe', 'DELETE')
                 OR has_table_privilege('service_role', 'public.atlas_default_acl_probe', 'TRUNCATE')
                 OR has_table_privilege('service_role', 'public.atlas_default_acl_probe', 'REFERENCES')
                 OR has_table_privilege('service_role', 'public.atlas_default_acl_probe', 'TRIGGER')
                 OR has_sequence_privilege('service_role', probe_sequence, 'USAGE')
                 OR has_sequence_privilege('service_role', probe_sequence, 'SELECT')
                 OR has_sequence_privilege('service_role', probe_sequence, 'UPDATE')
                 OR has_function_privilege('service_role', 'public.atlas_default_acl_probe_fn()', 'EXECUTE') THEN
                  RAISE EXCEPTION 'a public API or service role inherited privileges on a newly created public object';
              END IF;
          END
          $verify_default_acl$;
          DROP FUNCTION public.atlas_default_acl_probe_fn();
          DROP TABLE public.atlas_default_acl_probe;
          -- Simulate a managed object-creator role with independent unsafe defaults.
          CREATE ROLE supabase_admin NOLOGIN;
          GRANT USAGE, CREATE ON SCHEMA public TO supabase_admin;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA public
            GRANT SELECT ON TABLES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA public
            GRANT EXECUTE ON FUNCTIONS TO anon, authenticated;
          SET ROLE supabase_admin;
          CREATE TABLE public.atlas_managed_role_probe (id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY);
          CREATE FUNCTION public.atlas_managed_role_probe_fn() RETURNS integer
            LANGUAGE sql AS $$ SELECT 1 $$;
          RESET ROLE;
          DO $verify_managed_role_defaults$
          BEGIN
              IF NOT has_table_privilege('anon', 'public.atlas_managed_role_probe', 'SELECT')
                 OR NOT has_table_privilege('authenticated', 'public.atlas_managed_role_probe', 'SELECT') THEN
                  RAISE EXCEPTION 'managed-role fixture failed to model independent table grants';
              END IF;
              IF has_schema_privilege('anon', 'public', 'USAGE')
                 OR has_schema_privilege('authenticated', 'public', 'USAGE') THEN
                  RAISE EXCEPTION 'API roles can access public schema despite lockdown';
              END IF;
          END
          $verify_managed_role_defaults$;
          SET ROLE supabase_admin;
          DROP FUNCTION public.atlas_managed_role_probe_fn();
          DROP TABLE public.atlas_managed_role_probe;
          RESET ROLE;
          SQL
      - name: Verify migration graph and reversible upper-migration round-trip
        run: |
          set -euo pipefail
          python -m alembic current
          heads="$(python -m alembic heads)"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          # Revision 0051 intentionally preserves the append-only research archive on downgrade.
          # Stopping here verifies 0052/0053 can roll back and reapply without deleting retained history.
          python -m alembic downgrade 0051_research_trial_archive
          python -m alembic upgrade head
          # Check drift only after reaching the actual migration head, not at an older revision.
          python -m alembic check
      - name: Controlled withdrawal recovery regressions
        run: |
          python -m pytest -q \
            tests/test_withdrawal_hardening_3_10_48.py \
            tests/test_withdrawal_not_sent_db.py \
            tests/test_withdrawal_payout_error_guards.py \
            tests/test_payout_failure_classification.py
      - name: TRON transfer and reconciliation regressions
        run: |
          python -m pytest -q \
            tests/test_tron_deposit_reconciliation_3_10_18.py \
            tests/test_tron_sweep.py \
            tests/test_tron_sweep_real_chain_shapes.py \
            tests/test_tron_scan_efficiency_and_concurrency.py
      - name: OANDA practice adapter and unknown-outcome regressions
        run: |
          python -m pytest -q \
            tests/test_oanda_adapter.py \
            tests/test_oanda_failure_modes.py
      - name: OANDA practice connectivity (read-only, optional credentials)
        if: ${{ vars.OANDA_PRACTICE_CHECK_ENABLED == 'true' }}
        env:
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_PRACTICE: "true"
          FOREX_SYMBOL: EUR_USD
        run: python scripts/oanda_demo_check.py
      - name: Disposable PostgreSQL backup and restore smoke test
        run: |
          set -euo pipefail
          # Seed a deterministic balanced customer-ledger journal before backup,
          # then verify both the row and global ledger invariants after restore.
          PYTHONPATH=. python scripts/postgres_restore_drill.py --phase seed
          # Match the service's PostgreSQL 15 major version. Newer pg_restore clients
          # emit SET transaction_timeout, which PostgreSQL 15 does not support.
          docker run --rm --network host --user "$(id -u):$(id -g)" -e PGPASSWORD=test_password -v /tmp:/tmp \
            docker.io/library/postgres:15-alpine pg_dump -Fc --no-owner --no-acl \
            -h 127.0.0.1 -U atlas -d atlas_test -f /tmp/atlas-ci.dump
          PGPASSWORD=test_password createdb -h 127.0.0.1 -U atlas atlas_restore
          docker run --rm --network host --user "$(id -u):$(id -g)" -e PGPASSWORD=test_password -v /tmp:/tmp \
            docker.io/library/postgres:15-alpine pg_restore --exit-on-error --no-owner --no-acl \
            -h 127.0.0.1 -U atlas -d atlas_restore /tmp/atlas-ci.dump
          restored_head="$(PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -U atlas -d atlas_restore -c 'SELECT version_num FROM alembic_version')"
          expected_head="$(python -m alembic heads | awk '{print $1}')"
          printf 'Expected migration head: %s\nRestored database head: %s\n' "$expected_head" "$restored_head"
          test "$restored_head" = "$expected_head"
          restored_paper_tables="$(PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -U atlas -d atlas_restore -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relname IN ('paper_order_states', 'paper_bar_states', 'paper_fill_events')")"
          test "$restored_paper_tables" = "3"
          restored_archive_tables="$(PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -U atlas -d atlas_restore -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relname = 'research_trial_archive'")"
          test "$restored_archive_tables" = "1"
          PGPASSWORD=test_password psql -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -U atlas -d atlas_restore -c "
              SELECT CASE WHEN count(*) FILTER (WHERE NOT relrowsecurity) = 0
                          THEN 'RLS_OK' ELSE 'RLS_FAIL' END
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind IN ('r','p')
            " | grep -qx RLS_OK
          DATABASE_URL=postgresql+asyncpg://atlas:test_password@127.0.0.1:5432/atlas_restore \
            ATLAS_POSTGRES_URL=postgresql+asyncpg://atlas:test_password@127.0.0.1:5432/atlas_restore \
            PYTHONPATH=. python scripts/postgres_restore_drill.py --phase verify
          PGPASSWORD=test_password dropdb -h 127.0.0.1 -U atlas atlas_restore
          rm -f /tmp/atlas-ci.dump
      - name: Python lint (strict)
        run: python -m pyflakes app scripts tests
      - name: Repository secret scan
        run: python scripts/check_no_secrets.py
      - name: Security scan
        run: python -m bandit -r app -lll
      - name: Verify multidict pure-Python security workaround
        run: |
          python - <<'PY'
          import multidict
          assert multidict.CIMultiDict.__module__ == "multidict._multidict_py", multidict.CIMultiDict.__module__
          PY
      - name: Dependency audit
        # Defense in depth: pin the fixed multidict release and verify the pure-Python backend at runtime.
        run: python -m pip_audit -r requirements.lock --strict --ignore-vuln PYSEC-2026-1325
      - name: Full PostgreSQL ledger concurrency suite
        run: |
          python -m pytest -q tests/test_postgres_ledger_concurrency_3_10_46.py
          python -m pytest -q tests/test_ledger_all_paths_concurrent_3_10_46.py
          python -m pytest -q tests/test_opening_balance_journaled.py tests/test_audit_chain_lock_order.py
      - name: Customer page integrity
        run: python -m pytest -q tests/test_customer_page_integrity.py
      - name: Withdrawal payout safety
        run: python -m pytest -q tests/test_withdrawal_payout_error_guards.py tests/test_withdrawal_not_sent_db.py
      - name: Full pytest suite (SQLite application tests; PostgreSQL tests run in mandatory PostgreSQL step)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_trading.db
        run: |
          python -m pytest -m "not postgres" -q -rs --junitxml=full-suite.xml
          python scripts/assert_no_skips.py full-suite.xml
      - name: Run all PostgreSQL-marked integration tests (mandatory, no skips)
        env:
          DATABASE_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
          ATLAS_POSTGRES_URL: postgresql+asyncpg://atlas:test_password@localhost:5432/atlas_test
        run: |
          python -m pytest -m postgres -q -rs --junitxml=postgres-marked.xml
          python scripts/assert_no_skips.py postgres-marked.xml
      - name: Shell syntax
        run: |
          bash -n deploy/cloud-run-deploy.sh
          bash -n deploy/tron-funding-gate.sh
          bash -n deploy/cloud-run-worker-deploy.sh
          bash -n deploy/cloud-run-migration-job.sh
          bash -n deploy/verify-live-money-runtime.sh
          bash -n deploy/verify-cloud-audit.sh
          bash -n deploy/gcp-security-audit-retention.sh
          bash -n deploy/cloud-run-canary.sh
          bash -n deploy/cloud-run-rollback.sh
          bash -n scripts/apply_final_fixes.sh
          bash -n deploy/verify-deployed-release.sh

  android-security-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install Android security test runner
        run: python -m pip install --disable-pip-version-check pytest
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"
      - name: Compile Android debug artifact
        run: gradle :app:assembleDebug
      - name: Verify Android security source gates
        run: |
          python -m pytest -q tests/test_production_security_gates.py
