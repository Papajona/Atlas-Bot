          -- the temporary grantor only the schema access needed to issue this
          -- delegated function grant, then revoke it immediately afterward.
          GRANT USAGE ON SCHEMA public TO atlas_ledger_acl_grantor;
          SET ROLE atlas_ledger_acl_grantor;
          GRANT EXECUTE ON FUNCTION public.atlas_research_trial_archive_immutable()
              TO atlas_ledger_acl_delegate;
          RESET ROLE;
          REVOKE USAGE ON SCHEMA public FROM atlas_ledger_acl_grantor;
