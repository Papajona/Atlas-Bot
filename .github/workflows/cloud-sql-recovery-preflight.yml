name: Cloud SQL recovery resource discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-sql-recovery-preflight.yml"
      - "scripts/cloud_sql_recovery_discovery.py"
      - "scripts/bootstrap_atlas_paper_staging_gcp.sh"
      - "scripts/bootstrap_atlas_staging_discovery_identity.sh"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-cloud-sql-recovery-discovery
  cancel-in-progress: false

jobs:
  discover-recovery-resources:
    # Keep discovery on main. The protected staging environment supplies its optional identity
    # to a step-level guard below, where missing configuration can skip safely.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_STAGING_DISCOVERY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DISCOVERY_SERVICE_ACCOUNT }}
      BACKUP_BUCKET: atlas-staging-510915-db-backups
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check whether the dedicated read-only discovery identity is provisioned
        id: discovery_identity
        shell: bash
        env:
          GCP_STAGING_DISCOVERY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DISCOVERY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          expected="atlas-staging-discovery@atlas-staging-510915.iam.gserviceaccount.com"
          if [[ -z "$GCP_STAGING_DISCOVERY_SERVICE_ACCOUNT" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloud SQL resource discovery"
              echo
              echo "Skipped: the dedicated read-only discovery identity is not provisioned in the protected staging environment."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$GCP_STAGING_DISCOVERY_SERVICE_ACCOUNT" != "$expected" ]]; then
            echo "BLOCKED: GCP_STAGING_DISCOVERY_SERVICE_ACCOUNT must equal the dedicated read-only identity $expected." >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: steps.discovery_identity.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_STAGING_DISCOVERY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        if: steps.discovery_identity.outputs.enabled == 'true'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      - name: Discover Cloud SQL instances, databases, backups, service accounts and GCS objects
        if: steps.discovery_identity.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GCP_PROJECT_ID" == "atlas-staging-510915" ]]
          [[ "$GCP_REGION" == "europe-west1" ]]
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]]
          python scripts/cloud_sql_recovery_discovery.py \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --bucket "$BACKUP_BUCKET" \
            --output "$RUNNER_TEMP/recovery-resource-discovery.json"
      - name: Preserve sanitized resource-discovery inventory
        if: always() && steps.discovery_identity.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-cloud-sql-resource-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-resource-discovery.json
          if-no-files-found: warn
          retention-days: 30
