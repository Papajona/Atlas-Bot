name: Cloud SQL recovery resource preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-sql-recovery-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-cloud-sql-recovery-preflight
  cancel-in-progress: false

jobs:
  inspect-recovery-resources:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT || secrets.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT }}
      CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.ATLAS_STAGING_CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      CLOUD_SQL_DATABASE: ${{ vars.ATLAS_STAGING_CLOUD_SQL_DATABASE }}
      PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.ATLAS_PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      BACKUP_BUCKET: atlas-staging-510915-db-backups
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT || secrets.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      - name: Inspect the isolated Cloud SQL target and immutable backup inventory
        shell: bash
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Missing GCP_PROJECT_ID}"
          : "${GCP_REGION:?Missing GCP_REGION}"
          : "${CLOUD_SQL_INSTANCE_CONNECTION_NAME:?Missing ATLAS_STAGING_CLOUD_SQL_INSTANCE_CONNECTION_NAME}"
          : "${CLOUD_SQL_DATABASE:?Missing ATLAS_STAGING_CLOUD_SQL_DATABASE}"
          : "${PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME:?Missing ATLAS_PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME}"
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]]
          [[ "$GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT" == *@*.iam.gserviceaccount.com ]]
          [[ "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" =~ ^[a-z0-9-]+:[a-z0-9-]+:[a-z0-9-]+$ ]]
          [[ "$PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME" =~ ^[a-z0-9-]+:[a-z0-9-]+:[a-z0-9-]+$ ]]
          [[ "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" != "$PRODUCTION_CLOUD_SQL_INSTANCE_CONNECTION_NAME" ]]
          [[ "${CLOUD_SQL_INSTANCE_CONNECTION_NAME%%:*}" == "$GCP_PROJECT_ID" ]]
          [[ "${CLOUD_SQL_INSTANCE_CONNECTION_NAME#*:}" == "$GCP_REGION:"* ]]

          instance_name="${CLOUD_SQL_INSTANCE_CONNECTION_NAME##*:}"
          gcloud sql instances describe "$instance_name" --project="$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/recovery-instance.json"
          gcloud sql databases describe "$CLOUD_SQL_DATABASE" --instance="$instance_name" --project="$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/recovery-database.json"
          gcloud storage buckets describe "gs://$BACKUP_BUCKET" --format=json > "$RUNNER_TEMP/backup-bucket.json"

          python - "$RUNNER_TEMP" "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" "$CLOUD_SQL_DATABASE" "$BACKUP_BUCKET" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          from scripts.cloud_sql_recovery_inventory import is_source_backup_candidate

          root = Path(sys.argv[1])
          expected_instance, expected_database, bucket = sys.argv[2:]
          instance = json.loads((root / "recovery-instance.json").read_text())
          database = json.loads((root / "recovery-database.json").read_text())
          bucket_meta = json.loads((root / "backup-bucket.json").read_text())

          observed = f'{instance.get("project", "")}:{instance.get("region", "")}:{instance.get("name", "")}'
          if observed != expected_instance:
              raise SystemExit("BLOCKED: Cloud SQL recovery instance identity does not match the protected configuration")
          if instance.get("state") != "RUNNABLE":
              raise SystemExit("BLOCKED: Cloud SQL recovery instance is not RUNNABLE")
          if database.get("name") != expected_database:
              raise SystemExit("BLOCKED: Cloud SQL recovery database identity does not match the protected configuration")

          retention = bucket_meta.get("retentionPolicy") or bucket_meta.get("retention_policy") or {}
          retention_locked = retention.get("isLocked", retention.get("is_locked")) is True

          token = subprocess.check_output(["gcloud", "auth", "print-access-token"], text=True).strip()
          if not token:
              raise SystemExit("BLOCKED: Google Cloud access token is unavailable")
          items = []
          page_token = None
          while True:
              query = {
                  "versions": "true",
                  "maxResults": "1000",
                  "fields": "items(name,generation,size,timeCreated,timeDeleted,md5Hash,crc32c,retentionExpirationTime),nextPageToken",
              }
              if page_token:
                  query["pageToken"] = page_token
              url = (
                  "https://storage.googleapis.com/storage/v1/b/"
                  + quote(bucket, safe="")
                  + "/o?"
                  + urlencode(query)
              )
              request = Request(url, headers={"Authorization": "Bearer " + token})
              with urlopen(request, timeout=30) as response:
                  page = json.loads(response.read().decode("utf-8"))
              items.extend(page.get("items", []))
              page_token = page.get("nextPageToken")
              if not page_token:
                  break

          candidate = [
              {
                  "name": item.get("name"),
                  "generation": item.get("generation"),
                  "size": item.get("size"),
                  "timeCreated": item.get("timeCreated"),
                  "timeDeleted": item.get("timeDeleted"),
                  "checksum_present": bool(
                      item.get("md5Hash") or item.get("md5_hash")
                      or item.get("crc32c") or item.get("crc32c_hash")
                  ),
                  "retentionExpirationTime": item.get("retentionExpirationTime"),
              }
              for item in items
              if isinstance(item, dict) and is_source_backup_candidate(item)
          ]
          summary = {
              "status": "PASS" if retention_locked and candidate else "BLOCKED",
              "target_instance": observed,
              "target_state": instance.get("state"),
              "target_database": database.get("name"),
              "database_version": instance.get("databaseVersion"),
              "region": instance.get("region"),
              "backup_bucket": bucket,
              "bucket_retention_policy_locked": retention_locked,
              "listed_object_versions": len(items),
              "database_backup_candidates": len(candidate),
              "candidate_objects": candidate[:100],
              "candidate_list_truncated": len(candidate) > 100,
          }
          (root / "recovery-preflight-summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, sort_keys=True))
          if not retention_locked:
              raise SystemExit("BLOCKED: backup bucket retention policy is not locked")
          if not candidate:
              raise SystemExit("BLOCKED: no PostgreSQL backup object was found in the approved bucket")
          PY
      - name: Preserve sanitized recovery resource inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-cloud-sql-recovery-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-preflight-summary.json
          if-no-files-found: warn
          retention-days: 30
