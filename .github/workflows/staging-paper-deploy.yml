name: Deploy Paper-Only Atlas Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: atlas-paper-only-staging-deploy
  # Keep the parent run alive so any uniquely dispatched staging preflight or
  # acceptance drill can finish. The active run polls main and exits stale before
  # deployment; GitHub retains only the newest pending run in this concurrency group.
  cancel-in-progress: false

jobs:
  deploy-paper-staging:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      STAGING_SERVICE: ${{ vars.ATLAS_STAGING_CLOUD_RUN_SERVICE }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.ATLAS_STAGING_RUNTIME_SERVICE_ACCOUNT }}
      DATABASE_SECRET: ${{ vars.ATLAS_STAGING_DATABASE_SECRET }}
      PAPER_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_PAPER_DATABASE_SECRET }}
      SUPABASE_ANON_KEY_SECRET: ${{ vars.ATLAS_STAGING_SUPABASE_ANON_KEY_SECRET }}
      SUPABASE_PROJECT_REF: ${{ vars.ATLAS_STAGING_SUPABASE_PROJECT_REF }}
    steps:
      - name: Wait for required CI gates to pass on this exact commit
        id: wait-required-gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

          workflows=("ci.yml" "ledger-concurrency-check.yml" "production-verification.yml")
          labels=("Atlas CI" "PostgreSQL ledger concurrency" "Production Verification Gate")
          declare -A passed=()
          gate_wait_seconds=7200
          gate_poll_interval_seconds=30
          gate_started_at="$(date +%s)"

          # The required CI jobs have 20-45 minute limits; allow two hours for
          # queue delay and completion before this paper-only deployment is blocked.
          while true; do
            current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
              echo "stale=true" >> "$GITHUB_OUTPUT"
              echo "SKIP: main advanced to $current_main_sha while this staging run waited for CI; releasing the staging concurrency slot without deploying stale commit $GITHUB_SHA."
              exit 0
            fi

            all_passed=true
            for index in "${!workflows[@]}"; do
              workflow="${workflows[$index]}"
              label="${labels[$index]}"
              if [[ "${passed[$workflow]:-}" == "yes" ]]; then
                continue
              fi

              if [[ "$workflow" == "production-verification.yml" ]]; then
                # Accept a manual run or the push-triggered offline Production Core
                # Verification for this exact main commit. PR and scheduled runs remain
                # ineligible; the Native AI offline step is checked below in both cases.
                run_json="$(gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "$workflow" \
                  --commit "$GITHUB_SHA" \
                  --limit 100 \
                  --json databaseId,headSha,headBranch,event,status,conclusion \
                  --jq '[.[] | select(.headBranch == "main" and (.event == "workflow_dispatch" or .event == "push") and .headSha == "'"$GITHUB_SHA"'")] | sort_by(.databaseId) | last // {}')"
              else
                run_json="$(gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "$workflow" \
                  --commit "$GITHUB_SHA" \
                  --limit 100 \
                  --json databaseId,headSha,status,conclusion \
                  --jq 'sort_by(.databaseId) | last // {}')"
              fi
              run_id="$(jq -r '.databaseId // ""' <<< "$run_json")"
              run_sha="$(jq -r '.headSha // ""' <<< "$run_json")"
              run_status="$(jq -r '.status // "missing"' <<< "$run_json")"
              run_conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"

              if [[ "$run_sha" != "$GITHUB_SHA" ]]; then
                all_passed=false
                continue
              fi
              if [[ "$run_status" == "completed" ]]; then
                if [[ "$run_conclusion" != "success" ]]; then
                  echo "BLOCKED: $label completed with conclusion '${run_conclusion:-missing}' on exact commit $GITHUB_SHA"
                  exit 1
                fi
                if [[ "$workflow" == "production-verification.yml" ]]; then
                  verification_json="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch,event,status,conclusion,jobs)"
                  native_outcome="$(jq -r '[.jobs[].steps[] | select(.name == "Atlas Native AI offline verification (no provider calls)") | .conclusion][0] // ""' <<< "$verification_json")"
                  verification_event="$(jq -r '.event // ""' <<< "$verification_json")"
                  if [[ "$(jq -r '.headSha // ""' <<< "$verification_json")" != "$GITHUB_SHA" \
                    || "$(jq -r '.headBranch // ""' <<< "$verification_json")" != "main" \
                    || ( "$verification_event" != "workflow_dispatch" && "$verification_event" != "push" ) \
                    || "$native_outcome" != "success" ]]; then
                    echo "BLOCKED: Production Verification run $run_id is not a successful exact-main Native AI offline verification for commit $GITHUB_SHA"
                    exit 1
                  fi
                fi
                passed[$workflow]="yes"
                echo "PASS: $label succeeded on exact commit $GITHUB_SHA"
              else
                all_passed=false
              fi
            done
            if [[ "$all_passed" == "true" ]]; then
              echo "PASS: all required exact-commit CI gates passed; staging deployment may proceed."
              exit 0
            fi
            now="$(date +%s)"
            if (( now - gate_started_at >= gate_wait_seconds )); then
              break
            fi
            sleep "$gate_poll_interval_seconds"
          done

          echo "BLOCKED: timed out after ${gate_wait_seconds}s waiting for Atlas CI, PostgreSQL concurrency, and Production Verification to finish successfully on exact commit $GITHUB_SHA"
          exit 1

      - name: Validate staging inputs
        if: steps.wait-required-gates.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Missing GCP_PROJECT_ID}"
          : "${GCP_REGION:?Missing GCP_REGION}"
          : "${WIF_PROVIDER:?Missing GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${DEPLOY_SERVICE_ACCOUNT:?Missing GCP_STAGING_DEPLOY_SERVICE_ACCOUNT}"
          : "${STAGING_SERVICE:?Missing ATLAS_STAGING_CLOUD_RUN_SERVICE}"
          : "${RUNTIME_SERVICE_ACCOUNT:?Missing ATLAS_STAGING_RUNTIME_SERVICE_ACCOUNT}"
          : "${DATABASE_SECRET:?Missing ATLAS_STAGING_DATABASE_SECRET}"
          : "${PAPER_DATABASE_SECRET:?Missing ATLAS_STAGING_PAPER_DATABASE_SECRET}"
          : "${SUPABASE_ANON_KEY_SECRET:?Missing ATLAS_STAGING_SUPABASE_ANON_KEY_SECRET}"
          : "${SUPABASE_PROJECT_REF:?Missing ATLAS_STAGING_SUPABASE_PROJECT_REF}"
          [[ "$GCP_PROJECT_ID" == "atlas-staging-510915" ]] || { echo "BLOCKED: refusing deployment outside the explicit Atlas staging project"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "BLOCKED: invalid Supabase project ref"; exit 1; }
          [[ "$STAGING_SERVICE" =~ ^[a-z][a-z0-9-]{0,48}$ ]] || { echo "BLOCKED: invalid staging Cloud Run service name"; exit 1; }
          [[ "$DATABASE_SECRET" != "$PAPER_DATABASE_SECRET" ]] || { echo "BLOCKED: DB credentials must use distinct secrets"; exit 1; }
          [[ "$DATABASE_SECRET" != "$SUPABASE_ANON_KEY_SECRET" && "$PAPER_DATABASE_SECRET" != "$SUPABASE_ANON_KEY_SECRET" ]] || { echo "BLOCKED: Supabase key and DB URLs must use distinct secrets"; exit 1; }

      - name: Checkout exact main commit
        if: steps.wait-required-gates.outputs.stale != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Authenticate to Google Cloud with main-only workload identity
        if: steps.wait-required-gates.outputs.stale != 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: steps.wait-required-gates.outputs.stale != 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build and push exact commit image to Artifact Registry
        if: steps.wait-required-gates.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/atlas-staging/atlas-paper-api:${GITHUB_SHA}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build --pull --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "$IMAGE" > "$RUNNER_TEMP/atlas-paper-staging-image"
          echo "Built and pushed image for ${GITHUB_SHA}"

      - name: Deploy restricted paper-only Cloud Run service
        if: steps.wait-required-gates.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            echo "BLOCKED: main advanced before Cloud Run deployment; refusing to replace staging with stale commit $GITHUB_SHA."
            exit 1
          fi
          IMAGE="$(cat "$RUNNER_TEMP/atlas-paper-staging-image")"
          gcloud run deploy "$STAGING_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --port=8000 \
            --cpu=2 \
            --memory=2Gi \
            --timeout=300 \
            --min=0 \
            --max=2 \
            --set-env-vars="ENVIRONMENT=staging,PROCESS_ROLE=paper,ATLAS_ASGI_APP=app.paper_staging:app,SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co,PAPER_TRADING=true,LIVE_TRADING_ENABLED=false,CUSTOMER_LIVE_TRADING_ENABLED=false,PAYOUT_LIVE_ENABLED=false,BROKER_SANDBOX=true,USDT_TRON_ENABLED=false,USDT_TRON_SWEEP_ENABLED=false,DERIV_LIVE_ENABLED=false,CUSTOMER_PAPER_LEDGER_ENABLED=true,CUSTOMER_PAPER_SHARED_DATABASE_ENABLED=true,CUSTOMER_TOTP_REQUIRED=true,ADAPTIVE_AI_ENABLED=false" \
            --set-secrets="DATABASE_URL=${DATABASE_SECRET}:latest,CUSTOMER_PAPER_DATABASE_URL=${PAPER_DATABASE_SECRET}:latest,SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY_SECRET}:latest"
          SERVICE_URL="$(gcloud run services describe "$STAGING_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          [[ "$SERVICE_URL" == https://* ]] || { echo "BLOCKED: deployed Cloud Run service did not return an HTTPS URL"; exit 1; }
          BODY="$RUNNER_TEMP/atlas-paper-staging-health.json"
          HTTP_CODE="$(curl --silent --show-error --output "$BODY" --write-out '%{http_code}' --max-time 30 "$SERVICE_URL/livez" || true)"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "BLOCKED: paper-only staging liveness check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          python - "$BODY" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1], encoding="utf-8"))
          if result.get("status") != "ok" or result.get("mode") != "paper-only":
              raise SystemExit("BLOCKED: deployed staging service is not the paper-only ASGI app")
          print("PASS: paper-only staging service is live. Full readiness remains separately gated by the read-only identity and isolated-ledger preflight.")
          PY

      - name: Capture Cloud Run startup diagnostics after deployment failure
        if: failure() && steps.wait-required-gates.outputs.stale != 'true'
        shell: bash
        run: |
          set +e
          echo "Collecting bounded Cloud Run startup diagnostics for $STAGING_SERVICE in $GCP_PROJECT_ID/$GCP_REGION."
          revision="$(gcloud run services describe "$STAGING_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format='value(status.latestCreatedRevisionName)' 2>&1)"
          describe_rc=$?
          if [[ "$describe_rc" -eq 0 && -n "$revision" ]]; then
            echo "Latest created revision: $revision"
            gcloud run revisions describe "$revision" \
              --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
              --format='yaml(status.conditions,status.containerStatuses)' 2>&1 || true
            filter="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$STAGING_SERVICE\" AND resource.labels.revision_name=\"$revision\""
          else
            echo "Could not resolve latest created revision: $revision"
            filter="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$STAGING_SERVICE\""
          fi
          echo "Recent Cloud Run logs (last 45 minutes, bounded to 100 entries):"
          gcloud logging read "$filter" --project="$GCP_PROJECT_ID" \
            --freshness=45m --limit=100 --order=desc \
            --format='value(timestamp,severity,resource.labels.revision_name,textPayload,jsonPayload.message)' 2>&1 || true
          echo "Diagnostic collection finished; it does not convert a failed deployment into success."
          exit 0

      - name: Dispatch and require read-only staging identity preflight on this exact commit
        if: steps.wait-required-gates.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            echo "BLOCKED: main advanced during staging deployment; refusing to certify a different commit."
            exit 1
          fi

          request_id="atlas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s%N)"
          expected_run_name="Staging identity preflight ($request_id)"

          gh workflow run staging-identity-preflight.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "request_id=$request_id"

          # Discover only the run carrying this dispatch's unique request ID.
          preflight_run_id=0
          for attempt in $(seq 1 90); do
            run_list="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "staging-identity-preflight.yml" \
              --event workflow_dispatch \
              --commit "$GITHUB_SHA" \
              --limit 100 \
              --json databaseId,headSha,displayTitle)"
            run_json="$(jq --arg expected "$expected_run_name" '[.[] | select(.displayTitle == $expected)] | sort_by(.databaseId) | last // {}' <<< "$run_list")"
            candidate_id="$(jq -r '.databaseId // 0' <<< "$run_json")"
            candidate_sha="$(jq -r '.headSha // ""' <<< "$run_json")"
            if [[ "$candidate_id" -gt 0 ]]; then
              if [[ "$candidate_sha" != "$GITHUB_SHA" ]]; then
                echo "BLOCKED: correlated staging preflight run is not on exact commit $GITHUB_SHA."
                exit 1
              fi
              preflight_run_id="$candidate_id"
              break
            fi
            sleep 10
          done

          if [[ "$preflight_run_id" -eq 0 ]]; then
            echo "BLOCKED: the uniquely correlated staging preflight run was not observed after dispatch."
            exit 1
          fi

          # From this point onward, poll the same run ID, never the newest same-SHA run.
          for attempt in $(seq 1 90); do
            run_json="$(gh run view "$preflight_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId,headSha,status,conclusion,displayTitle)"
            run_id="$(jq -r '.databaseId // 0' <<< "$run_json")"
            run_sha="$(jq -r '.headSha // ""' <<< "$run_json")"
            run_name="$(jq -r '.displayTitle // ""' <<< "$run_json")"
            run_status="$(jq -r '.status // "missing"' <<< "$run_json")"
            run_conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"

            if [[ "$run_id" != "$preflight_run_id" || "$run_name" != "$expected_run_name" ]]; then
              echo "BLOCKED: the tracked staging preflight run identity changed unexpectedly."
              exit 1
            fi
            if [[ "$run_sha" != "$GITHUB_SHA" ]]; then
              echo "BLOCKED: the tracked staging preflight is not on exact commit $GITHUB_SHA."
              exit 1
            fi
            if [[ "$run_status" == "completed" ]]; then
              if [[ "$run_conclusion" != "success" ]]; then
                echo "BLOCKED: correlated staging preflight completed with conclusion '${run_conclusion:-missing}'. Review run $preflight_run_id; deployment remains paper-only."
                exit 1
              fi

              # Re-check after preflight completion, immediately before certifying readiness.
              if ! current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"; then
                echo "BLOCKED: unable to re-read main after the staging preflight; deployment readiness is not certified."
                exit 1
              fi
              if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
                echo "BLOCKED: main advanced during staging preflight; refusing to certify commit $GITHUB_SHA."
                exit 1
              fi
              echo "PASS: read-only staging identity and isolated-ledger preflight run $preflight_run_id succeeded on exact current-main commit $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done

          echo "BLOCKED: correlated staging preflight run $preflight_run_id did not complete within the allowed polling window."
          exit 1

      - name: Dispatch and require customer-paper acceptance on this exact deployment
        if: steps.wait-required-gates.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            echo "BLOCKED: main advanced before customer-paper acceptance dispatch."
            exit 1
          fi

          # A workflow rerun reuses GITHUB_RUN_ID but increments GITHUB_RUN_ATTEMPT.
          # Add a per-dispatch nonce so an earlier acceptance run can never satisfy this attempt.
          dispatch_id="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          expected_run_name="Customer Paper Acceptance $GITHUB_SHA deploy $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT correlation $dispatch_id"
          acceptance_dispatch_started_at="$(date +%s)"
          gh workflow run customer-paper-staging-acceptance.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "target_sha=$GITHUB_SHA" \
            -f "deployment_run_id=$GITHUB_RUN_ID" \
            -f "deployment_run_attempt=$GITHUB_RUN_ATTEMPT" \
            -f "dispatch_id=$dispatch_id"

          acceptance_run_id=0
          acceptance_wait_seconds=5400
          acceptance_poll_interval_seconds=30
          while true; do
            now="$(date +%s)"
            if (( now - acceptance_dispatch_started_at >= acceptance_wait_seconds )); then
              break
            fi

            if [[ "$acceptance_run_id" -eq 0 ]]; then
              run_list="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "customer-paper-staging-acceptance.yml" \
                --event workflow_dispatch \
                --limit 100 \
                --json databaseId,headSha,headBranch,displayTitle)"
              run_json="$(jq --arg expected "$expected_run_name" '[.[] | select(.displayTitle == $expected)] | sort_by(.databaseId) | last // {}' <<< "$run_list")"
              candidate_id="$(jq -r '.databaseId // 0' <<< "$run_json")"
              candidate_sha="$(jq -r '.headSha // ""' <<< "$run_json")"
              candidate_branch="$(jq -r '.headBranch // ""' <<< "$run_json")"
              if [[ "$candidate_id" -gt 0 ]]; then
                if [[ "$candidate_sha" != "$GITHUB_SHA" || "$candidate_branch" != "main" ]]; then
                  echo "BLOCKED: uniquely correlated acceptance run is not on exact main commit $GITHUB_SHA."
                  exit 1
                fi
                acceptance_run_id="$candidate_id"
              fi
            else
              run_json="$(gh run view "$acceptance_run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,headSha,headBranch,status,conclusion,displayTitle)"
              run_id="$(jq -r '.databaseId // 0' <<< "$run_json")"
              run_sha="$(jq -r '.headSha // ""' <<< "$run_json")"
              run_branch="$(jq -r '.headBranch // ""' <<< "$run_json")"
              run_name="$(jq -r '.displayTitle // ""' <<< "$run_json")"
              run_status="$(jq -r '.status // "missing"' <<< "$run_json")"
              run_conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"
              if [[ "$run_id" != "$acceptance_run_id" || "$run_sha" != "$GITHUB_SHA" || "$run_branch" != "main" || "$run_name" != "$expected_run_name" ]]; then
                echo "BLOCKED: tracked customer-paper acceptance run identity changed unexpectedly."
                exit 1
              fi
              if [[ "$run_status" == "completed" ]]; then
                if [[ "$run_conclusion" != "success" ]]; then
                  echo "BLOCKED: customer-paper acceptance run $acceptance_run_id completed with conclusion '${run_conclusion:-missing}'."
                  exit 1
                fi
                echo "PASS: customer-paper acceptance run $acceptance_run_id succeeded on exact deployed commit $GITHUB_SHA (deployment attempt $GITHUB_RUN_ATTEMPT; unique correlation verified)"
                exit 0
              fi
            fi
            sleep "$acceptance_poll_interval_seconds"
          done

          echo "BLOCKED: uniquely correlated customer-paper acceptance run '${acceptance_run_id:-not-observed}' did not complete successfully within ${acceptance_wait_seconds}s; deployment remains paper-only."
          exit 1