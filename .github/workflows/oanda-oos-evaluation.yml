name: Original OANDA walk-forward release evidence

on:
  workflow_dispatch:
    inputs:
      dataset_archive_prefix:
        description: Exact archived prefix, e.g. oanda-practice/123456789-<40-char-commit-sha>
        required: true
        type: string
      expected_rows:
        description: Required original dataset row count
        required: true
        default: "1799"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-oanda-oos-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      ARCHIVE_BUCKET: ${{ vars.ATLAS_OANDA_ARCHIVE_BUCKET }}
      REFERENCE_MANIFEST_OBJECT: ${{ vars.ATLAS_ORIGINAL_OANDA_REFERENCE_OBJECT }}
      TRIAL_LEDGER_OBJECT: ${{ vars.ATLAS_RESEARCH_TRIAL_LEDGER_OBJECT }}
      EXPERIMENT_ARCHIVE_OBJECT: ${{ vars.ATLAS_RESEARCH_EXPERIMENT_ARCHIVE_OBJECT }}
      DATASET_PREFIX: ${{ inputs.dataset_archive_prefix }}
      EXPECTED_ROWS: ${{ inputs.expected_rows }}
      RESEARCH_TAKER_BPS: ${{ vars.ATLAS_RESEARCH_TAKER_BPS }}
      RESEARCH_SLIPPAGE_BPS: ${{ vars.ATLAS_RESEARCH_SLIPPAGE_BPS }}
      RESEARCH_CARRY_BPS_PER_BAR: ${{ vars.ATLAS_RESEARCH_CARRY_BPS_PER_BAR }}
      RESEARCH_MAX_HOLD_BARS: ${{ vars.ATLAS_RESEARCH_MAX_HOLD_BARS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate immutable archive paths and explicit main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          : "${GCP_PROJECT_ID:?Missing protected GCP_PROJECT_ID}"
          : "${ARCHIVE_BUCKET:?Set ATLAS_OANDA_ARCHIVE_BUCKET in staging}"
          : "${REFERENCE_MANIFEST_OBJECT:?Set ATLAS_ORIGINAL_OANDA_REFERENCE_OBJECT in staging}"
          : "${TRIAL_LEDGER_OBJECT:?Set ATLAS_RESEARCH_TRIAL_LEDGER_OBJECT in staging}"
          : "${EXPERIMENT_ARCHIVE_OBJECT:?Set ATLAS_RESEARCH_EXPERIMENT_ARCHIVE_OBJECT in staging}"
          [[ "$DATASET_PREFIX" =~ ^oanda-practice/[0-9]+-[0-9a-f]{40}$ ]] || {
            echo "BLOCKED: dataset_archive_prefix must be a run/SHA path under oanda-practice/"
            exit 1
          }
          [[ "$EXPECTED_ROWS" == "1799" ]] || {
            echo "BLOCKED: this gate verifies the known original dataset and requires exactly 1799 completed candles"
            exit 1
          }
          : "${RESEARCH_TAKER_BPS:?Set approved ATLAS_RESEARCH_TAKER_BPS in staging}"
          : "${RESEARCH_SLIPPAGE_BPS:?Set approved ATLAS_RESEARCH_SLIPPAGE_BPS in staging}"
          : "${RESEARCH_CARRY_BPS_PER_BAR:?Set evidence-backed ATLAS_RESEARCH_CARRY_BPS_PER_BAR in staging}"
          : "${RESEARCH_MAX_HOLD_BARS:?Set approved ATLAS_RESEARCH_MAX_HOLD_BARS in staging}"
          python - <<'PY'
          import math, os
          for name in ("RESEARCH_TAKER_BPS", "RESEARCH_SLIPPAGE_BPS", "RESEARCH_CARRY_BPS_PER_BAR"):
              value = float(os.environ[name])
              if not math.isfinite(value) or value < 0:
                  raise SystemExit(f"BLOCKED: {name} must be finite and non-negative")
          if int(os.environ["RESEARCH_MAX_HOLD_BARS"]) < 1:
              raise SystemExit("BLOCKED: RESEARCH_MAX_HOLD_BARS must be positive")
          PY
          [[ "$REFERENCE_MANIFEST_OBJECT" =~ ^trusted-reference/[A-Za-z0-9._/-]+\.json$ && "$REFERENCE_MANIFEST_OBJECT" != *".."* ]] || {
            echo "BLOCKED: trusted reference object must be within trusted-reference/"
            exit 1
          }
          [[ "$TRIAL_LEDGER_OBJECT" =~ ^research-trials/[A-Za-z0-9._/-]+\.json$ && "$TRIAL_LEDGER_OBJECT" != *".."* ]] || {
            echo "BLOCKED: trial ledger object must be within research-trials/"
            exit 1
          }
          [[ "$EXPERIMENT_ARCHIVE_OBJECT" =~ ^research-experiments/[A-Za-z0-9._/-]+\.zip$ && "$EXPERIMENT_ARCHIVE_OBJECT" != *".."* ]] || {
            echo "BLOCKED: full experiment archive object must be within research-experiments/ and end in .zip"
            exit 1
          }
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGING_RESEARCH_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Download original dataset, trusted identity reference, and complete trial ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-dataset"
          gcloud storage cp --recursive \
            "gs://$ARCHIVE_BUCKET/$DATASET_PREFIX/oanda_dataset_capture/*" \
            "$RUNNER_TEMP/original-dataset/"
          gcloud storage cp \
            "gs://$ARCHIVE_BUCKET/$REFERENCE_MANIFEST_OBJECT" \
            "$RUNNER_TEMP/original-reference-manifest.json"
          gcloud storage cp \
            "gs://$ARCHIVE_BUCKET/$TRIAL_LEDGER_OBJECT" \
            "$RUNNER_TEMP/complete-trial-ledger.json"
          gcloud storage cp \
            "gs://$ARCHIVE_BUCKET/$EXPERIMENT_ARCHIVE_OBJECT" \
            "$RUNNER_TEMP/complete-experiment-archive.zip"
          test -s "$RUNNER_TEMP/original-dataset/manifest.json"
          test -s "$RUNNER_TEMP/original-dataset/oanda_raw_response.json"
          test -s "$RUNNER_TEMP/original-dataset/oanda_completed_mid_candles.csv"
          test -s "$RUNNER_TEMP/complete-experiment-archive.zip"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install hash-locked runtime dependencies
        run: |
          python -m pip install --upgrade "pip==25.3"
          MULTIDICT_NO_EXTENSIONS=1 python -m pip install --no-binary=multidict --require-hashes -r requirements.lock
          python -m pip check
      - name: Evaluate only the verified original dataset
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          LIVE_TRADING_ENABLED: "false"
          PAYOUT_LIVE_ENABLED: "false"
          BROKER_SANDBOX: "true"
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_original_oanda_oos.py \
            --dataset-dir "$RUNNER_TEMP/original-dataset" \
            --reference-manifest "$RUNNER_TEMP/original-reference-manifest.json" \
            --trial-ledger "$RUNNER_TEMP/complete-trial-ledger.json" \
            --experiment-archive "$RUNNER_TEMP/complete-experiment-archive.zip" \
            --expected-rows "$EXPECTED_ROWS" \
            --asset forex --folds 5 --min-train 800 \
            --taker-bps "$RESEARCH_TAKER_BPS" \
            --slippage-bps "$RESEARCH_SLIPPAGE_BPS" \
            --carry-bps-per-bar "$RESEARCH_CARRY_BPS_PER_BAR" \
            --max-hold-bars "$RESEARCH_MAX_HOLD_BARS" \
            --output "$RUNNER_TEMP/oanda-oos-evaluation.json"
      - name: Archive evaluation output even when a gate fails
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "$RUNNER_TEMP/oanda-oos-evaluation.json" ]]; then
            gcloud storage cp "$RUNNER_TEMP/oanda-oos-evaluation.json" \
              "gs://$ARCHIVE_BUCKET/research-evaluations/$GITHUB_RUN_ID-$GITHUB_SHA/oanda-oos-evaluation.json"
          else
            echo "No evaluation report was created; inspect failed step logs. No research gate passed."
          fi
      - name: Preserve evaluation report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-oanda-oos-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/oanda-oos-evaluation.json
          if-no-files-found: warn
          retention-days: 90
