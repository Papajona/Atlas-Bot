name: Propagate Atlas Native AI across branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/propagate-native-ai-all-branches.yml"
      - "scripts/migrate_legacy_native_ai.py"
      - "app/groq_ai.py"
      - "app/prompt_safety.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-native-ai-branch-propagation
  cancel-in-progress: false

jobs:
  propagate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact triggering commit with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Safely propagate reviewed Native AI changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_WORKFLOW_UPDATE_TOKEN: ${{ secrets.ATLAS_WORKFLOW_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          NATIVE_AI_CLEANUP_COMMIT="f5e303dad1a93ce1a33940b3e2b16d118897ebf6"
          NATIVE_AI_CANONICAL_COMMIT="bafcc5bc3e5f025ce59c53555a622c9cb46a2f22"
          NATIVE_AI_EXTRA_BASE_COMMIT="0d38f95079833804713fcba080caee38a6ddfb4c"
          NATIVE_AI_EXTRA_COMMIT="2317ccc4c3293e8bbd7043970876eceb509d2d1d"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$NATIVE_AI_CLEANUP_COMMIT^{commit}"
          git cat-file -e "$NATIVE_AI_CANONICAL_COMMIT^{commit}"
          if ! git merge-base --is-ancestor "$NATIVE_AI_CANONICAL_COMMIT" "$GITHUB_SHA"; then
            echo "Pinned Native AI canonical source is not an ancestor of this reviewed main commit; refusing propagation." >&2
            exit 1
          fi
          git cat-file -e "$NATIVE_AI_EXTRA_BASE_COMMIT^{commit}"
          if [[ -z "$NATIVE_AI_EXTRA_COMMIT" ]]; then
            echo "Could not locate the reviewed release-diagnostics cleanup commit." >&2
            exit 1
          fi
          git cat-file -e "$NATIVE_AI_EXTRA_COMMIT^{commit}"
          extra_parent="$(git rev-parse "$NATIVE_AI_EXTRA_COMMIT^")"
          if [[ "$extra_parent" != "$NATIVE_AI_EXTRA_BASE_COMMIT" ]]; then
            echo "Refusing to propagate an unexpected cleanup range: expected parent $NATIVE_AI_EXTRA_BASE_COMMIT, found $extra_parent." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --prune

          # Only propagate the reviewed runtime/deployment cleanup. Legacy test files
          # often diverged or were deleted independently; carrying their whole changes
          # onto old branches adds conflicts without removing a live provider.
          NATIVE_AI_PATHS=(
            ".env.example"
            ".github/workflows/production-deploy.yml"
            ".github/workflows/production-verification.yml"
            "ENTRY_EXIT_3_9_0.md"
            "app/ai_providers.py"
            "app/groq_ai.py"
            "app/prompt_safety.py"
            "app/config.py"
            "app/daily_research.py"
            "app/main.py"
            "app/native_ai.py"
            "app/src/main/java/com/atlas/trading/network/ReleaseAdvisorClient.kt"
            "app/src/main/java/com/atlas/trading/ui/ReleaseAdvisorScreen.kt"
            "app/strategy_ai.py"
            "app/templates/customer.html"
            "deploy/DEPLOY_WORKFLOW.md"
            "deploy/cloud-run-deploy.sh"
            "deploy/cloud-run-worker-deploy.sh"
            "deploy/cloud-run.env.example"
            "deploy/gcp-bootstrap.sh"
            "metadata.json"
            "scripts/check_ai_models.py"
            "scripts/check_native_ai.py"
            "scripts/verify_release.sh"
          )

          # Load the migration helper from the exact triggering commit. It rewrites only
          # provider-bearing functions/settings and preserves unrelated branch logic.
          # Only the reviewed two-provider/three-provider strategy fallback shapes are
          # eligible for canonicalization; other branch-specific logic fails closed.
          git show "$GITHUB_SHA:scripts/migrate_legacy_native_ai.py" > "$RUNNER_TEMP/migrate_legacy_native_ai.py"
          python -m py_compile "$RUNNER_TEMP/migrate_legacy_native_ai.py"

          scan_active_provider_refs() {
            local rc=0 matches filtered
            if matches="$(git grep -nIEi 'gemini|cerebras|ai[[:space:]_-]*gateway|generativelanguage\.googleapis\.com|_gemini_json|settings\.gemini_|settings\.cerebras_api_key|settings\.ai_gateway_|AI_GATEWAY_API_KEY|AI_GATEWAY_BASE_URL|AI_GATEWAY_MODEL|CEREBRAS_API_KEY|CEREBRAS_MODEL|SECRET_OPENAI|atlas-openai|OPENAI_[[:alnum:]_]+|openai-compatible|api\.openai\.com|SECRET_GEMINI|api\.cerebras\.ai' -- . ':!tests' ':!docs' ':!README.md' ':!CHANGELOG.md' ':!.github/workflows/production-deploy.yml' ':!.github/workflows/production-verification.yml' ':!.github/workflows/propagate-native-ai-all-branches.yml' ':!scripts/migrate_legacy_native_ai.py')"; then
              rc=0
            else
              rc=$?
            fi
            if (( rc == 1 )); then
              matches=""
            elif (( rc != 0 )); then
              return "$rc"
            fi
            # Groq remains supported in app/groq_ai.py; only its legacy strategy adapters are migration targets.
            local legacy_groq_refs=""
            if legacy_groq_refs="$(git grep -nIEi '_groq_json|settings\.groq_(strategy_model|model|api_key)|GROQ_API_KEY|SECRET_GROQ|api\.groq\.com' -- app ':!app/groq_ai.py' ':!app/config.py')"; then
              matches+=$'\n'"$legacy_groq_refs"
            else
              rc=$?
              if (( rc != 1 )); then return "$rc"; fi
            fi
            # Config defines supported Groq research fields; scan it separately so
            # valid groq_api_key/groq_model fields are not treated as retired wiring.
            # The obsolete strategy selector remains forbidden.
            local legacy_groq_config_refs=""
            if legacy_groq_config_refs="$(git grep -nIEi 'groq_strategy_model' -- app/config.py)"; then
              matches+=$'\n'"$legacy_groq_config_refs"
            else
              rc=$?
              if (( rc != 1 )); then return "$rc"; fi
            fi
            # Filter only those exact marker lines; scan every other line in this workflow.
            filtered="$(printf '%s\n' "$matches" | awk '!($0 ~ /^\.github\/workflows\/prune-contained-branches-once\.yml:[0-9]+:/ && $0 ~ /grep -F .def _check_groq. >\/dev\/null/)')"
            # Check metadata with the semantic helper so a generic secretRef
            # containing an Atlas provider secret cannot bypass this skip gate.
            local metadata_matches=""
            if [[ -f metadata.json || -f .github/workflows/production-deploy.yml || -f .github/workflows/production-verification.yml ]]; then
              metadata_matches="$(MIGRATION_HELPER="$RUNNER_TEMP/migrate_legacy_native_ai.py" python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          helper_path = Path(os.environ["MIGRATION_HELPER"])
          spec = importlib.util.spec_from_file_location("atlas_native_ai_metadata_check", helper_path)
          if spec is None or spec.loader is None:
              raise SystemExit("Could not load Native AI metadata checker")
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          metadata_path = Path("metadata.json")
          if metadata_path.is_file() and helper._metadata_has_active_provider_wiring(metadata_path.read_text(encoding="utf-8")):
              print("metadata.json: active provider configuration or secret reference")

          for workflow_path in (
              Path(".github/workflows/production-deploy.yml"),
              Path(".github/workflows/production-verification.yml"),
          ):
              if not workflow_path.is_file():
                  continue
              workflow_source = workflow_path.read_text(encoding="utf-8")
              try:
                  cleaned = helper.scrub_workflow_ancillary(workflow_path.as_posix(), workflow_source)
              except helper.MigrationError as exc:
                  print(f"{workflow_path}: {exc}")
              else:
                  if cleaned != workflow_source:
                      print(f"{workflow_path}: retired-provider workflow wiring requires migration")
          PY
              )" || return $?
            fi
            if [[ -n "$filtered" ]]; then
              printf '%s\n' "$filtered"
            fi
            if [[ -n "$metadata_matches" ]]; then
              printf '%s\n' "$metadata_matches"
            fi
          }

          verify_native_ai_impl() {
            python - <<'PY'
          import ast
          from pathlib import Path

          app_dir = Path("app")
          module_paths = {
              "native_ai": app_dir / "native_ai.py",
              "groq_ai": app_dir / "groq_ai.py",
              "ai_providers": app_dir / "ai_providers.py",
          }
          trees = {}
          for module_name, path in module_paths.items():
              if not path.is_file():
                  raise SystemExit(f"Missing required Native AI module: {path}")
              trees[module_name] = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))

          def assigned_names(target):
              if isinstance(target, ast.Name):
                  return {target.id}
              if isinstance(target, (ast.Tuple, ast.List)):
                  names = set()
                  for item in target.elts:
                      names.update(assigned_names(item))
                  return names
              return set()

          def module_names(tree):
              names = set()
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      names.add(node.name)
                  elif isinstance(node, (ast.Import, ast.ImportFrom)):
                      for alias in node.names:
                          if alias.name != "*":
                              names.add(alias.asname or alias.name.rsplit(".", 1)[-1])
                  elif isinstance(node, ast.Assign):
                      for target in node.targets:
                          names.update(assigned_names(target))
                  elif isinstance(node, ast.AnnAssign):
                      names.update(assigned_names(node.target))
              return names

          available = {name: module_names(tree) for name, tree in trees.items()}
          problems = []
          for path in sorted(app_dir.rglob("*.py")):
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except (OSError, SyntaxError) as exc:
                  problems.append(f"{path}: cannot parse Python module ({exc})")
                  continue
              for node in ast.walk(tree):
                  if not isinstance(node, ast.ImportFrom):
                      continue
                  if node.level == 1 and node.module in available:
                      target_module = node.module
                  elif node.level == 0 and node.module in ("app.native_ai", "app.ai_providers"):
                      target_module = node.module.rsplit(".", 1)[-1]
                  else:
                      continue
                  for alias in node.names:
                      if alias.name != "*" and alias.name not in available[target_module]:
                          problems.append(
                              f"{path}: imports missing symbol {alias.name} from {target_module}"
                          )

          if problems:
              print("\n".join(problems))
              raise SystemExit(1)

          # This workflow intentionally has no application dependencies installed.
          # Verify API and alias contracts from the parsed AST instead of importing the
          # optional Groq adapter (which imports httpx) in the bare GitHub runner.
          native_names = available["native_ai"]
          facade_names = available["ai_providers"]
          groq_names = available["groq_ai"]
          for name in ("NativeAIError", "compose_strategy_spec", "native_research_review"):
              if name not in native_names:
                  raise SystemExit(f"app.native_ai is missing required symbol: {name}")
          for name in (
              "AIProviderError", "dual_ai_research_review", "dual_ai_trade_safety_review",
              "evaluate_native_trade_packet", "native_ai_health_check", "native_research_review",
              "native_trade_safety_review",
          ):
              if name not in facade_names:
                  raise SystemExit(f"app.ai_providers is missing required symbol: {name}")
          groq_reviewers = [
              node for node in trees["groq_ai"].body
              if isinstance(node, ast.AsyncFunctionDef) and node.name == "groq_research_review"
          ]
          if len(groq_reviewers) != 1:
              raise SystemExit("app.groq_ai must define exactly one async groq_research_review API")
          groq_reviewer = groq_reviewers[0]
          positional_parameters = groq_reviewer.args.posonlyargs + groq_reviewer.args.args
          positional_args = len(positional_parameters)
          required_positional = positional_args - len(groq_reviewer.args.defaults)
          required_keyword_only = [
              argument.arg
              for argument, default in zip(groq_reviewer.args.kwonlyargs, groq_reviewer.args.kw_defaults)
              if default is None
          ]
          if positional_args < 2 and groq_reviewer.args.vararg is None:
              raise SystemExit("app.groq_ai reviewer must accept research and intelligence positional arguments")
          if required_positional > 2:
              raise SystemExit("app.groq_ai reviewer cannot require more than two positional arguments")
          if required_keyword_only:
              raise SystemExit(f"app.groq_ai reviewer has required keyword-only arguments: {required_keyword_only}")

          # Keep branch-specific diagnostics only when their imports are within the
          # reviewed adapter contract and are known to resolve in the application.
          allowed_plain_imports = {"asyncio", "httpx", "json", "logging", "math", "re"}
          allowed_from_imports = {
              (0, "__future__"): {"annotations"},
              (0, "typing"): {"Any"},
              (1, "config"): {"settings"},
              (1, "prompt_safety"): {
                  "UNTRUSTED_PREAMBLE", "suspicious_instruction_markers", "wrap_untrusted",
              },
          }
          for node in ast.walk(trees["groq_ai"]):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name not in allowed_plain_imports:
                          raise SystemExit(f"app.groq_ai imports an unreviewed module: {alias.name}")
              elif isinstance(node, ast.ImportFrom):
                  allowed_names = allowed_from_imports.get((node.level, node.module or ""))
                  if allowed_names is None or any(
                      alias.name == "*"
                      or alias.name not in allowed_names
                      or ((node.level, node.module or "") == (0, "__future__") and alias.asname is not None)
                      for alias in node.names
                  ):
                      raise SystemExit(f"app.groq_ai has an unreviewed import from: {node.module}")
          def top_level_bound_names(node):
              names = set()
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  names.add(node.name)
              elif isinstance(node, (ast.Import, ast.ImportFrom)):
                  names.update((alias.asname or alias.name.split('.')[0] if isinstance(node, ast.Import) else alias.asname or alias.name) for alias in node.names if alias.name != '*')
              elif isinstance(node, ast.Assign):
                  for target in node.targets:
                      names.update(assigned_names(target))
              elif isinstance(node, (ast.AnnAssign, ast.AugAssign)):
                  names.update(assigned_names(node.target))
              elif isinstance(node, ast.Delete):
                  for target in node.targets:
                      names.update(assigned_names(target))
              return names

          nt = trees['native_ai']
          error_classes = [(i,n) for i,n in enumerate(nt.body) if isinstance(n, ast.ClassDef) and n.name == 'NativeAIError']
          alias_assignments = [(i,n) for i,n in enumerate(nt.body) if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'AIProviderError' for t in n.targets) and isinstance(n.value, ast.Name) and n.value.id == 'NativeAIError']
          native_error_bindings = [(i,n) for i,n in enumerate(nt.body) if 'NativeAIError' in top_level_bound_names(n)]
          native_alias_bindings = [(i,n) for i,n in enumerate(nt.body) if 'AIProviderError' in top_level_bound_names(n)]
          native_error_alias = (len(error_classes) == 1 and len(alias_assignments) == 1 and error_classes[0][0] < alias_assignments[0][0] and len(native_error_bindings) == 1 and native_error_bindings[0][1] is error_classes[0][1] and len(native_alias_bindings) == 1 and native_alias_bindings[0][1] is alias_assignments[0][1])

          ft = trees['ai_providers']
          facade_imports = [(i,n,a) for i,n in enumerate(ft.body) if isinstance(n, ast.ImportFrom) and n.level == 1 and n.module == 'native_ai' for a in n.names if a.name == 'AIProviderError']
          facade_error_bindings = [(i,n) for i,n in enumerate(ft.body) if 'AIProviderError' in top_level_bound_names(n)]
          facade_imports_native_error = (len(facade_imports) == 1 and facade_imports[0][2].asname is None and len(facade_error_bindings) == 1 and facade_error_bindings[0][1] is facade_imports[0][1])
          if not native_error_alias or not facade_imports_native_error:
              raise SystemExit('NativeAI error alias is renamed or rebound; preserving the branch')

          print("PASS: Native AI AST exports and compatibility aliases resolve.")
          PY
          }
          declare -a cleanup_warnings=()
          update_existing_branch_ref() {
            local branch="$1" expected_sha="$2" new_sha="$3"
            local remote_sha branch_hash temp_ref update_rc ref_payload repository_id current_sha update_payload updated_sha updated_ref_payload read_back_sha workflow_paths workflow_token workflow_auth_header
            remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk 'NR == 1 {print $1}')"
            if [[ "$remote_sha" != "$expected_sha" ]]; then
              echo "Ref refs/heads/$branch changed or disappeared after enumeration; refusing to update it." >&2
              return 1
            fi
            # Upload the candidate commit under a temporary ref. Update the target with
            # GraphQL updateRefs and beforeOid=expected_sha: the expected-tip check and
            # non-force fast-forward update are one atomic server-side operation.
            branch_hash="$(printf '%s' "$branch" | sha256sum | cut -c1-12)"
            temp_ref="atlas-native-ai-propagation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${branch_hash}"
            workflow_paths="$(git diff --name-only "$expected_sha" "$new_sha" -- .github/workflows)"
            if [[ -n "$workflow_paths" ]]; then
              workflow_token="${ATLAS_WORKFLOW_UPDATE_TOKEN:-}"
              if [[ -z "$workflow_token" ]]; then
                echo "Cannot update refs/heads/$branch: migration changes workflow files but ATLAS_WORKFLOW_UPDATE_TOKEN is not configured; target branch unchanged." >&2
                return 1
              fi
              # GITHUB_TOKEN has no workflow-file write permission. Use a separately
              # scoped GitHub App/PAT token only for uploading this temporary commit.
              workflow_auth_header="$(printf 'x-access-token:%s' "$workflow_token" | base64 -w0)"
              if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $workflow_auth_header" \
                  push origin "HEAD:refs/heads/$temp_ref" >/dev/null; then
                echo "Could not upload workflow-changing temporary commit ref for $branch; target branch unchanged." >&2
                return 1
              fi
            elif ! git push origin "HEAD:refs/heads/$temp_ref" >/dev/null; then
              echo "Could not upload temporary commit ref for $branch; target branch unchanged." >&2
              return 1
            fi
            update_rc=1
            if ref_payload="$(gh api graphql \
                -f query='query($owner: String!, $name: String!, $qualifiedName: String!) { repository(owner: $owner, name: $name) { id ref(qualifiedName: $qualifiedName) { id target { oid } } } }' \
                -F owner="$GITHUB_REPOSITORY_OWNER" \
                -F name="${GITHUB_REPOSITORY#*/}" \
                -F qualifiedName="refs/heads/$branch")"; then
              repository_id="$(jq -r '.data.repository.id // empty' <<<"$ref_payload")"
              current_sha="$(jq -r '.data.repository.ref.target.oid // empty' <<<"$ref_payload")"
              if [[ -z "$repository_id" || "$current_sha" != "$expected_sha" ]]; then
                echo "Ref refs/heads/$branch changed or disappeared before atomic update; refusing to overwrite it." >&2
                echo "Observed target SHA: ${current_sha:-unavailable}; expected starting SHA: $expected_sha" >&2
              else
                # Once updateRefs has been sent, a lost response or failed read-back
                # cannot prove that the remote mutation did not apply. Read the ref
                # after every mutation attempt and classify the observed final state.
                update_rc=2
                if update_payload="$(gh api graphql \
                    -f query='mutation($repoId: ID!, $name: GitRefname!, $before: GitObjectID!, $after: GitObjectID!) { updateRefs(input: {repositoryId: $repoId, refUpdates: [{name: $name, beforeOid: $before, afterOid: $after, force: false}], clientMutationId: "atlas-native-ai-propagation"}) { clientMutationId } }' \
                    -F repoId="$repository_id" \
                    -F name="refs/heads/$branch" \
                    -F before="$expected_sha" \
                    -F after="$new_sha")"; then
                  updated_sha="$(jq -r '.data.updateRefs.clientMutationId // empty' <<<"$update_payload")"
                  if [[ "$(jq -r '((.errors // []) | length) == 0' <<<"$update_payload")" == "true" && "$updated_sha" == "atlas-native-ai-propagation" ]]; then
                    echo "UpdateRefs acknowledged for refs/heads/$branch; checking the actual branch tip." >&2
                  else
                    echo "UpdateRefs response was not conclusive for refs/heads/$branch; checking the actual branch tip before classifying the result." >&2
                    echo "$update_payload" >&2
                  fi
                else
                  echo "UpdateRefs request returned no verifiable response for refs/heads/$branch; the mutation outcome may be ambiguous. Checking the actual branch tip." >&2
                  echo "${update_payload:-No GraphQL response was captured.}" >&2
                fi

                if updated_ref_payload="$(gh api graphql \
                    -f query='query($owner: String!, $name: String!, $qualifiedName: String!) { repository(owner: $owner, name: $name) { ref(qualifiedName: $qualifiedName) { target { oid } } } }' \
                    -F owner="$GITHUB_REPOSITORY_OWNER" \
                    -F name="${GITHUB_REPOSITORY#*/}" \
                    -F qualifiedName="refs/heads/$branch")"; then
                  read_back_sha="$(jq -r '.data.repository.ref.target.oid // empty' <<<"$updated_ref_payload")"
                  if [[ "$(jq -r '((.errors // []) | length) == 0' <<<"$updated_ref_payload")" == "true" && "$read_back_sha" == "$new_sha" ]]; then
                    update_rc=0
                    echo "Confirmed refs/heads/$branch now points to $new_sha." >&2
                  elif [[ "$(jq -r '((.errors // []) | length) == 0' <<<"$updated_ref_payload")" == "true" && "$read_back_sha" == "$expected_sha" ]]; then
                    update_rc=1
                    echo "Final read-back shows refs/heads/$branch still at its starting SHA; requested update was not confirmed." >&2
                  else
                    update_rc=2
                    echo "REMOTE STATE UNRESOLVED for refs/heads/$branch: read-back did not match either expected SHA." >&2
                    echo "Expected old SHA: $expected_sha; intended new SHA: $new_sha; observed SHA: ${read_back_sha:-unavailable}" >&2
                    echo "$updated_ref_payload" >&2
                  fi
                else
                  update_rc=2
                  echo "REMOTE STATE UNRESOLVED for refs/heads/$branch: mutation was attempted but read-back failed." >&2
                  echo "$updated_ref_payload" >&2
                fi
              fi
            else
              echo "Unable to read current ref state for $branch before mutation; no updateRefs mutation was sent." >&2
              echo "$ref_payload" >&2
            fi
            # Cleanup is independent of target-ref success. A cleanup failure is a
            # warning, not evidence that an already-updated target branch failed.
            if ! git push origin --delete "$temp_ref" >/dev/null; then
              cleanup_warnings+=("$branch: temporary ref refs/heads/$temp_ref remains; target update exit code=$update_rc")
              echo "::warning title=Temporary ref cleanup failed::refs/heads/$temp_ref could not be deleted; target update result remains exit code $update_rc."
            fi
            return "$update_rc"
          }

          declare -a updated=() skipped=() failed=()
          while IFS= read -r remote_ref; do
            [[ -n "$remote_ref" ]] || continue
            branch="${remote_ref#refs/remotes/origin/}"
            [[ "$branch" == "main" ]] && continue
            start_sha="$(git rev-parse "$remote_ref")"
            git checkout --detach "$start_sha" >/dev/null 2>&1

            before_refs="$(scan_active_provider_refs)" || { failed+=("$branch: provider scan errored; branch left unchanged"); continue; }
          if [[ -z "$before_refs" ]] && verify_native_ai_impl; then
            skipped+=("$branch (Native AI implementation verified; active provider scan clean)")
            continue
          fi
          if [[ -n "$before_refs" ]]; then
            echo "ACTIVE PROVIDER REFERENCES before semantic migration on $branch:" >&2
            printf '%s\n' "$before_refs" >&2
          fi

          # Do not replay the broad canonical commit. Apply only the AI settings/callsites
          # and provider-bearing deployment entries; the helper refuses unknown layouts.
          if ! python "$RUNNER_TEMP/migrate_legacy_native_ai.py" --canonical-commit "$NATIVE_AI_CANONICAL_COMMIT" --cleanup-commit "$NATIVE_AI_CLEANUP_COMMIT" --extra-base-commit "$NATIVE_AI_EXTRA_BASE_COMMIT" --extra-commit "$NATIVE_AI_EXTRA_COMMIT"; then
            git reset --hard "$start_sha" >/dev/null 2>&1 || true
            git clean -fd >/dev/null 2>&1 || true
            failed+=("$branch: semantic Native AI migration refused or failed; branch left unchanged")
            continue
          fi

          after_refs="$(scan_active_provider_refs)" || { git reset --hard "$start_sha" >/dev/null 2>&1 || true
            git clean -fd >/dev/null 2>&1 || true; failed+=("$branch: post-migration provider scan errored; branch left unchanged"); continue; }
          if [[ -n "$after_refs" ]]; then
            echo "ACTIVE PROVIDER REFERENCES REMAIN after semantic migration on $branch:" >&2
            git grep -nIEi 'gemini|cerebras|ai[[:space:]_-]*gateway|generativelanguage\.googleapis\.com|_gemini_json|settings\.gemini_|settings\.cerebras_api_key|settings\.ai_gateway_|AI_GATEWAY_API_KEY|AI_GATEWAY_BASE_URL|AI_GATEWAY_MODEL|CEREBRAS_API_KEY|CEREBRAS_MODEL|SECRET_OPENAI|atlas-openai|OPENAI_[[:alnum:]_]+|openai-compatible|api\.openai\.com|SECRET_GEMINI|api\.cerebras\.ai' -- . ':!tests' ':!docs' ':!README.md' ':!CHANGELOG.md' ':!.github/workflows/production-deploy.yml' ':!.github/workflows/production-verification.yml' ':!.github/workflows/propagate-native-ai-all-branches.yml' ':!scripts/migrate_legacy_native_ai.py' >&2 || true
            git grep -nIEi '_groq_json|settings\.groq_(strategy_model|model)|settings\.groq_api_key|GROQ_API_KEY|SECRET_GROQ|api\.groq\.com' -- app/strategy_ai.py app/daily_research.py app/ai_providers.py >&2 || true
            git reset --hard "$start_sha" >/dev/null 2>&1 || true
            git clean -fd >/dev/null 2>&1 || true
            failed+=("$branch: provider references remain after semantic migration; branch left unchanged")
            continue
          fi
          if ! verify_native_ai_impl; then
            git reset --hard "$start_sha" >/dev/null 2>&1 || true
            git clean -fd >/dev/null 2>&1 || true
            failed+=("$branch: Native AI implementation/import verification failed; branch left unchanged")
            continue
          fi
          if ! git diff --check; then
            git reset --hard "$start_sha" >/dev/null 2>&1 || true
            git clean -fd >/dev/null 2>&1 || true
            failed+=("$branch: whitespace validation failed; branch left unchanged")
            continue
          fi
          if [[ -z "$(git status --porcelain)" ]]; then
            skipped+=("$branch (already provider-free after verification)")
            continue
          fi
          git add -A
          git diff --cached --check
          git commit -m "Remove hosted AI wiring with targeted Native AI migration" >/dev/null
          new_sha="$(git rev-parse HEAD)"
          if update_existing_branch_ref "$branch" "$start_sha" "$new_sha"; then
            updated+=("$branch ($start_sha -> $new_sha)")
          else
            update_status=$?
            git reset --hard "$start_sha" >/dev/null 2>&1 || true
            git clean -fd >/dev/null 2>&1 || true
            if [[ "$update_status" -eq 2 ]]; then
              failure_reason="remote branch state unresolved after update attempt; intended commit was not confirmed and remote state may have changed"
            else
              failure_reason="requested update was not confirmed; workflow did not verify the intended commit on the remote"
            fi
            failed+=("$branch: $failure_reason")
            echo "FAILED branch reconciliation: $branch: $failure_reason" >&2
          fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/ | grep -v '^refs/remotes/origin/HEAD$' | sort)

          {
            echo "## Atlas Native AI branch propagation"
            echo
            echo "- Native AI cleanup commit: $NATIVE_AI_CLEANUP_COMMIT"
            echo "- Canonical Native AI source commit: $NATIVE_AI_CANONICAL_COMMIT"
            echo "- Branches updated: ${#updated[@]}"
            printf '  - %s\n' "${updated[@]:-none}"
            echo "- Branches skipped after implementation and provider checks: ${#skipped[@]}"
            printf '  - %s\n' "${skipped[@]:-none}"
            echo "- Temporary-ref cleanup warnings: ${#cleanup_warnings[@]}"
            printf '  - %s\n' "${cleanup_warnings[@]:-none}"
            echo "- Unresolved branches: ${#failed[@]}"
            printf '  - %s\n' "${failed[@]:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          # Mirror unresolved branches into normal job logs as well as the step summary.
          for failure in "${failed[@]}"; do
            echo "UNRESOLVED BRANCH: $failure" >&2
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error title=Repository-wide Native AI cleanup incomplete::${#failed[@]} branch(es) need reconciliation; see UNRESOLVED BRANCH log lines and step summary."
            exit 1
          fi
          echo "PASS: all enumerated branches were updated or passed explicit implementation and provider checks."
