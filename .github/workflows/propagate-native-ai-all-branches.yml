name: Propagate Atlas Native AI across branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/propagate-native-ai-all-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-native-ai-branch-propagation
  cancel-in-progress: false

jobs:
  propagate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact triggering commit with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Safely propagate reviewed Native AI changes
        shell: bash
        run: |
          set -euo pipefail
          NATIVE_AI_COMMIT="f5e303dad1a93ce1a33940b3e2b16d118897ebf6"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$NATIVE_AI_COMMIT^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --prune

          AI_PATHS=(
            ".env.example"
            ".github/workflows/production-deploy.yml"
            ".github/workflows/production-verification.yml"
            "app/ai_providers.py"
            "app/config.py"
            "app/daily_research.py"
            "app/native_ai.py"
            "app/strategy_ai.py"
            "app/templates/customer.html"
            "deploy/DEPLOY_WORKFLOW.md"
            "deploy/cloud-run-deploy.sh"
            "deploy/cloud-run-worker-deploy.sh"
            "deploy/cloud-run.env.example"
            "deploy/gcp-bootstrap.sh"
            "metadata.json"
            "scripts/check_ai_models.py"
            "scripts/check_native_ai.py"
            "scripts/verify_release.sh"
            "tests/test_ai_providers.py"
            "tests/test_audit_repair_regressions.py"
            "tests/test_check_ai_models_http.py"
            "tests/test_check_ai_models_import.py"
            "tests/test_daily_research.py"
            "tests/test_production_security_gates.py"
            "tests/test_prompt_safety_key_audit_3_10_46.py"
            "tests/test_release_diagnostics_security.py"
            "tests/test_release_security_inventory_3_10_45.py"
            "tests/test_strategy_ai.py"
          )

          scan_active_provider_refs() {
            local rc=0
            git grep -IlE 'gemini|GEMINI_API_KEY|GEMINI_MODEL|generativelanguage\.googleapis\.com|_gemini_json|settings\.gemini_api_key|SECRET_GEMINI|GROQ_API_KEY|CEREBRAS_API_KEY|AI_GATEWAY_API_KEY|api\.groq\.com|api\.cerebras\.ai' -- app scripts deploy .github/workflows .env.example metadata.json ':!.github/workflows/propagate-native-ai-all-branches.yml' || rc=$?
            if (( rc == 1 )); then return 0; fi
            if (( rc != 0 )); then return "$rc"; fi
          }

          declare -a updated=() skipped=() failed=()
          while IFS= read -r remote_ref; do
            [[ -n "$remote_ref" ]] || continue
            branch="${remote_ref#refs/remotes/origin/}"
            [[ "$branch" == "main" ]] && continue
            start_sha="$(git rev-parse "$remote_ref")"
            git checkout --detach "$start_sha" >/dev/null 2>&1

            before_refs="$(scan_active_provider_refs)" || { failed+=("$branch: provider scan errored; branch left unchanged"); continue; }
            if git merge-base --is-ancestor "$NATIVE_AI_COMMIT" "$start_sha"; then
              if [[ -n "$before_refs" ]]; then
                failed+=("$branch: canonical commit is in history but provider references remain; manual reconciliation required")
                continue
              fi
              if ! git cat-file -e "$start_sha:app/native_ai.py" 2>/dev/null; then
                failed+=("$branch: native_ai.py is missing despite canonical commit ancestry; manual reconciliation required")
                continue
              fi
              if ! git diff --quiet "$NATIVE_AI_COMMIT" "$start_sha" -- "${AI_PATHS[@]}"; then
                failed+=("$branch: Native AI files diverge from reviewed canonical implementation; preserving branch-specific changes for manual reconciliation")
                continue
              fi
              skipped+=("$branch (provider scan clean; Native AI files match reviewed canonical implementation)")
              continue
            fi

            if ! git cherry-pick "$NATIVE_AI_COMMIT" >"$RUNNER_TEMP/cherry-pick.log" 2>&1; then
              git cherry-pick --abort >/dev/null 2>&1 || true
              failed+=("$branch: canonical commit conflicts or cannot be cherry-picked; branch left unchanged")
              continue
            fi
            after_refs="$(scan_active_provider_refs)" || { git cherry-pick --abort >/dev/null 2>&1 || true; failed+=("$branch: post-change provider scan errored; branch left unchanged"); continue; }
            if [[ -n "$after_refs" ]]; then
              failed+=("$branch: provider references remain after cherry-pick; branch left unchanged")
              git cherry-pick --abort >/dev/null 2>&1 || true
              continue
            fi
            new_sha="$(git rev-parse HEAD)"
            if git push --force-with-lease="refs/heads/$branch:$start_sha" origin "HEAD:refs/heads/$branch"; then
              updated+=("$branch ($start_sha -> $new_sha)")
            else
              failed+=("$branch: push rejected or branch ref changed/deleted; no retry or branch recreation attempted")
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/ | grep -v '^refs/remotes/origin/HEAD$' | sort)

          {
            echo "## Atlas Native AI branch propagation"
            echo
            echo "- Canonical Native AI commit: $NATIVE_AI_COMMIT"
            echo "- Branches updated: ${#updated[@]}"
            printf '  - %s\n' "${updated[@]:-none}"
            echo "- Branches skipped after implementation and provider checks: ${#skipped[@]}"
            printf '  - %s\n' "${skipped[@]:-none}"
            echo "- Unresolved branches: ${#failed[@]}"
            printf '  - %s\n' "${failed[@]:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( ${#failed[@]} > 0 )); then
            echo "::error title=Repository-wide Native AI cleanup incomplete::Some branches need manual reconciliation; see workflow summary."
            exit 1
          fi
          echo "PASS: all enumerated branches were updated or passed explicit implementation and provider checks."
