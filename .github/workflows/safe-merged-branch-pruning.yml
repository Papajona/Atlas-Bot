name: Safe merged branch pruning

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Propagate Atlas Native AI across branches
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  prune:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        (
          github.event_name == 'push' &&
          !startsWith(github.event.head_commit.message, '[atlas-branch-prune-once-20261020]') &&
          !startsWith(github.event.head_commit.message, '[atlas-branch-prune-content-once-20261020]') &&
          !startsWith(github.event.head_commit.message, '[atlas-branch-prune-reviewed-once-20261020]') &&
          !startsWith(github.event.head_commit.message, '[atlas-branch-prune-verified-duplicates-once-20261020]')
        )
      )
    concurrency:
      group: atlas-branch-pruning
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Native AI propagation is successful before pruning
        id: pruning_guard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          skip_pruning=false

          # A main push that changes either watched file starts propagation and must wait.
          if [[ "$EVENT_NAME" == "push" ]]; then
            if ! changed_paths="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"; then
              skip_pruning=true
              echo "Unable to verify the push diff; preserving every branch."
            else
              while IFS= read -r changed_path; do
                case "$changed_path" in
                  scripts/migrate_legacy_native_ai.py|.github/workflows/propagate-native-ai-all-branches.yml)
                    skip_pruning=true
                    break
                    ;;
                esac
              done <<< "$changed_paths"
            fi
          fi

          # Validate the latest propagation run for push, manual dispatch, and successful
          # workflow_run events alike. Missing status, failed/cancelled runs, queued/running
          # work, or an unpropagated migration-file diff must never authorize deletion.
          if [[ "$skip_pruning" != true ]]; then
            if ! propagation_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow propagate-native-ai-all-branches.yml --branch main --json status,conclusion,headSha --limit 50)"; then
              skip_pruning=true
              echo "Unable to verify Native AI propagation status; preserving every branch."
            elif ! jq -e 'length > 0' <<< "$propagation_runs" >/dev/null; then
              skip_pruning=true
              echo "No Native AI propagation run is available as proof; preserving every branch."
            elif jq -e 'any(.[]; .status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested")' <<< "$propagation_runs" >/dev/null; then
              skip_pruning=true
              echo "Native AI propagation is queued or running; preserving branch refs until it completes."
            elif ! latest_success_sha="$(jq -er '.[0] | select(.status == "completed" and .conclusion == "success") | .headSha' <<< "$propagation_runs")"; then
              skip_pruning=true
              echo "Latest Native AI propagation did not succeed; preserving every branch."
            elif git merge-base --is-ancestor "$latest_success_sha" "$AFTER_SHA"; then
              if ! post_propagation_paths="$(git diff --name-only "$latest_success_sha" "$AFTER_SHA")"; then
                skip_pruning=true
                echo "Unable to verify changes since successful propagation; preserving every branch."
              else
                while IFS= read -r changed_path; do
                  case "$changed_path" in
                    scripts/migrate_legacy_native_ai.py|.github/workflows/propagate-native-ai-all-branches.yml)
                      skip_pruning=true
                      break
                      ;;
                  esac
                done <<< "$post_propagation_paths"
              fi
            elif ! git merge-base --is-ancestor "$AFTER_SHA" "$latest_success_sha"; then
              skip_pruning=true
              echo "Cannot prove the successful propagation covers this main commit; preserving every branch."
            fi
          fi

          if [[ "$skip_pruning" == true ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Branch refs will be pruned only after Native AI propagation is verified successful."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete only refs proven integrated into main
        if: steps.pruning_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/prune_safe_merged_branch_refs.py
