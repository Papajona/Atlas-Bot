name: Safe merged branch pruning

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Propagate Atlas Native AI across branches
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  prune:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        (
          github.event_name == 'push' &&
          !startsWith(github.event.head_commit.message, '[atlas-branch-prune-once-20261020]') &&
          !startsWith(github.event.head_commit.message, '[atlas-branch-prune-content-once-20261020]') &&
          !startsWith(github.event.head_commit.message, '[atlas-branch-prune-reviewed-once-20261020]') &&
          !startsWith(github.event.head_commit.message, '[atlas-branch-prune-verified-duplicates-once-20261020]')
        )
      )
    concurrency:
      group: atlas-branch-pruning
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Skip push-time pruning when Native AI propagation will update branch refs
        id: pruning_guard
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          changed_paths="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          skip_pruning=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              scripts/migrate_legacy_native_ai.py|.github/workflows/propagate-native-ai-all-branches.yml)
                skip_pruning=true
                break
                ;;
            esac
          done <<< "$changed_paths"

          # A later, unrelated main push can arrive while an earlier Native AI
          # propagation run is still updating refs. Never prune concurrently.
          if [[ "$skip_pruning" != true ]]; then
            if ! active_propagations="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow propagate-native-ai-all-branches.yml --branch main --json status --limit 50)"; then
              skip_pruning=true
              echo "Unable to verify Native AI propagation status; preserving every branch."
            elif jq -e 'any(.[]; .status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested")' <<< "$active_propagations" >/dev/null; then
              skip_pruning=true
              echo "Native AI propagation is queued or running; preserving branch refs until it completes."
            fi
          fi

          if [[ "$skip_pruning" == true ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Branch refs will be pruned only after Native AI propagation completes successfully."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete only refs proven integrated into main
        if: steps.pruning_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/prune_safe_merged_branch_refs.py
