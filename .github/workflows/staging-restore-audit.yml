name: Audit restored staging database

on:
  workflow_dispatch:
    inputs:
      restore_operation_id:
        description: Backup provider's real restore operation ID
        required: true
        type: string
      backup_reference:
        description: Immutable backup ID or archive URI that was restored
        required: true
        type: string
      restore_evidence_uri:
        description: Provider operation detail URL (https://) or immutable audit-log URI (gs://)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-staging-restore-audit
  cancel-in-progress: false

jobs:
  audit-restored-target:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT || secrets.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_STAGING_SUPABASE_PROJECT_REF }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_PRODUCTION_SUPABASE_PROJECT_REF }}
      STAGING_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_DATABASE_SECRET }}
      EXPECTED_RUNTIME_DB_ROLE: ${{ vars.ATLAS_STAGING_RUNTIME_DB_ROLE }}
      AUDIT_ARCHIVE_BUCKET: ${{ vars.ATLAS_STAGING_EVIDENCE_BUCKET }}
      RESTORE_OPERATION_ID: ${{ inputs.restore_operation_id }}
      BACKUP_REFERENCE: ${{ inputs.backup_reference }}
      RESTORE_EVIDENCE_URI: ${{ inputs.restore_evidence_uri }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require protected same-project staging configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          : "${GCP_PROJECT_ID:?Missing GCP_PROJECT_ID}"
          : "${GCP_REGION:?Missing GCP_REGION variable or secret}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Missing GCP_WORKLOAD_IDENTITY_PROVIDER variable or secret}"
          : "${GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT:?Missing GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT variable or secret}"
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]] || {
            echo "BLOCKED: workload identity provider must be a full Google Cloud resource name" >&2
            exit 1
          }
          [[ "$GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT" == *@*.iam.gserviceaccount.com ]] || {
            echo "BLOCKED: staging restore audit identity must be a Google service-account email" >&2
            exit 1
          }
          : "${STAGING_SUPABASE_PROJECT_REF:?Missing ATLAS_STAGING_SUPABASE_PROJECT_REF}"
          : "${PRODUCTION_SUPABASE_PROJECT_REF:?Set ATLAS_PRODUCTION_SUPABASE_PROJECT_REF to the current project ref (same as staging for the free single-project setup)}"
          : "${STAGING_DATABASE_SECRET:?Missing ATLAS_STAGING_DATABASE_SECRET}"
          : "${EXPECTED_RUNTIME_DB_ROLE:?Missing ATLAS_STAGING_RUNTIME_DB_ROLE}"
          : "${AUDIT_ARCHIVE_BUCKET:?Missing ATLAS_STAGING_EVIDENCE_BUCKET}"
          : "${RESTORE_OPERATION_ID:?A real restore operation ID is required}"
          : "${BACKUP_REFERENCE:?An immutable backup reference is required}"
          : "${RESTORE_EVIDENCE_URI:?A provider restore evidence URL/URI is required}"
          # The free-stage deployment uses one Supabase project by design.
          # Both refs are still required so the audit records the chosen topology.
          if [[ "$STAGING_SUPABASE_PROJECT_REF" == "$PRODUCTION_SUPABASE_PROJECT_REF" ]]; then
            echo "Same-project staging selected; runtime must remain paper-only and the database restore must not overwrite an active source."
          else
            echo "Distinct staging project selected."
          fi
          [[ "$STAGING_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$PRODUCTION_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$EXPECTED_RUNTIME_DB_ROLE" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]
          case "$RESTORE_EVIDENCE_URI" in
            https://*) ;;
            gs://*) ;;
            *) echo "BLOCKED: restore evidence must be an https:// or gs:// URI"; exit 1 ;;
          esac
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT || secrets.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      - name: Download provider restore-operation record and staging database secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$RESTORE_EVIDENCE_URI" == gs://* ]]; then
            gcloud storage cp "$RESTORE_EVIDENCE_URI" "$RUNNER_TEMP/restore-operation-evidence.json"
          elif [[ "$RESTORE_EVIDENCE_URI" == https://* ]]; then
            python - "$RESTORE_EVIDENCE_URI" <<'PY'
          import sys
          from urllib.parse import urlsplit
          url = urlsplit(sys.argv[1])
          host = (url.hostname or "").lower()
          allowed = (
              host == "api.supabase.com"
              or host.endswith(".supabase.com")
              or host == "storage.googleapis.com"
              or host.endswith(".storage.googleapis.com")
          )
          if url.scheme != "https" or not allowed:
              raise SystemExit("BLOCKED: HTTPS restore evidence host is not an approved Supabase/GCS provider host")
          PY
            curl --fail --silent --show-error --location --max-redirs 0 \
              --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 30 \
              "$RESTORE_EVIDENCE_URI" -o "$RUNNER_TEMP/restore-operation-evidence.json"
          else
            echo "BLOCKED: restore evidence must be a gs:// object or approved provider HTTPS URL" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/restore-operation-evidence.json"
          gcloud secrets versions access latest \
            --secret="$STAGING_DATABASE_SECRET" \
            --project="$GCP_PROJECT_ID" > "$RUNNER_TEMP/atlas-staging-db-url"
          test -s "$RUNNER_TEMP/atlas-staging-db-url"
          chmod 600 "$RUNNER_TEMP/atlas-staging-db-url"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify provider restore-operation identity and status
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/verify_restore_operation_evidence.py \
            --input "$RUNNER_TEMP/restore-operation-evidence.json" \
            --operation-id "$RESTORE_OPERATION_ID" \
            --backup-reference "$BACKUP_REFERENCE" \
            --target-project-ref "$STAGING_SUPABASE_PROJECT_REF" \
            --output "$RUNNER_TEMP/restore-evidence-verification.json"
          evidence_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["evidence_sha256"])' "$RUNNER_TEMP/restore-evidence-verification.json")"
          echo "RESTORE_EVIDENCE_SHA256=$evidence_sha" >> "$GITHUB_ENV"
          echo "VERIFIED_RESTORE_TARGET_PROJECT_REF=$STAGING_SUPABASE_PROJECT_REF" >> "$GITHUB_ENV"
      - name: Run read-only restored-database invariants
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_PRODUCTION_SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat "$RUNNER_TEMP/atlas-staging-db-url")"
          python scripts/verify_staging_restore.py \
            --restore-operation-id "$RESTORE_OPERATION_ID" \
            --backup-reference "$BACKUP_REFERENCE" \
            --restore-evidence-uri "$RESTORE_EVIDENCE_URI" \
            --restore-evidence-sha256 "$RESTORE_EVIDENCE_SHA256" \
            --verified-target-project-ref "$VERIFIED_RESTORE_TARGET_PROJECT_REF" \
            --expected-runtime-role "$EXPECTED_RUNTIME_DB_ROLE" \
            --expected-revision 0053_supabase_public_default_acl_lockdown \
            --output "$RUNNER_TEMP/staging-restore-audit.json"
      - name: Archive audit output even if ledger invariants failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out_dir="gs://$AUDIT_ARCHIVE_BUCKET/staging-restore-audits/$GITHUB_RUN_ID-$GITHUB_SHA"
          archived=0
          for file in \
            "$RUNNER_TEMP/restore-evidence-verification.json" \
            "$RUNNER_TEMP/staging-restore-audit.json"; do
            if [[ -s "$file" ]]; then
              gcloud storage cp "$file" "$out_dir/$(basename "$file")"
              archived=1
            fi
          done
          if [[ "$archived" -eq 0 ]]; then
            echo "No audit evidence report was produced. Restore is not certified."
          fi
      - name: Preserve audit report as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-staging-restore-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/restore-evidence-verification.json
            ${{ runner.temp }}/staging-restore-audit.json
          if-no-files-found: warn
          retention-days: 90
