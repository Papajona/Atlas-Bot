name: Audit restored staging database
run-name: Cloud SQL restore audit (${{ inputs.restore_operation_id }})

on:
  workflow_dispatch:
    inputs:
      restore_operation_id:
        description: Backup provider's real restore operation ID
        required: true
        type: string
      backup_reference:
        description: Generation-pinned Cloud SQL import object or Supabase backup reference
        required: true
        type: string
      source_backup_reference:
        description: Original generation-pinned source backup copied into the immutable Cloud SQL import object
        required: false
        type: string
      sanitized_backup_reference:
        description: Generation-pinned sanitized SQL candidate used to create the Cloud SQL import object
        required: false
        type: string
      source_supabase_project_ref:
        description: Supabase project ref evidenced by the original pg_dump connection logs
        required: false
        type: string
      restore_evidence_uri:
        description: Supabase provider evidence URL/URI; ignored for Cloud SQL, which fetches the operation from the authenticated Cloud SQL Admin API
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-staging-restore-audit
  cancel-in-progress: false

jobs:
  audit-restored-target:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT || secrets.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT }}
      RESTORE_TARGET_KIND: ${{ vars.ATLAS_STAGING_RESTORE_TARGET_KIND || 'supabase' }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_STAGING_SUPABASE_PROJECT_REF }}
      CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.ATLAS_STAGING_CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      CLOUD_SQL_DATABASE: ${{ vars.ATLAS_STAGING_CLOUD_SQL_DATABASE }}
      SOURCE_SUPABASE_PROJECT_REF: ${{ inputs.source_supabase_project_ref }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_PRODUCTION_SUPABASE_PROJECT_REF }}
      STAGING_AUDIT_DATABASE_SECRET: ${{ vars.ATLAS_STAGING_AUDIT_DATABASE_SECRET }}
      EXPECTED_AUDIT_DB_ROLE: ${{ vars.ATLAS_STAGING_AUDIT_DB_ROLE }}
      AUDIT_ARCHIVE_BUCKET: ${{ vars.ATLAS_STAGING_EVIDENCE_BUCKET }}
      RESTORE_OPERATION_ID: ${{ inputs.restore_operation_id }}
      BACKUP_REFERENCE: ${{ inputs.backup_reference }}
      SOURCE_BACKUP_REFERENCE: ${{ inputs.source_backup_reference }}
      SANITIZED_BACKUP_REFERENCE: ${{ inputs.sanitized_backup_reference }}
      SOURCE_PREPARED_SQL_CANONICAL_SHA256: ${{ vars.ATLAS_CLOUD_SQL_SOURCE_PREPARED_CANONICAL_SHA256 }}
      RESTORE_EVIDENCE_URI: ${{ inputs.restore_evidence_uri }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require protected non-production restore target and audit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          : "${GCP_PROJECT_ID:?Missing GCP_PROJECT_ID}"
          : "${GCP_REGION:?Missing GCP_REGION variable or secret}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Missing GCP_WORKLOAD_IDENTITY_PROVIDER variable or secret}"
          : "${GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT:?Missing GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT variable or secret}"
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]] || {
            echo "BLOCKED: workload identity provider must be a full Google Cloud resource name" >&2
            exit 1
          }
          [[ "$GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT" == *@*.iam.gserviceaccount.com ]] || {
            echo "BLOCKED: staging restore audit identity must be a Google service-account email" >&2
            exit 1
          }
          : "${STAGING_AUDIT_DATABASE_SECRET:?Missing ATLAS_STAGING_AUDIT_DATABASE_SECRET}"
          : "${EXPECTED_AUDIT_DB_ROLE:?Missing ATLAS_STAGING_AUDIT_DB_ROLE}"
          : "${AUDIT_ARCHIVE_BUCKET:?Missing ATLAS_STAGING_EVIDENCE_BUCKET}"
          : "${RESTORE_OPERATION_ID:?A real restore operation ID is required}"
          : "${BACKUP_REFERENCE:?An immutable backup reference is required}"
          [[ "$EXPECTED_AUDIT_DB_ROLE" == "atlas_audit_reader" ]] || { echo "BLOCKED: restore audit must use atlas_audit_reader"; exit 1; }
          if [[ "$RESTORE_TARGET_KIND" == "supabase" ]]; then
            : "${RESTORE_EVIDENCE_URI:?A provider restore evidence URL/URI is required for Supabase}"
            case "$RESTORE_EVIDENCE_URI" in https://*|gs://*) ;; *) echo "BLOCKED: Supabase restore evidence must be HTTPS or GCS"; exit 1 ;; esac
          elif [[ "$RESTORE_TARGET_KIND" != "cloud_sql" ]]; then
            echo "BLOCKED: ATLAS_STAGING_RESTORE_TARGET_KIND must be supabase or cloud_sql" >&2
            exit 1
          fi
          if [[ "$RESTORE_TARGET_KIND" == "supabase" ]]; then
            : "${STAGING_SUPABASE_PROJECT_REF:?Missing ATLAS_STAGING_SUPABASE_PROJECT_REF}"
            : "${PRODUCTION_SUPABASE_PROJECT_REF:?Missing ATLAS_PRODUCTION_SUPABASE_PROJECT_REF}"
            [[ "$STAGING_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ && "$PRODUCTION_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
            [[ "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" ]] || { echo "BLOCKED: restore target must not be the active production project"; exit 1; }
          elif [[ "$RESTORE_TARGET_KIND" == "cloud_sql" ]]; then
            : "${SOURCE_BACKUP_REFERENCE:?Cloud SQL audit requires the original generation-pinned source backup reference}"
            : "${SANITIZED_BACKUP_REFERENCE:?Cloud SQL audit requires the generation-pinned sanitized SQL candidate reference}"
            : "${SOURCE_PREPARED_SQL_CANONICAL_SHA256:?Cloud SQL audit requires the protected source SQL fingerprint variable}"
            [[ "$SOURCE_PREPARED_SQL_CANONICAL_SHA256" =~ ^[a-f0-9]{64}$ ]] || {
              echo "BLOCKED: source prepared SQL fingerprint must be a reviewed lowercase SHA-256" >&2
              exit 1
            }
            [[ "$SANITIZED_BACKUP_REFERENCE" =~ ^gs://atlas-staging-510915-db-backups/sanitized-imports/[^#]+[.]sql#[1-9][0-9]*$ ]] || {
              echo "BLOCKED: sanitized candidate must be generation-pinned under sanitized-imports/" >&2
              exit 1
            }
            [[ "$SOURCE_BACKUP_REFERENCE" =~ ^gs://atlas-staging-510915-db-backups/.+#([1-9][0-9]*)$ ]] || {
              echo "BLOCKED: original Cloud SQL source backup must be generation-pinned in the approved backup bucket" >&2
              exit 1
            }
            source_object_path="${SOURCE_BACKUP_REFERENCE#gs://atlas-staging-510915-db-backups/}"
            [[ "$source_object_path" != restore-imports/* ]] || {
              echo "BLOCKED: source backup cannot itself be an import-staging object" >&2
              exit 1
            }
            [[ "$BACKUP_REFERENCE" =~ ^gs://atlas-staging-510915-db-backups/restore-imports/[a-f0-9]{64}-[a-f0-9]{32}[.]sql([.]gz)?#[1-9][0-9]*$ ]] || {
              echo "BLOCKED: Cloud SQL audit reference must identify the immutable import object" >&2
              exit 1
            }
            : "${CLOUD_SQL_INSTANCE_CONNECTION_NAME:?Missing ATLAS_STAGING_CLOUD_SQL_INSTANCE_CONNECTION_NAME}"
            : "${CLOUD_SQL_DATABASE:?Missing ATLAS_STAGING_CLOUD_SQL_DATABASE}"
            : "${SOURCE_SUPABASE_PROJECT_REF:?Missing original pg_dump source Supabase project ref}"
            [[ "$SOURCE_SUPABASE_PROJECT_REF" == "wauaelzyugjuepmrewaw" ]] || {
              echo "BLOCKED: Supabase source project ref does not match the original pg_dump log evidence" >&2
              exit 1
            }
            [[ "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" =~ ^atlas-staging-510915:europe-west1:[a-z0-9-]+$ ]] || {
              echo "BLOCKED: recovery Cloud SQL instance must be in atlas-staging-510915:europe-west1" >&2
              exit 1
            }
            [[ "$CLOUD_SQL_DATABASE" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,62}$ ]] || {
              echo "BLOCKED: recovery database name is invalid" >&2
              exit 1
            }
          else
            echo "BLOCKED: ATLAS_STAGING_RESTORE_TARGET_KIND must be supabase or cloud_sql"; exit 1
          fi
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT || secrets.GCP_STAGING_RESTORE_AUDIT_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      - name: Install pinned PostgreSQL 17 client for custom archive verification
        if: env.RESTORE_TARGET_KIND == 'cloud_sql'
        run: bash scripts/install_pinned_postgresql_client.sh
      - name: Fetch authenticated Cloud SQL operation and verify immutable GCS backup bytes
        if: env.RESTORE_TARGET_KIND == 'cloud_sql'
        shell: bash
        run: |
          set -euo pipefail
          # Fetch the operation directly from Cloud SQL Admin API using this job's
          # Workload Identity. Never trust a dispatcher-supplied JSON evidence file.
          gcloud sql operations describe "$RESTORE_OPERATION_ID" --project="$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/restore-operation-evidence.json"
          test -s "$RUNNER_TEMP/restore-operation-evidence.json"
          echo "RESTORE_EVIDENCE_URI=https://sqladmin.googleapis.com/sql/v1beta4/projects/$GCP_PROJECT_ID/operations/$RESTORE_OPERATION_ID" >> "$GITHUB_ENV"

          [[ "$BACKUP_REFERENCE" =~ ^gs://atlas-staging-510915-db-backups/.+#([1-9][0-9]*)$ ]] || {
            echo "BLOCKED: Cloud SQL backup reference must pin an exact GCS generation using #<generation>" >&2
            exit 1
          }
          backup_object_uri="${BACKUP_REFERENCE%%#*}"
          # Describe the exact generation, not whichever version is live today.
          gcloud storage objects describe "$BACKUP_REFERENCE" --format=json > "$RUNNER_TEMP/recovery-backup-object.json"
          gcloud storage buckets describe gs://atlas-staging-510915-db-backups --format=json > "$RUNNER_TEMP/recovery-backup-bucket.json"
          gcloud storage objects describe "$SOURCE_BACKUP_REFERENCE" --format=json > "$RUNNER_TEMP/source-backup-object.json"
          PYTHONPATH=. python scripts/verify_cloud_sql_supabase_source_provenance.py \
            --source-backup-reference "$SOURCE_BACKUP_REFERENCE" \
            --source-project-ref "$SOURCE_SUPABASE_PROJECT_REF" \
            --source-database postgres \
            --object-metadata "$RUNNER_TEMP/source-backup-object.json" \
            --bucket-metadata "$RUNNER_TEMP/recovery-backup-bucket.json" \
            --output "$RUNNER_TEMP/cloud-sql-source-provenance.json"
          python - "$backup_object_uri" "$RUNNER_TEMP/recovery-backup-versions.json" <<'PY'
          import json
          import subprocess
          import sys
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          object_uri, output_path = sys.argv[1:]
          bucket, object_name = object_uri[5:].split("/", 1)
          token = subprocess.check_output(["gcloud", "auth", "print-access-token"], text=True).strip()
          if not token:
              raise SystemExit("BLOCKED: Google Cloud access token is unavailable")
          items = []
          page_token = None
          while True:
              query = {
                  "versions": "true",
                  "prefix": object_name,
                  "maxResults": "1000",
                  "fields": "items(name,generation,timeCreated,timeDeleted),nextPageToken",
              }
              if page_token:
                  query["pageToken"] = page_token
              url = (
                  "https://storage.googleapis.com/storage/v1/b/"
                  + quote(bucket, safe="")
                  + "/o?"
                  + urlencode(query)
              )
              request = Request(url, headers={"Authorization": "Bearer " + token})
              with urlopen(request, timeout=30) as response:
                  page = json.loads(response.read().decode("utf-8"))
              items.extend(page.get("items", []))
              page_token = page.get("nextPageToken")
              if not page_token:
                  break
          with open(output_path, "w", encoding="utf-8") as handle:
              json.dump({"items": items}, handle, sort_keys=True)
          PY
          PYTHONPATH=. python scripts/verify_cloud_sql_backup_binding.py \
            --backup-reference "$BACKUP_REFERENCE" \
            --object-metadata "$RUNNER_TEMP/recovery-backup-object.json" \
            --bucket-metadata "$RUNNER_TEMP/recovery-backup-bucket.json" \
            --object-versions "$RUNNER_TEMP/recovery-backup-versions.json" \
            --operation-record "$RUNNER_TEMP/restore-operation-evidence.json" \
            --output "$RUNNER_TEMP/cloud-sql-backup-binding.json"
          # Verify source identity and the approved sanitizer result independently.
          # Sanitized data must differ from the source archive; byte-equality with
          # the original archive would re-introduce customer credentials and PII.
          gcloud storage cp "$SOURCE_BACKUP_REFERENCE" "$RUNNER_TEMP/cloud-sql-source-backup"
          gcloud storage cp "$SANITIZED_BACKUP_REFERENCE" "$RUNNER_TEMP/sanitized-candidate.sql"
          gcloud storage cp "$BACKUP_REFERENCE" "$RUNNER_TEMP/cloud-sql-import-source"
          PYTHONPATH=. python scripts/prepare_cloud_sql_import_dump.py \
            --input "$RUNNER_TEMP/cloud-sql-source-backup" \
            --output "$RUNNER_TEMP/cloud-sql-source-prepared.sql"
          PYTHONPATH=. python scripts/verify_cloud_sql_sanitized_artifacts.py \
            --source-backup-reference "$SOURCE_BACKUP_REFERENCE" \
            --source-prepared-sql "$RUNNER_TEMP/cloud-sql-source-prepared.sql" \
            --expected-source-prepared-canonical-sha256 "$SOURCE_PREPARED_SQL_CANONICAL_SHA256" \
            --sanitized-backup-reference "$SANITIZED_BACKUP_REFERENCE" \
            --sanitized-sql "$RUNNER_TEMP/sanitized-candidate.sql" \
            --imported-sql "$RUNNER_TEMP/cloud-sql-import-source" \
            --output "$RUNNER_TEMP/cloud-sql-sanitized-import-verification.json"
          # The exact sanitized import object must also pass the database-redirection scanner.
          PYTHONPATH=. python scripts/verify_cloud_sql_import_dump.py \
            --input "$RUNNER_TEMP/cloud-sql-import-source" \
            --output "$RUNNER_TEMP/cloud-sql-import-dump-verification.json"
      - name: Download provider restore-operation record and dedicated audit database secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$RESTORE_TARGET_KIND" == "cloud_sql" ]]; then
            # The preceding step already fetched the authenticated Cloud SQL API response.
            test -s "$RUNNER_TEMP/restore-operation-evidence.json"
          elif [[ "$RESTORE_EVIDENCE_URI" == gs://* ]]; then
            gcloud storage cp "$RESTORE_EVIDENCE_URI" "$RUNNER_TEMP/restore-operation-evidence.json"
          elif [[ "$RESTORE_EVIDENCE_URI" == https://* ]]; then
            python - "$RESTORE_EVIDENCE_URI" <<'PY'
          import sys
          from urllib.parse import urlsplit
          url = urlsplit(sys.argv[1])
          host = (url.hostname or "").lower()
          allowed = (
              host == "api.supabase.com"
              or host.endswith(".supabase.com")
              or host == "storage.googleapis.com"
              or host.endswith(".storage.googleapis.com")
          )
          if url.scheme != "https" or not allowed:
              raise SystemExit("BLOCKED: HTTPS restore evidence host is not an approved Supabase/GCS provider host")
          PY
            curl --fail --silent --show-error --location --max-redirs 0 \
              --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 30 \
              "$RESTORE_EVIDENCE_URI" -o "$RUNNER_TEMP/restore-operation-evidence.json"
          else
            echo "BLOCKED: restore evidence must be a gs:// object or approved provider HTTPS URL" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/restore-operation-evidence.json"
          gcloud secrets versions access latest \
            --secret="$STAGING_AUDIT_DATABASE_SECRET" \
            --project="$GCP_PROJECT_ID" > "$RUNNER_TEMP/atlas-staging-audit-db-url"
          test -s "$RUNNER_TEMP/atlas-staging-audit-db-url"
          chmod 600 "$RUNNER_TEMP/atlas-staging-audit-db-url"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify provider restore-operation identity and status
        shell: bash
        run: |
          set -euo pipefail
          evidence_args=(--target-kind "$RESTORE_TARGET_KIND")
          if [[ "$RESTORE_TARGET_KIND" == "supabase" ]]; then
            evidence_args+=(--target-project-ref "$STAGING_SUPABASE_PROJECT_REF")
          else
            evidence_args+=(
              --target-instance-connection-name "$CLOUD_SQL_INSTANCE_CONNECTION_NAME"
              --target-database "$CLOUD_SQL_DATABASE"
            )
          fi
          PYTHONPATH=. python scripts/verify_restore_operation_evidence.py \
            --input "$RUNNER_TEMP/restore-operation-evidence.json" \
            --operation-id "$RESTORE_OPERATION_ID" \
            --backup-reference "$BACKUP_REFERENCE" \
            "${evidence_args[@]}" \
            --output "$RUNNER_TEMP/restore-evidence-verification.json"
          evidence_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["evidence_sha256"])' "$RUNNER_TEMP/restore-evidence-verification.json")"
          echo "RESTORE_EVIDENCE_SHA256=$evidence_sha" >> "$GITHUB_ENV"
          if [[ "$RESTORE_TARGET_KIND" == "supabase" ]]; then
            echo "VERIFIED_RESTORE_TARGET_PROJECT_REF=$STAGING_SUPABASE_PROJECT_REF" >> "$GITHUB_ENV"
          else
            echo "VERIFIED_RESTORE_TARGET_INSTANCE=$CLOUD_SQL_INSTANCE_CONNECTION_NAME" >> "$GITHUB_ENV"
          fi
      - name: Run read-only restored-database invariants
        env:
          RESTORE_TARGET_KIND: ${{ vars.ATLAS_STAGING_RESTORE_TARGET_KIND || 'supabase' }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_PRODUCTION_SUPABASE_PROJECT_REF }}
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.ATLAS_STAGING_CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          CLOUD_SQL_DATABASE: ${{ vars.ATLAS_STAGING_CLOUD_SQL_DATABASE }}
          SOURCE_SUPABASE_PROJECT_REF: ${{ vars.ATLAS_PRODUCTION_SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESTORE_TARGET_KIND" == "cloud_sql" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends golang-go
            mkdir -p "$RUNNER_TEMP/bin"
            GOBIN="$RUNNER_TEMP/bin" go install github.com/GoogleCloudPlatform/cloud-sql-proxy/v2@v2.18.2
            gcloud sql instances describe "${CLOUD_SQL_INSTANCE_CONNECTION_NAME##*:}" --project="$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/cloud-sql-instance.json"
            python - "$RUNNER_TEMP/cloud-sql-instance.json" "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          observed=f'{d.get("project","")}:{d.get("region","")}:{d.get("name","")}'
          if observed != sys.argv[2] or d.get("state") != "RUNNABLE":
              raise SystemExit("BLOCKED: Cloud SQL instance identity/state does not match configured recovery target")
          PY
            gcloud sql databases describe "$CLOUD_SQL_DATABASE" --instance="${CLOUD_SQL_INSTANCE_CONNECTION_NAME##*:}" --project="$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/cloud-sql-database.json"
            "$RUNNER_TEMP/bin/cloud-sql-proxy" --address 127.0.0.1 --port 5432 "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" > "$RUNNER_TEMP/cloud-sql-proxy.log" 2>&1 &
            proxy_pid=$!
            trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 30); do
              if timeout 1 bash -c '</dev/tcp/127.0.0.1/5432' 2>/dev/null; then break; fi
              if [[ "$attempt" -eq 30 ]]; then cat "$RUNNER_TEMP/cloud-sql-proxy.log" >&2; exit 1; fi
              sleep 2
            done
          fi
          export DATABASE_URL="$(cat "$RUNNER_TEMP/atlas-staging-audit-db-url")"
          verified_args=()
          if [[ "$RESTORE_TARGET_KIND" == "cloud_sql" ]]; then
            verified_args+=(--verified-target-instance-connection-name "$VERIFIED_RESTORE_TARGET_INSTANCE")
          else
            verified_args+=(--verified-target-project-ref "$VERIFIED_RESTORE_TARGET_PROJECT_REF")
          fi
          python scripts/verify_staging_restore.py \
            --restore-operation-id "$RESTORE_OPERATION_ID" \
            --backup-reference "$BACKUP_REFERENCE" \
            --restore-evidence-uri "$RESTORE_EVIDENCE_URI" \
            --restore-evidence-sha256 "$RESTORE_EVIDENCE_SHA256" \
            "${verified_args[@]}" \
            --expected-audit-role "$EXPECTED_AUDIT_DB_ROLE" \
            --expected-revision 0062_customer_benchmark_capture \
            --output "$RUNNER_TEMP/staging-restore-audit.json"
      - name: Archive audit output even if ledger invariants failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out_dir="gs://$AUDIT_ARCHIVE_BUCKET/staging-restore-audits/$GITHUB_RUN_ID-$GITHUB_SHA"
          archived=0
          for file in \
            "$RUNNER_TEMP/restore-operation-evidence.json" \
            "$RUNNER_TEMP/restore-evidence-verification.json" \
            "$RUNNER_TEMP/staging-restore-audit.json" \
            "$RUNNER_TEMP/recovery-backup-object.json" \
            "$RUNNER_TEMP/recovery-backup-bucket.json" \
            "$RUNNER_TEMP/recovery-backup-versions.json" \
            "$RUNNER_TEMP/cloud-sql-backup-binding.json" \
            "$RUNNER_TEMP/cloud-sql-source-provenance.json" \
            "$RUNNER_TEMP/source-backup-object.json" \
            "$RUNNER_TEMP/cloud-sql-sanitized-import-verification.json" \
            "$RUNNER_TEMP/cloud-sql-import-dump-verification.json"; do
            if [[ -s "$file" ]]; then
              gcloud storage cp "$file" "$out_dir/$(basename "$file")"
              archived=1
            fi
          done
          if [[ "$archived" -eq 0 ]]; then
            echo "No audit evidence report was produced. Restore is not certified."
          fi
      - name: Preserve audit report as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-staging-restore-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/restore-operation-evidence.json
            ${{ runner.temp }}/restore-evidence-verification.json
            ${{ runner.temp }}/staging-restore-audit.json
            ${{ runner.temp }}/recovery-backup-object.json
            ${{ runner.temp }}/recovery-backup-bucket.json
            ${{ runner.temp }}/recovery-backup-versions.json
            ${{ runner.temp }}/cloud-sql-backup-binding.json
            ${{ runner.temp }}/cloud-sql-source-provenance.json
            ${{ runner.temp }}/source-backup-object.json
            ${{ runner.temp }}/cloud-sql-sanitized-import-verification.json
            ${{ runner.temp }}/cloud-sql-import-dump-verification.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove audit database credentials from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/atlas-staging-audit-db-url"
